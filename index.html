        (\"away\", game.away, game.away_batting, game.home_batting, game.away_staff),\n        (\"home\", game.home, game.home_batting, game.away_batting, game.home_staff),\n    ):\n        sides[key] = {\n            \"team\": team.name,\n            \"runs\": batting.runs,\n            \"hits\": sum(p.pa.outcome.is_hit for p in batting.plays),\n            \"lob\": batting.left_on_base,\n            \"batting\": _batting(team, batting),\n            \"pitching\": _pitching(team, staff.used, against, game),\n        }\n    lines = {\n        key: [_runs_in(batting, inning) for inning in range(1, game.innings + 1)]\n        for key, batting in ((\"away\", game.away_batting), (\"home\", game.home_batting))\n    }\n    return {\n        \"day\": game.day,\n        \"innings\": game.innings,\n        \"finished\": game.finished,\n        \"lines\": lines,\n        **sides,\n    }\n\n\ndef _runs_in(batting: GameResult, inning: int) -> int | None:\n    \"\"\"Runs a team scored in an inning, or None if they didn't bat in it.\"\"\"\n    batted = any(p.inning == inning for p in batting.plays) or any(\n        i == inning for i, _ in batting.steals\n    )\n    return batting.runs_in_inning(inning) if batted else None\n","veeone/bullpen.py":"\"\"\"Running a pitching staff during a game: when to pull the starter, who comes in.\n\nRules (all knobs below):\n    Starter   - stays in until he reaches his pitch limit, which sta sets\n                (STARTER_PITCH_LIMIT at sta 50, more or less by sta), or he's\n                getting shelled (BLOWUP_RUNS allowed). Changes happen between batters.\n    Relievers - usually one inning: replaced at the start of the next inning,\n                or mid-inning if they pass their own (sta-based) pitch limit.\n    Who's next - late (7th+) and close (within CLOSE_GAME runs): the best rested\n                reliever (RP1 first). Otherwise: the worst rested one (mop-up).\n                Relievers who didn't pitch yesterday are preferred either way.\n    Closer    - comes in to start the 9th or later in a save situation\n                (leading by 1-3), if rested.\n    Rest      - a reliever can't pitch if he threw TIRED_PITCHES or more the day\n                before, or would be pitching a third day in a row.\n    If no reliever is rested, the closer comes in only in the 9th or later with\n    the game within a run; otherwise whoever is pitching stays in.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import Counter\nfrom collections.abc import Callable\nfrom dataclasses import dataclass, field\n\nfrom veeone.atbat import PlateAppearance\nfrom veeone.odds import rating_gap\nfrom veeone.person import Person, PitcherRatings\nfrom veeone.team import Team, pitcher_quality\n\n# ---------------------------------------------------------------------------\n# Tuning knobs\n# ---------------------------------------------------------------------------\n\nSTARTER_PITCH_LIMIT = 92  # at sta 50\nSTARTER_STA_PITCHES = 10  # per 10 points of sta\nRELIEVER_PITCH_LIMIT = 25\nRELIEVER_STA_PITCHES = 5\nBLOWUP_RUNS = 6  # a starter who has allowed this many comes out\nCLOSE_GAME = 3  # runs\nLATE_INNING = 7\nSAVE_LEAD = range(1, 4)  # leading by 1-3\nTIRED_PITCHES = 30  # a reliever who threw this many yesterday rests today\n\n\ndef _sta(pitcher: Person) -> int:\n    r = pitcher.ratings\n    assert isinstance(r, PitcherRatings)\n    return r.sta\n\n\ndef starter_pitch_limit(pitcher: Person) -> int:\n    return round(STARTER_PITCH_LIMIT + STARTER_STA_PITCHES * rating_gap(_sta(pitcher)))\n\n\ndef reliever_pitch_limit(pitcher: Person) -> int:\n    return round(RELIEVER_PITCH_LIMIT + RELIEVER_STA_PITCHES * rating_gap(_sta(pitcher)))\n\n\n# ---------------------------------------------------------------------------\n# Rest between games\n# ---------------------------------------------------------------------------\n\n\n@dataclass\nclass Workload:\n    \"\"\"Pitches each pitcher threw, by day (game number), to decide who's rested.\"\"\"\n\n    pitches: dict[int, dict[int, int]] = field(default_factory=dict)  # id -> {day: pitches}\n\n    def log(self, day: int, game_pitches: Counter[int]) -> None:\n        for pitcher_id, count in game_pitches.items():\n            self.pitches.setdefault(pitcher_id, {})[day] = count\n\n    def is_rested(self, pitcher: Person, day: int) -> bool:\n        history = self.pitches.get(id(pitcher), {})\n        yesterday = history.get(day - 1, 0)\n        two_days_ago = history.get(day - 2, 0)\n        if yesterday >= TIRED_PITCHES:\n            return False\n        return not (yesterday and two_days_ago)\n\n    def is_fresh(self, pitcher: Person, day: int) -> bool:\n        \"\"\"Didn't pitch at all yesterday.\"\"\"\n        return not self.pitches.get(id(pitcher), {}).get(day - 1, 0)\n\n    def checker(self, day: int) -> Callable[[Person], bool]:\n        return lambda pitcher: self.is_rested(pitcher, day)\n\n    def freshness(self, day: int) -> Callable[[Person], bool]:\n        return lambda pitcher: self.is_fresh(pitcher, day)\n\n\n# ---------------------------------------------------------------------------\n# In-game manager\n# ---------------------------------------------------------------------------\n\n\nclass PitchingManager:\n    \"\"\"One team's pitching decisions for one game (a `season.PitcherSource`).\"\"\"\n\n    def __init__(\n        self,\n        team: Team,\n        starter: Person,\n        is_rested: Callable[[Person], bool] = lambda _: True,\n        is_fresh: Callable[[Person], bool] = lambda _: True,\n    ):\n        \"\"\"is_rested: can pitch today at all. is_fresh: didn't pitch yesterday\n        (preferred, so the best relievers aren't used every single day).\"\"\"\n        self.team = team\n        self.starter = starter\n        self.is_rested = is_rested\n        self.is_fresh = is_fresh\n        self.current = starter\n        self.used: list[Person] = [starter]  # in order of appearance\n        self.pitches: Counter[int] = Counter()  # id -> pitches this game\n        self.runs_on_watch: Counter[int] = Counter()  # id -> runs scored while pitching\n        self.entered: dict[int, tuple[int, int]] = {id(starter): (1, 0)}  # id -> (inning, lead)\n\n    # --- PitcherSource ---\n\n    def pitcher_for(self, inning: int, outs: int, lead: int) -> Person:\n        if self._closer_time(inning, outs, lead):\n            self._bring_in(self.team.closer, inning, lead)  # type: ignore[arg-type]\n        elif self._tired(inning, outs):\n            nxt = self._next_reliever(inning, lead)\n            if nxt is not None:\n                self._bring_in(nxt, inning, lead)\n        return self.current\n\n    def record(self, pa: PlateAppearance, runs: int) -> None:\n        self.pitches[id(pa.pitcher)] += len(pa.pitches)\n        self.runs_on_watch[id(pa.pitcher)] += runs\n\n    # --- decisions ---\n\n    def _available(self, pitcher: Person | None) -> bool:\n        return (\n            pitcher is not None\n            and all(p is not pitcher for p in self.used)\n            and self.is_rested(pitcher)\n        )\n\n    def _closer_time(self, inning: int, outs: int, lead: int) -> bool:\n        closer = self.team.closer\n        return (\n            inning >= 9\n            and outs == 0\n            and lead in SAVE_LEAD\n            and self.current is not closer\n            and self._available(closer)\n        )\n\n    def _tired(self, inning: int, outs: int) -> bool:\n        me = id(self.current)\n        if self.current is self.starter:\n            return (\n                self.pitches[me] >= starter_pitch_limit(self.current)\n                or self.runs_on_watch[me] >= BLOWUP_RUNS\n            )\n        entered_inning, _ = self.entered[me]\n        finished_an_inning = outs == 0 and inning > entered_inning\n        return finished_an_inning or self.pitches[me] >= reliever_pitch_limit(self.current)\n\n    def _next_reliever(self, inning: int, lead: int) -> Person | None:\n        high_leverage = inning >= LATE_INNING and abs(lead) <= CLOSE_GAME\n        rested = [p for p in self.team.bullpen if self._available(p)]\n        if rested:\n            # Fresh arms (didn't pitch yesterday) first, then by quality.\n            fresh = [p for p in rested if self.is_fresh(p)] or rested\n            ranked = sorted(fresh, key=pitcher_quality, reverse=True)\n            return ranked[0] if high_leverage else ranked[-1]\n        # Bullpen's empty: only use the closer when it matters (9th+, within a run).\n        if inning >= 9 and abs(lead) <= 1 and self._available(self.team.closer):\n            return self.team.closer\n        return None\n\n    def _bring_in(self, pitcher: Person, inning: int, lead: int) -> None:\n        self.current = pitcher\n        self.used.append(pitcher)\n        self.entered[id(pitcher)] = (inning, lead)\n\n    # --- after the game ---\n\n    def entry_lead(self, pitcher: Person) -> int:\n        return self.entered[id(pitcher)][1]\n","veeone/field.py":"\"\"\"The positions on the field, with their standard scorekeeping numbers.\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections.abc import Mapping\nfrom enum import StrEnum\n\n\nclass Position(StrEnum):\n    PITCHER = \"P\"\n    CATCHER = \"C\"\n    FIRST_BASE = \"1B\"\n    SECOND_BASE = \"2B\"\n    THIRD_BASE = \"3B\"\n    SHORTSTOP = \"SS\"\n    LEFT_FIELD = \"LF\"\n    CENTER_FIELD = \"CF\"\n    RIGHT_FIELD = \"RF\"\n    DESIGNATED_HITTER = \"DH\"  # bats but doesn't field, so no number\n\n    @property\n    def number(self) -> int | None:\n        \"\"\"Scorekeeping number: P=1, C=2, 1B=3, 2B=4, 3B=5, SS=6, LF=7, CF=8, RF=9.\"\"\"\n        return _NUMBERS.get(self)\n\n    @property\n    def full_name(self) -> str:\n        return self.name.replace(\"_\", \" \").title()\n\n    @classmethod\n    def from_number(cls, number: int) -> Position:\n        for position, n in _NUMBERS.items():\n            if n == number:\n                return position\n        raise ValueError(f\"No position has number {number}.\")\n\n\n_NUMBERS: dict[Position, int] = {\n    Position.PITCHER: 1,\n    Position.CATCHER: 2,\n    Position.FIRST_BASE: 3,\n    Position.SECOND_BASE: 4,\n    Position.THIRD_BASE: 5,\n    Position.SHORTSTOP: 6,\n    Position.LEFT_FIELD: 7,\n    Position.CENTER_FIELD: 8,\n    Position.RIGHT_FIELD: 9,\n}\n\n# The 8 fielders behind the pitcher, in number order (2-9).\nFIELDERS: tuple[Position, ...] = tuple(p for p in _NUMBERS if p is not Position.PITCHER)\n\n# A full team: one player at each of the 9 numbered positions, plus a DH.\nROSTER_POSITIONS: tuple[Position, ...] = (*_NUMBERS, Position.DESIGNATED_HITTER)\n\n\n# ---------------------------------------------------------------------------\n# Drawing the field\n# ---------------------------------------------------------------------------\n\nFIELD_WIDTH = 60\n\n# Where each position is drawn: (row, center column). Home plate is at the bottom.\n_SPOTS: dict[Position, tuple[int, int]] = {\n    Position.CENTER_FIELD: (0, 30),\n    Position.LEFT_FIELD: (3, 9),\n    Position.RIGHT_FIELD: (3, 51),\n    Position.SHORTSTOP: (7, 21),\n    Position.SECOND_BASE: (7, 39),\n    Position.THIRD_BASE: (11, 10),\n    Position.PITCHER: (11, 30),\n    Position.FIRST_BASE: (11, 50),\n    Position.CATCHER: (16, 30),\n}\n\n# The diamond's base paths: (row, column, character).\n_DIAMOND = (\n    [(9, 30, \"+\")]  # second base\n    + [(9 + i, 30 - 3 * i, \"/\") for i in range(1, 4)]\n    + [(9 + i, 30 + 3 * i, \"\\\\\") for i in range(1, 4)]\n    + [(13, 20, \"+\"), (13, 40, \"+\")]  # third and first base\n    + [(13 + i, 20 + 3 * i, \"\\\\\") for i in range(1, 3)]\n    + [(13 + i, 40 - 3 * i, \"/\") for i in range(1, 3)]\n    + [(15, 30, \"H\")]  # home plate\n)\n\n\ndef draw_field(names: Mapping[Position, str]) -> str:\n    \"\"\"A text picture of the field with who plays where.\n\n    names: position -> name to show (e.g. last names). Missing spots show \"-\".\n    The DH is listed under the field, since they don't play defense.\n    \"\"\"\n    rows = 18\n    grid = [[\" \"] * FIELD_WIDTH for _ in range(rows)]\n\n    def put(row: int, center: int, text: str) -> None:\n        start = max(0, min(FIELD_WIDTH - len(text), center - len(text) // 2))\n        for i, ch in enumerate(text[:FIELD_WIDTH]):\n            grid[row][start + i] = ch\n\n    for row, col, ch in _DIAMOND:\n        grid[row][col] = ch\n    for position, (row, col) in _SPOTS.items():\n        put(row, col, f\"{position.number} {position}\")\n        put(row + 1, col, names.get(position, \"-\")[:14])\n\n    lines = [\"\".join(r).rstrip() for r in grid]\n    dh = names.get(Position.DESIGNATED_HITTER)\n    if dh is not None:\n        lines.append(f\"DH {dh}\")\n    return \"\\n\".join(lines)\n","veeone/league.py":"\"\"\"Teams playing each other: full games and a season with standings.\n\nA season: an even number of teams on a round-robin schedule (see `make_schedule`).\n\nA game:\n    - The away team bats first (top of the inning), the home team second.\n    - Each team bats against the other team's starter, with the other team's\n      real fielders behind him (their fld and spd decide balls in play).\n    - Each team's rotation cycles SP1-SP5 through its own games.\n    - 9 innings. If the home team leads after the top of the 9th, the bottom\n      isn't played. The home team can walk it off in the 9th or later.\n      Ties go to extra innings.\n    - Starters pitch the whole game (no bullpen yet; sta isn't used).\n\nRun from the command line:\n    uv run python -m veeone.league                 # 12 teams, 162 games each\n    uv run python -m veeone.league --teams 2 --seed 3 --games 50\n    uv run python -m veeone.league --out reports/season.txt   # also save the report\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport random\nfrom collections.abc import Callable, Generator\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\n\nfrom veeone.atbat import Outcome, run_steps\nfrom veeone.bullpen import SAVE_LEAD, PitchingManager, Workload\nfrom veeone.field import Position\nfrom veeone.person import Person, PitcherRatings\nfrom veeone.season import (\n    GAMES_PER_SEASON,\n    INNINGS,\n    BattingLine,\n    Event,\n    GameResult,\n    HalfInningState,\n    format_season,\n    half_inning_steps,\n    tally_batting,\n)\nfrom veeone.team import Team, create_league\n\n# ---------------------------------------------------------------------------\n# Pitching lines\n# ---------------------------------------------------------------------------\n\n\n@dataclass\nclass PitchingLine:\n    pitcher: Person\n    g: int = 0  # games pitched\n    gs: int = 0  # games started\n    w: int = 0\n    l: int = 0  # noqa: E741 - the standard stat name\n    sv: int = 0\n    outs: int = 0  # innings pitched x 3\n    bf: int = 0  # batters faced\n    h: int = 0\n    r: int = 0  # runs charged (whoever let the runner on)\n    bb: int = 0  # every walk, intentional ones included\n    ibb: int = 0\n    hbp: int = 0\n    so: int = 0\n    hr: int = 0\n    cg: int = 0  # complete games: started and pitched the whole game\n    sho: int = 0  # shutouts: complete games without allowing a run\n\n    def record(self, batting: GameResult, started: bool = False) -> None:\n        \"\"\"Add one appearance, from the other team's batting in that game.\"\"\"\n        me = self.pitcher\n        self.g += 1\n        self.gs += started\n        self.outs += batting.outs_by(me)\n        self.r += batting.runs_charged_to(me)\n        for play in batting.plays:\n            if play.pa.pitcher is not me:\n                continue\n            self.bf += 1\n            outcome = play.pa.outcome\n            self.h += outcome.is_hit\n            self.hr += outcome is Outcome.HOME_RUN\n            self.bb += outcome is Outcome.WALK\n            self.ibb += play.pa.intentional\n            self.hbp += outcome is Outcome.HIT_BY_PITCH\n            self.so += outcome is Outcome.STRIKEOUT\n        complete = started and all(p.pa.pitcher is me for p in batting.plays)\n        complete = complete and all(p is me for p in batting.steal_pitchers)\n        self.cg += complete\n        self.sho += complete and batting.runs == 0\n\n    @property\n    def ip(self) -> str:\n        \"\"\"Innings pitched the usual way: 6.1 means 6 and 1/3.\"\"\"\n        return f\"{self.outs // 3}.{self.outs % 3}\"\n\n    def _per_9(self, value: int) -> float:\n        return value * 27 / self.outs if self.outs else 0.0\n\n    @property\n    def era(self) -> float:\n        return self._per_9(self.r)  # every run counts (no errors yet)\n\n    @property\n    def whip(self) -> float:\n        return (self.h + self.bb) * 3 / self.outs if self.outs else 0.0\n\n    @property\n    def k9(self) -> float:\n        return self._per_9(self.so)\n\n    @property\n    def bb9(self) -> float:\n        return self._per_9(self.bb)\n\n    @property\n    def hr9(self) -> float:\n        return self._per_9(self.hr)\n\n\n# ---------------------------------------------------------------------------\n# One game\n# ---------------------------------------------------------------------------\n\nSTARTER_INNINGS_FOR_WIN = 5  # a starter needs 5 innings to get the win\n\n\n@dataclass\nclass TeamGame:\n    home: Team\n    away: Team\n    home_staff: PitchingManager\n    away_staff: PitchingManager\n    home_batting: GameResult = field(default_factory=GameResult)\n    away_batting: GameResult = field(default_factory=GameResult)\n    innings: int = 0\n    winning_pitcher: Person | None = None\n    losing_pitcher: Person | None = None\n    save: Person | None = None\n    day: int = 0  # day of the season (1-based), when part of a schedule\n    # Live progress, for following the game as it's played:\n    top: bool = True  # top (away batting) or bottom of the inning\n    half: HalfInningState | None = None  # the half-inning in progress\n    finished: bool = False\n\n    @property\n    def home_starter(self) -> Person:\n        return self.home_staff.starter\n\n    @property\n    def away_starter(self) -> Person:\n        return self.away_staff.starter\n\n    @property\n    def home_runs(self) -> int:\n        return self.home_batting.runs\n\n    @property\n    def away_runs(self) -> int:\n        return self.away_batting.runs\n\n    @property\n    def winner(self) -> Team:\n        return self.home if self.home_runs > self.away_runs else self.away\n\n    @property\n    def loser(self) -> Team:\n        return self.away if self.winner is self.home else self.home\n\n    @property\n    def walk_off(self) -> bool:\n        if self.winner is not self.home or not self.home_batting.plays:\n            return False\n        last = self.home_batting.plays[-1]\n        return last.inning >= INNINGS and last.pa.outcome not in (Outcome.OUT, Outcome.STRIKEOUT)\n\n    def staff(self, team: Team) -> PitchingManager:\n        return self.home_staff if team is self.home else self.away_staff\n\n    def batting(self, team: Team) -> GameResult:\n        return self.home_batting if team is self.home else self.away_batting\n\n    def line_score(self) -> str:\n        \"\"\"Runs by inning, e.g.  Blue 0 1 0 ... | 4   (x = bottom not played).\"\"\"\n        rows = []\n        for team, batting in ((self.away, self.away_batting), (self.home, self.home_batting)):\n            cells = []\n            for inning in range(1, self.innings + 1):\n                played = any(p.inning == inning for p in batting.plays) or any(\n                    i == inning for i, _ in batting.steals\n                )\n                cells.append(str(batting.runs_in_inning(inning)) if played else \"x\")\n            rows.append(f\"{team.name:<6} {' '.join(f'{c:>2}' for c in cells)}  | {batting.runs:>2}\")\n        return \"\\n\".join(rows)\n\n\ndef alignment(team: Team) -> dict[Position, Person]:\n    \"\"\"The team's fielders by position (pitchers count as average fielders).\"\"\"\n    return {p.position: p for p in team.fielders if p.position is not None}\n\n\ndef assign_decisions(game: TeamGame) -> None:\n    \"\"\"Win, loss and save, by simplified versions of the real rules.\n\n    Loss: the pitcher charged with the run that put the winners ahead for good.\n    Win: the winners' pitcher of record at that moment; a starter needs\n        STARTER_INNINGS_FOR_WIN innings, otherwise it goes to the first reliever.\n    Save: the winners' last pitcher, if he isn't the winner and came in leading\n        by 1-3 runs.\n    \"\"\"\n    winner, loser = game.winner, game.loser\n    w_staff = game.staff(winner)\n    score = {id(winner): 0, id(loser): 0}\n    on_mound = w_staff.starter  # winners' most recent pitcher so far\n    go_ahead: tuple[Person, Person] | None = None  # (loser's charged pitcher, winner's pitcher)\n    for inning in range(1, game.innings + 1):\n        for team in (game.away, game.home):\n            for play in game.batting(team).plays:\n                if play.inning != inning:\n                    continue\n                if team is loser:\n                    on_mound = play.pa.pitcher\n                for charged in play.charged:\n                    score[id(team)] += 1\n                    if team is winner and score[id(winner)] == score[id(loser)] + 1:\n                        go_ahead = (charged, on_mound)\n    assert go_ahead is not None\n    game.losing_pitcher, winning = go_ahead\n    if winning is w_staff.starter:\n        innings = game.batting(loser).outs_by(winning) / 3\n        if innings < STARTER_INNINGS_FOR_WIN and len(w_staff.used) > 1:\n            winning = w_staff.used[1]\n    game.winning_pitcher = winning\n    last = w_staff.used[-1]\n    if last is not winning and w_staff.entry_lead(last) in SAVE_LEAD:\n        game.save = last\n\n\ndef new_team_game(\n    home: Team,\n    away: Team,\n    game_number: int = 1,\n    home_staff: PitchingManager | None = None,\n    away_staff: PitchingManager | None = None,\n) -> TeamGame:\n    \"\"\"A game ready to play. Without staffs given, each team starts its rotation\n    turn for `game_number` and has its whole bullpen rested.\"\"\"\n    return TeamGame(\n        home,\n        away,\n        home_staff or PitchingManager(home, home.starter_for_game(game_number)),\n        away_staff or PitchingManager(away, away.starter_for_game(game_number)),\n    )\n\n\ndef team_game_steps(game: TeamGame, rng: random.Random) -> Generator[Event, None, TeamGame]:\n    \"\"\"Play `game` one Event at a time (pitches, plays, steals, pitching changes,\n    plus \"half_start\", \"half_end\" and \"game_end\"). `game` is updated as it goes.\"\"\"\n    home, away = game.home, game.away\n    home_defense, away_defense = alignment(home), alignment(away)\n    away_up = home_up = 0  # who leads off next, by lineup index\n    inning = 0\n    while True:\n        inning += 1\n        game.innings, game.top = inning, True\n        game.half = HalfInningState(inning, batter=away_up)\n        yield Event(\"half_start\", inning)\n        away_up = yield from half_inning_steps(\n            game.away_batting,\n            away.lineup,\n            away_up,\n            game.home_staff,\n            inning,\n            rng,\n            home_defense,\n            fielding_lead=game.home_runs - game.away_runs,\n            state=game.half,\n        )\n        game.away_batting.left_on_base += sum(r is not None for r in game.half.bases)\n        yield Event(\"half_end\", inning, outs=game.half.outs)\n        if inning >= INNINGS and game.home_runs > game.away_runs:\n            break  # home team already leads: no bottom half\n        runs_to_win = None\n        if inning >= INNINGS:\n            runs_to_win = game.away_runs - game.home_runs + 1\n        game.top = False\n        game.half = HalfInningState(inning, batter=home_up)\n        yield Event(\"half_start\", inning)\n        home_up = yield from half_inning_steps(\n            game.home_batting,\n            home.lineup,\n            home_up,\n            game.away_staff,\n            inning,\n            rng,\n            away_defense,\n            runs_to_win,\n            fielding_lead=game.away_runs - game.home_runs,\n            state=game.half,\n        )\n        game.home_batting.left_on_base += sum(r is not None for r in game.half.bases)\n        yield Event(\"half_end\", inning, outs=game.half.outs)\n        if inning >= INNINGS and game.home_runs != game.away_runs:\n            break\n    game.half = None\n    game.finished = True\n    assign_decisions(game)\n    yield Event(\"game_end\", inning)\n    return game\n\n\ndef simulate_team_game(\n    home: Team,\n    away: Team,\n    game_number: int = 1,\n    rng: random.Random | None = None,\n    home_staff: PitchingManager | None = None,\n    away_staff: PitchingManager | None = None,\n) -> TeamGame:\n    \"\"\"One game, played straight through (see `new_team_game` and `team_game_steps`).\"\"\"\n    game = new_team_game(home, away, game_number, home_staff, away_staff)\n    return run_steps(team_game_steps(game, rng or random.Random()))\n\n\n# ---------------------------------------------------------------------------\n# Schedule\n# ---------------------------------------------------------------------------\n\ntype Matchup = tuple[Team, Team]  # (home, away)\n\n\ndef round_robin(teams: list[Team]) -> list[list[Matchup]]:\n    \"\"\"Rounds where every team plays once; across all rounds everyone meets once.\n\n    Uses the circle method, so it needs an even number of teams.\n    \"\"\"\n    n = len(teams)\n    if n < 2 or n % 2:\n        raise ValueError(\"A league needs an even number of teams (2, 4, 6...).\")\n    order = list(teams)\n    rounds = []\n    for r in range(n - 1):\n        pairs = [(order[i], order[n - 1 - i]) for i in range(n // 2)]\n        if r % 2:\n            pairs = [(away, home) for home, away in pairs]\n        rounds.append(pairs)\n        order = [order[0], order[-1], *order[1:-1]]\n    return rounds\n\n\ndef make_schedule(teams: list[Team], games_per_team: int) -> list[list[Matchup]]:\n    \"\"\"One list of games per day; every team plays once a day.\n\n    The round robin repeats, and home/away flips each time through, so each pair\n    of teams meets about equally often and splits home games.\n    \"\"\"\n    rounds = round_robin(teams)\n    days = []\n    for day in range(games_per_team):\n        cycle, index = divmod(day, len(rounds))\n        pairs = rounds[index]\n        if cycle % 2:\n            pairs = [(away, home) for home, away in pairs]\n        days.append(pairs)\n    return days\n\n\n# Series-based season schedule (see build_season).\nSERIES_LENGTH = 3  # games per series against a team in your own league\nINTERLEAGUE_GAMES = 32  # per team, in a full GAMES_PER_SEASON season\nINTERLEAGUE_SERIES_LENGTH = 4  # one 4-game series vs each team in the other league\n\n\n@dataclass\nclass SeriesGame:\n    \"\"\"Where a scheduled game sits in its series.\"\"\"\n\n    game: int  # 1-based game number within the series\n    length: int  # games in the series\n    interleague: bool\n\n\ndef split_into_series(days: int, length: int) -> list[int]:\n    \"\"\"Series lengths that add up to `days`, all `length` where possible.\n\n    Leftover days become 2-game series (one extra day turns a full series into\n    two 2-game series), never a lone single game unless `days` is 1.\n    \"\"\"\n    if days <= 0:\n        return []\n    if days < length:\n        return [days]\n    count, extra = divmod(days, length)\n    series = [length] * count\n    if extra == 1 and length == 3:\n        series[-1:] = [2, 2]\n    elif extra:\n        series.append(extra)\n    return series\n\n\ndef interleague_rounds(a: list[Team], b: list[Team]) -> list[list[Matchup]]:\n    \"\"\"Rounds where each team in league `a` plays one team in league `b`;\n    over all rounds every a-team meets every b-team once.\"\"\"\n    n = len(a)\n    return [[(a[i], b[(i + r) % n]) for i in range(n)] for r in range(n)]\n\n\ndef _spread(main: list, extra: list) -> list:\n    \"\"\"Mix `extra` evenly into `main`, keeping each list's order.\"\"\"\n    if not extra:\n        return list(main)\n    total = len(main) + len(extra)\n    spots = {round((i + 0.5) * total / len(extra) - 0.5) for i in range(len(extra))}\n    out, mi, ei = [], 0, 0\n    for slot in range(total):\n        if slot in spots and ei < len(extra):\n            out.append(extra[ei])\n            ei += 1\n        else:\n            out.append(main[mi])\n            mi += 1\n    return out\n\n\ndef build_season(\n    teams: list[Team],\n    games_per_team: int,\n    interleague_games: int | None = None,\n) -> tuple[list[list[Matchup]], list[list[SeriesGame]]]:\n    \"\"\"The season's games, one list per day, played in series.\n\n    Every team plays every day, and everyone switches opponents at the same time.\n      - Own league: round-robin rounds, each played as a SERIES_LENGTH-game series;\n        home field flips each time through the rounds.\n      - Two leagues of the same even size: also `interleague_games` per team\n        (INTERLEAGUE_GAMES in a full season, scaled down for shorter ones),\n        as INTERLEAGUE_SERIES_LENGTH-game series spread evenly through the season.\n    Returns (games by day, the series info for each of those games).\n    \"\"\"\n    groups: dict[str, list[Team]] = {}\n    for team in teams:\n        groups.setdefault(team.league, []).append(team)\n    leagues = list(groups.values())\n    can_interleague = len(leagues) == 2 and len(leagues[0]) == len(leagues[1])\n    if interleague_games is None:\n        interleague_games = round(INTERLEAGUE_GAMES * games_per_team / GAMES_PER_SEASON)\n    inter_days = min(interleague_games, games_per_team) if can_interleague else 0\n\n    # Each block is (series length, games for each day of that series).\n    league_rounds = [round_robin(group) for group in leagues]  # raises for odd sizes\n    blocks_own = []\n    for i, length in enumerate(split_into_series(games_per_team - inter_days, SERIES_LENGTH)):\n        games: list[Matchup] = []\n        for rounds in league_rounds:\n            pairs = rounds[i % len(rounds)]\n            if (i // len(rounds)) % 2:\n                pairs = [(away, home) for home, away in pairs]\n            games += pairs\n        blocks_own.append((length, games, False))\n\n    blocks_inter = []\n    if inter_days:\n        rounds = interleague_rounds(*leagues)\n        for i, length in enumerate(split_into_series(inter_days, INTERLEAGUE_SERIES_LENGTH)):\n            pairs = rounds[i % len(rounds)]\n            if i % 2:  # alternate which league is at home\n                pairs = [(away, home) for home, away in pairs]\n            blocks_inter.append((length, pairs, True))\n\n    _balance_home_games(blocks_own, blocks_inter)\n\n    days: list[list[Matchup]] = []\n    info: list[list[SeriesGame]] = []\n    for length, games, inter in _spread(blocks_own, blocks_inter):\n        for game in range(1, length + 1):\n            days.append(list(games))\n            info.append([SeriesGame(game, length, inter) for _ in games])\n    return days, info\n\n\ndef _balance_home_games(own: list, inter: list) -> None:\n    \"\"\"Even out home games: the short leftover series (shorter than a full one)\n    put whichever team has fewer home games so far at home.\"\"\"\n    short = [b for b in own if b[0] < SERIES_LENGTH]\n    home: dict[int, int] = {}\n    for length, games, _ in [b for b in own if b not in short] + inter:\n        for h, _a in games:\n            home[id(h)] = home.get(id(h), 0) + length\n    for i, (length, games, flag) in enumerate(own):\n        if length >= SERIES_LENGTH:\n            continue\n        balanced = []\n        for h, a in games:\n            if home.get(id(a), 0) < home.get(id(h), 0):\n                h, a = a, h\n            home[id(h)] = home.get(id(h), 0) + length\n            balanced.append((h, a))\n        own[i] = (length, balanced, flag)\n\n\ndef make_schedule_by_league(teams: list[Team], games_per_team: int) -> list[list[Matchup]]:\n    \"\"\"The season's games by day (see build_season).\"\"\"\n    return build_season(teams, games_per_team)[0]\n\n\n# ---------------------------------------------------------------------------\n# A season\n# ---------------------------------------------------------------------------\n\n_PITCHING_COUNTS = (\"g\", \"gs\", \"w\", \"l\", \"sv\", \"outs\", \"bf\", \"h\", \"r\", \"bb\", \"hbp\", \"so\", \"hr\")\n\n\n@dataclass\nclass TeamRecord:\n    team: Team\n    w: int = 0\n    l: int = 0  # noqa: E741\n    runs_scored: int = 0\n    runs_allowed: int = 0\n    batting: list[BattingLine] = field(default_factory=list)\n    pitching: list[PitchingLine] = field(default_factory=list)\n\n    @property\n    def games(self) -> int:\n        return self.w + self.l\n\n    @property\n    def pct(self) -> float:\n        return self.w / self.games if self.games else 0.0\n\n    @property\n    def batting_total(self) -> BattingLine:\n        return sum(self.batting[1:], self.batting[0])\n\n    @property\n    def pitching_total(self) -> PitchingLine:\n        total = PitchingLine(self.pitching[0].pitcher)\n        for line in self.pitching:\n            for name in _PITCHING_COUNTS:\n                setattr(total, name, getattr(total, name) + getattr(line, name))\n        return total\n\n\n@dataclass\nclass LeagueSeason:\n    records: list[TeamRecord]\n    games: list[TeamGame] = field(default_factory=list)\n    # Balls in play each fielder handled: name -> {ball type: [chances, outs made]}.\n    # (Home runs and balls hit to the pitcher don't count.) Used for fielding runs in WAR.\n    fielding: dict[str, dict[str, list[int]]] = field(default_factory=dict)\n\n    def record_for(self, team: Team) -> TeamRecord:\n        return next(r for r in self.records if r.team is team)\n\n    @property\n    def standings(self) -> list[TeamRecord]:\n        def key(r: TeamRecord) -> tuple[float, int]:\n            return r.pct, r.runs_scored - r.runs_allowed\n\n        return sorted(self.records, key=key, reverse=True)\n\n    @property\n    def all_batting(self) -> list[tuple[Team, BattingLine]]:\n        return [(r.team, line) for r in self.records for line in r.batting]\n\n    @property\n    def all_pitching(self) -> list[tuple[Team, PitchingLine]]:\n        return [(r.team, line) for r in self.records for line in r.pitching]\n\n\nclass LeagueRun:\n    \"\"\"A season in progress, played a day (or a game) at a time.\n\n    The schedule is fixed up front; each day every team plays once. Games can be\n    played straight through (`play_game`, `sim_day`) or step by step: `start_game`\n    gives a TeamGame and its step generator, and `finish_game` records it.\n    \"\"\"\n\n    def __init__(\n        self,\n        teams: list[Team],\n        games: int = GAMES_PER_SEASON,\n        rng: random.Random | None = None,\n        keep_games: bool = True,\n    ):\n        self.teams = teams\n        self.rng = rng or random.Random()\n        self.keep_games = keep_games\n        self.schedule, self.series = build_season(teams, games)  # by day, in series\n        self.season = LeagueSeason([TeamRecord(t) for t in teams])\n        self.day = 1  # the day being played (1-based); past the end when the season is over\n        self.results: dict[int, TeamGame] = {}  # index in today's schedule -> finished game\n        self._batting: dict[int, BattingLine] = {}\n        self._pitching: dict[int, PitchingLine] = {}\n        self._workloads = {id(t): Workload() for t in teams}\n        for record in self.season.records:\n            record.batting = [BattingLine(p) for p in record.team.lineup]\n            record.pitching = [PitchingLine(p) for p in record.team.pitchers]\n            self._batting |= {id(line.player): line for line in record.batting}\n            self._pitching |= {id(line.pitcher): line for line in record.pitching}\n\n    # --- schedule ---\n\n    @property\n    def over(self) -> bool:\n        return self.day > len(self.schedule)\n\n    @property\n    def today(self) -> list[Matchup]:\n        return [] if self.over else self.schedule[self.day - 1]\n\n    def pending(self) -> list[int]:\n        \"\"\"Indexes of today's games not played yet.\"\"\"\n        return [i for i in range(len(self.today)) if i not in self.results]\n\n    # --- playing games ---\n\n    def _staff(self, team: Team) -> PitchingManager:\n        game_number = self.season.record_for(team).games + 1\n        workload = self._workloads[id(team)]\n        return PitchingManager(\n            team,\n            team.starter_for_game(game_number),\n            workload.checker(game_number),\n            workload.freshness(game_number),\n        )\n\n    def start_game(self, index: int) -> tuple[TeamGame, Generator[Event, None, TeamGame]]:\n        \"\"\"Set up today's game number `index` to be played step by step.\"\"\"\n        if index not in self.pending():\n            raise ValueError(f\"Game {index} today is not waiting to be played.\")\n        home, away = self.today[index]\n        game = new_team_game(home, away, home_staff=self._staff(home), away_staff=self._staff(away))\n        game.day = self.day\n        return game, team_game_steps(game, self.rng)\n\n    def finish_game(self, index: int, game: TeamGame) -> None:\n        \"\"\"Record a finished game in the standings and stats.\"\"\"\n        if not game.finished:\n            raise ValueError(\"That game is not over yet.\")\n        self.results[index] = game\n        self._record(game)\n        if not self.pending():\n            self.day += 1\n            self.results = {}\n\n    def play_game(self, index: int) -> TeamGame:\n        game, steps = self.start_game(index)\n        run_steps(steps)\n        self.finish_game(index, game)\n        return game\n\n    def sim_day(self) -> None:\n        \"\"\"Play the rest of today's games.\"\"\"\n        day = self.day\n        while not self.over and self.day == day:\n            self.play_game(self.pending()[0])\n\n    def sim_all(self) -> LeagueSeason:\n        while not self.over:\n            self.sim_day()\n        return self.season\n\n    def _record_fielding(self, game: TeamGame) -> None:\n        for batting, fielders in ((game.away_batting, game.home), (game.home_batting, game.away)):\n            for play in batting.plays:\n                ball = play.pa.batted_ball\n                if ball is None or ball.outcome is Outcome.HOME_RUN:\n                    continue\n                if ball.fielder is Position.PITCHER:\n                    continue\n                player = fielders.at(ball.fielder)\n                if player is None:\n                    continue\n                by_type = self.season.fielding.setdefault(player.full_name, {})\n                counts = by_type.setdefault(str(ball.type), [0, 0])\n                counts[0] += 1\n                counts[1] += ball.outcome is Outcome.OUT\n\n    def _record(self, game: TeamGame) -> None:\n        home, away = game.home, game.away\n        home_rec, away_rec = self.season.record_for(home), self.season.record_for(away)\n        if self.keep_games:\n            self.season.games.append(game)\n        self._record_fielding(game)\n        for team, record, against in (\n            (home, home_rec, game.away_batting),\n            (away, away_rec, game.home_batting),\n        ):\n            batting = game.batting(team)\n            staff = game.staff(team)\n            record.runs_scored += batting.runs\n            record.runs_allowed += against.runs\n            for line in record.batting:\n                line.games += 1\n            tally_batting(batting, self._batting)\n            for pitcher in staff.used:\n                self._pitching[id(pitcher)].record(against, started=pitcher is staff.starter)\n            self._workloads[id(team)].log(record.games + 1, staff.pitches)\n\n        home_won = game.winner is home\n        (home_rec if home_won else away_rec).w += 1\n        (away_rec if home_won else home_rec).l += 1\n        for pitcher, stat in (\n            (game.winning_pitcher, \"w\"),\n            (game.losing_pitcher, \"l\"),\n            (game.save, \"sv\"),\n        ):\n            if pitcher is not None:\n                line = self._pitching[id(pitcher)]\n                setattr(line, stat, getattr(line, stat) + 1)\n\n\ndef simulate_league_season(\n    teams: list[Team],\n    games: int = GAMES_PER_SEASON,\n    rng: random.Random | None = None,\n    keep_games: bool = False,\n) -> LeagueSeason:\n    \"\"\"Every team plays `games` games on a round-robin schedule (even number of teams).\n\n    Each team's rotation goes SP1, SP2, ... SP5 through its own games.\n    keep_games: also keep every TeamGame (box-score detail; uses more memory).\n    \"\"\"\n    return LeagueRun(teams, games, rng, keep_games).sim_all()\n\n\n# ---------------------------------------------------------------------------\n# Printing\n# ---------------------------------------------------------------------------\n\n\ndef _rate(value: float) -> str:\n    text = f\"{value:.3f}\"\n    return text[1:] if text.startswith(\"0\") else text  # .250, but 1.012 stays\n\n\ndef format_standings(season: LeagueSeason) -> str:\n    rows = [f\"{'Team':<6} {'W':>4} {'L':>4} {'PCT':>5} {'GB':>5} {'RS':>5} {'RA':>5} {'DIFF':>5}\"]\n    leader = season.standings[0]\n    for r in season.standings:\n        gb = ((leader.w - r.w) + (r.l - leader.l)) / 2\n        gb_text = \"-\" if gb == 0 else f\"{gb:g}\"\n        rows.append(\n            f\"{r.team.name:<6} {r.w:>4} {r.l:>4} {_rate(r.pct):>5} {gb_text:>5} \"\n            f\"{r.runs_scored:>5} {r.runs_allowed:>5} {r.runs_scored - r.runs_allowed:>+5}\"\n        )\n    return \"\\n\".join(rows)\n\n\ndef format_team_stats(season: LeagueSeason) -> str:\n    \"\"\"One row per team: hitting on the left, pitching on the right.\"\"\"\n    header = (\n        f\"{'Team':<6} {'R/G':>5} {'AVG':>5} {'OBP':>5} {'SLG':>5} {'OPS':>5} {'HR':>4} \"\n        f\"{'SB':>4} {'SO':>5} {'BB':>4} | {'RA/G':>5} {'ERA':>5} {'WHIP':>5} {'K/9':>5} \"\n        f\"{'BB/9':>5} {'HR/9':>5} {'oAVG':>5}\"\n    )\n    rows = [header, \"-\" * len(header)]\n    for r in season.standings:\n        b, p = r.batting_total, r.pitching_total\n        opp_ab = p.bf - p.bb - p.hbp\n        opp_avg = p.h / opp_ab if opp_ab else 0.0\n        rows.append(\n            f\"{r.team.name:<6} {r.runs_scored / r.games:>5.2f} {_rate(b.avg):>5} \"\n            f\"{_rate(b.obp):>5} {_rate(b.slg):>5} {_rate(b.ops):>5} {b.hr:>4} {b.sb:>4} \"\n            f\"{b.so:>5} {b.bb:>4} | {r.runs_allowed / r.games:>5.2f} {p.era:>5.2f} \"\n            f\"{p.whip:>5.2f} {p.k9:>5.1f} {p.bb9:>5.1f} {p.hr9:>5.1f} {_rate(opp_avg):>5}\"\n        )\n    return \"\\n\".join(rows)\n\n\ndef _leaders[L](\n    title: str,\n    entries: list[tuple[Team, L]],\n    value: Callable[[L], float],\n    shown: Callable[[L], str],\n    name: Callable[[L], str],\n    lowest: bool = False,\n    top: int = 3,\n) -> list[str]:\n    ranked = sorted(entries, key=lambda e: value(e[1]), reverse=not lowest)[:top]\n    lines = [f\"  {title}\"]\n    for i, (team, line) in enumerate(ranked, 1):\n        lines.append(f\"    {i}. {name(line)[:20]:<20} {team.name:<6} {shown(line):>6}\")\n    return lines\n\n\ndef format_leaders(season: LeagueSeason) -> str:\n    \"\"\"Top 3 in the main categories. Rate stats need a full-time player.\"\"\"\n\n    def batter(line: BattingLine) -> str:\n        return line.player.full_name if line.player else \"-\"\n\n    def pitcher(line: PitchingLine) -> str:\n        return line.pitcher.full_name\n\n    games = max(r.games for r in season.records)\n    hitters = season.all_batting\n    qualified = [(t, b) for t, b in hitters if b.pa >= 3.1 * games]\n    arms = season.all_pitching\n    qualified_arms = [(t, p) for t, p in arms if p.outs >= 3 * games]\n\n    out = [\"BATTING LEADERS\"]\n    out += _leaders(\"AVG\", qualified, lambda b: b.avg, lambda b: _rate(b.avg), batter)\n    out += _leaders(\"HR\", hitters, lambda b: b.hr, lambda b: str(b.hr), batter)\n    out += _leaders(\"RBI\", hitters, lambda b: b.rbi, lambda b: str(b.rbi), batter)\n    out += _leaders(\"OPS\", qualified, lambda b: b.ops, lambda b: _rate(b.ops), batter)\n    out += _leaders(\"SB\", hitters, lambda b: b.sb, lambda b: str(b.sb), batter)\n    out += [\"\", \"PITCHING LEADERS\"]\n    out += _leaders(\"W\", arms, lambda p: p.w, lambda p: str(p.w), pitcher)\n    out += _leaders(\n        \"ERA\", qualified_arms, lambda p: p.era, lambda p: f\"{p.era:.2f}\", pitcher, lowest=True\n    )\n    out += _leaders(\"SO\", arms, lambda p: p.so, lambda p: str(p.so), pitcher)\n    out += _leaders(\"SV\", arms, lambda p: p.sv, lambda p: str(p.sv), pitcher)\n    out += _leaders(\n        \"WHIP\", qualified_arms, lambda p: p.whip, lambda p: f\"{p.whip:.2f}\", pitcher, lowest=True\n    )\n    return \"\\n\".join(out)\n\n\ndef format_pitching(record: TeamRecord) -> str:\n    header = (\n        f\"{'Role':<4} {'Pitcher':<20} {'T':1} {'MOV':>3} {'ACC':>3} {'VEL':>3} {'STA':>3} \"\n        f\"{'G':>3} {'GS':>3} {'W':>3} {'L':>3} {'SV':>3} {'IP':>6} {'H':>4} {'R':>4} \"\n        f\"{'HR':>3} {'BB':>3} \"\n        f\"{'HBP':>3} {'SO':>4} {'ERA':>5} {'WHIP':>5} {'K/9':>5} {'BB/9':>5} {'HR/9':>5}\"\n    )\n    rows = [header, \"-\" * len(header)]\n\n    def row(role: str, name: str, hand: str, ratings: str, line: PitchingLine) -> str:\n        return (\n            f\"{role:<4} {name[:20]:<20} {hand:1} {ratings:<15} \"\n            f\"{line.g:>3} {line.gs:>3} {line.w:>3} {line.l:>3} {line.sv:>3} {line.ip:>6} \"\n            f\"{line.h:>4} {line.r:>4} \"\n            f\"{line.hr:>3} {line.bb:>3} {line.hbp:>3} {line.so:>4} {line.era:>5.2f} \"\n            f\"{line.whip:>5.2f} {line.k9:>5.1f} {line.bb9:>5.1f} {line.hr9:>5.1f}\"\n        )\n\n    for line in record.pitching:\n        p = line.pitcher\n        r = p.ratings\n        assert isinstance(r, PitcherRatings)\n        ratings = f\"{r.mov:>3} {r.acc:>3} {r.vel:>3} {r.sta:>3}\"\n        rows.append(row(record.team.role(p), p.full_name, p.handedness, ratings, line))\n    rows.append(\"-\" * len(header))\n    rows.append(row(\"\", \"Team\", \"\", \"\", record.pitching_total))\n    return \"\\n\".join(rows)\n\n\ndef format_season_report(season: LeagueSeason) -> str:\n    parts = [\n        \"STANDINGS\",\n        format_standings(season),\n        \"\",\n        \"TEAM STATS (hitting | pitching)\",\n        format_team_stats(season),\n        \"\",\n        format_leaders(season),\n    ]\n    for record in season.standings:\n        parts += [\n            \"\",\n            \"=\" * 40,\n            f\"{record.team.name.upper()}  ({record.w}-{record.l})\",\n            \"=\" * 40,\n            \"\",\n            \"Batting\",\n            format_season(record.batting, pitcher_line=False),\n            \"\",\n            \"Pitching\",\n            format_pitching(record),\n        ]\n    return \"\\n\".join(parts)\n\n\ndef main(argv: list[str] | None = None) -> None:\n    from veeone import STARTING_TEAM_COUNT\n\n    parser = argparse.ArgumentParser(description=\"Play a season between random teams.\")\n    parser.add_argument(\n        \"--teams\", type=int, default=STARTING_TEAM_COUNT, help=\"even number of teams\"\n    )\n    parser.add_argument(\"--games\", type=int, default=GAMES_PER_SEASON, help=\"games per team\")\n    parser.add_argument(\"--seed\", type=int, default=None, help=\"repeatable results\")\n    parser.add_argument(\"--out\", type=Path, default=None, help=\"also save the report here\")\n    args = parser.parse_args(argv)\n\n    rng = random.Random(args.seed)\n    teams = create_league(args.teams, rng)\n    season = simulate_league_season(teams, args.games, rng, keep_games=True)\n\n    longest = max(season.games, key=lambda g: g.innings)\n    walk_offs = sum(g.walk_off for g in season.games)\n    extras = sum(g.innings > INNINGS for g in season.games)\n    report = format_season_report(season) + (\n        f\"\\n\\n{len(season.games)} games, {extras} went to extra innings \"\n        f\"(longest: {longest.innings}), {walk_offs} walk-offs.\"\n    )\n    print(report)\n    if args.out is not None:\n        args.out.parent.mkdir(parents=True, exist_ok=True)\n        args.out.write_text(report + \"\\n\", encoding=\"utf-8\")\n\n\nif __name__ == \"__main__\":\n    main()\n","veeone/live.py":"\"\"\"Following one game live: advance a pitch, an at-bat, a half inning, an inning,\nor the whole game, and get back what happened plus the current game state.\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections.abc import Generator\nfrom enum import StrEnum\nfrom typing import Any\n\nfrom veeone.league import TeamGame\nfrom veeone.narrate import Narrator, ordinal\nfrom veeone.outcomes import Outcome\nfrom veeone.person import Person\nfrom veeone.season import Event, GameResult\n\n\nclass Step(StrEnum):\n    PITCH = \"pitch\"\n    AT_BAT = \"ab\"\n    HALF_INNING = \"half\"\n    INNING = \"inning\"\n    GAME = \"game\"\n\n\nclass LiveGame:\n    def __init__(self, game: TeamGame, steps: Generator[Event, None, TeamGame], seed: int = 0):\n        self.game = game\n        self.steps = steps\n        self.narrator = Narrator(game, seed)\n        self.log: list[dict[str, Any]] = []  # everything but individual pitches\n\n    @property\n    def finished(self) -> bool:\n        return self.game.finished\n\n    def advance(self, step: Step | str) -> list[dict[str, Any]]:\n        \"\"\"Play until the next stopping point for `step`. Returns what happened.\"\"\"\n        step = Step(step)\n        happened: list[dict[str, Any]] = []\n        while not self.finished:\n            try:\n                event = next(self.steps)\n            except StopIteration:\n                break\n            text = self.narrator.describe(event)\n            if text:\n                entry = {\n                    \"kind\": event.kind,\n                    \"inning\": event.inning,\n                    \"top\": self.game.top,\n                    \"text\": text,\n                }\n                happened.append(entry)\n                if event.kind != \"pitch\":\n                    self.log.append(entry)\n            if self._stops(step, event):\n                break\n        return happened\n\n    def _stops(self, step: Step, event: Event) -> bool:\n        if event.kind == \"game_end\":\n            return True\n        match step:\n            case Step.PITCH:\n                return event.kind in (\"pitch\", \"play\")\n            case Step.AT_BAT:\n                return event.kind == \"play\" or (event.kind == \"steal\" and event.outs == 3)\n            case Step.HALF_INNING:\n                return event.kind == \"half_end\"\n            case Step.INNING:\n                return event.kind == \"half_end\" and not self.game.top\n        return False\n\n    # --- state for the page ---\n\n    def snapshot(self) -> dict[str, Any]:\n        g = self.game\n        half = g.half\n        batting_team, fielding_team = (g.away, g.home) if g.top else (g.home, g.away)\n        batting = g.away_batting if g.top else g.home_batting\n        staff = g.home_staff if g.top else g.away_staff\n        pitcher = half.pitcher if half and half.pitcher else staff.current\n        batter = None\n        on_deck = None\n        if half and not g.finished:\n            lineup = batting_team.lineup\n            batter = lineup[half.batter]\n            on_deck = lineup[(half.batter + 1) % len(lineup)]\n        count = half.pa if half and half.pa else None\n        between = half is not None and half.outs >= 3  # the half is over, next not started\n        bases = half.bases if half and not between else (None, None, None)\n        return {\n            \"day\": g.day,\n            \"away\": self._team(g.away.name, g.away_batting),\n            \"home\": self._team(g.home.name, g.home_batting),\n            \"inning\": max(g.innings, 1),\n            \"top\": g.top,\n            \"finished\": g.finished,\n            \"outs\": min(half.outs, 3) if half else 0,\n            \"balls\": count.balls if count else 0,\n            \"strikes\": count.strikes if count else 0,\n            \"bases\": [p.full_name if p else None for p in bases],\n            \"batting\": batting_team.name,\n            \"fielding\": fielding_team.name,\n            \"batter\": self._batter(batter, batting) if batter else None,\n            \"onDeck\": on_deck.full_name if on_deck else None,\n            \"pitcher\": self._pitcher(pitcher, staff, batting, fielding_team) if pitcher else None,\n            \"lineScore\": self._line_score(),\n            \"decisions\": {\n                \"w\": g.winning_pitcher.full_name if g.winning_pitcher else None,\n                \"l\": g.losing_pitcher.full_name if g.losing_pitcher else None,\n                \"s\": g.save.full_name if g.save else None,\n            },\n            \"status\": self.status(),\n            \"log\": self.log,\n        }\n\n    def status(self) -> str:\n        g = self.game\n        if g.finished:\n            extra = f\" ({g.innings})\" if g.innings != 9 else \"\"\n            return f\"Final{extra}\"\n        if g.half is not None and g.half.outs >= 3:\n            return f\"{'Mid' if g.top else 'End'} {ordinal(g.innings)}\"\n        return f\"{'Top' if g.top else 'Bottom'} {ordinal(max(g.innings, 1))}\"\n\n    @staticmethod\n    def _team(name: str, batting: GameResult) -> dict[str, Any]:\n        return {\n            \"name\": name,\n            \"runs\": batting.runs,\n            \"hits\": sum(p.pa.outcome.is_hit for p in batting.plays),\n        }\n\n    @staticmethod\n    def _batter(batter: Person, batting: GameResult) -> dict[str, Any]:\n        mine = [p for p in batting.plays if p.pa.hitter is batter]\n        ab = sum(p.pa.outcome not in (Outcome.WALK, Outcome.HIT_BY_PITCH) for p in mine)\n        hits = sum(p.pa.outcome.is_hit for p in mine)\n        notes = []\n        for outcome, label in (\n            (Outcome.HOME_RUN, \"HR\"),\n            (Outcome.TRIPLE, \"3B\"),\n            (Outcome.DOUBLE, \"2B\"),\n            (Outcome.WALK, \"BB\"),\n            (Outcome.STRIKEOUT, \"K\"),\n        ):\n            n = sum(p.pa.outcome is outcome for p in mine)\n            if n:\n                notes.append(label if n == 1 else f\"{n} {label}\")\n        today = f\"{hits}-for-{ab}\" + (\", \" + \", \".join(notes) if notes else \"\")\n        return {\n            \"name\": batter.full_name,\n            \"pos\": str(batter.position),\n            \"hand\": str(batter.handedness),\n            \"today\": today if mine else \"First time up\",\n        }\n\n    @staticmethod\n    def _pitcher(pitcher: Person, staff: Any, batting: GameResult, team: Any) -> dict[str, Any]:\n        faced = [p for p in batting.plays if p.pa.pitcher is pitcher]\n        outs = batting.outs_by(pitcher)\n        hits = sum(p.pa.outcome.is_hit for p in faced)\n        ks = sum(p.pa.outcome is Outcome.STRIKEOUT for p in faced)\n        bbs = sum(p.pa.outcome is Outcome.WALK for p in faced)\n        runs = batting.runs_charged_to(pitcher)\n        pitches = staff.pitches[id(pitcher)]\n        return {\n            \"name\": pitcher.full_name,\n            \"role\": team.role(pitcher),\n            \"hand\": str(pitcher.handedness),\n            \"pitches\": pitches,\n            \"today\": f\"{outs // 3}.{outs % 3} IP, {hits} H, {runs} R, {bbs} BB, {ks} K\",\n        }\n\n    def _line_score(self) -> dict[str, list[int | None]]:\n        g = self.game\n        rows: dict[str, list[int | None]] = {}\n        for key, batting, is_top in (\n            (\"away\", g.away_batting, True),\n            (\"home\", g.home_batting, False),\n        ):\n            cells: list[int | None] = []\n            for inning in range(1, g.innings + 1):\n                started = inning < g.innings or (is_top or not g.top)\n                if g.finished and not is_top and inning == g.innings:\n                    started = any(p.inning == inning for p in batting.plays) or any(\n                        i == inning for i, _ in batting.steals\n                    )\n                cells.append(batting.runs_in_inning(inning) if started else None)\n            rows[key] = cells\n        return rows\n","veeone/names.py":"\"\"\"Name data and random full-name generation.\n\nQuick use:\n\n    from veeone.names import full_name, full_names, Origin\n\n    full_name()                          # \"Kenji Tanaka\"\n    full_name(Origin.DOMINICAN)          # \"Rafael Almonte\"\n    full_name(match_origin=False)        # first and last from any origin\n    full_names(10, unique=True, seed=42) # 10 distinct, repeatable names\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom enum import StrEnum\n\n\nclass Origin(StrEnum):\n    AMERICAN = \"american\"\n    DOMINICAN = \"dominican\"\n    CUBAN = \"cuban\"\n    JAPANESE = \"japanese\"\n\n\n# Male first names, grouped by origin.\nFIRST_NAMES: dict[Origin, tuple[str, ...]] = {\n    Origin.AMERICAN: (\n        \"James\", \"John\", \"Robert\", \"Michael\", \"William\", \"David\", \"Richard\", \"Joseph\",\n        \"Thomas\", \"Charles\", \"Christopher\", \"Daniel\", \"Matthew\", \"Anthony\", \"Mark\",\n        \"Steven\", \"Andrew\", \"Joshua\", \"Kevin\", \"Brian\", \"Ryan\", \"Jacob\", \"Eric\",\n        \"Jonathan\", \"Justin\", \"Brandon\", \"Tyler\", \"Nathan\", \"Kyle\", \"Ethan\", \"Logan\",\n        \"Caleb\", \"Marcus\", \"Derek\", \"Travis\", \"Cody\", \"Austin\", \"Dylan\", \"Gavin\", \"Connor\",\n        \"Benjamin\", \"Samuel\", \"Zachary\", \"Jordan\", \"Adam\", \"Patrick\", \"Sean\", \"Evan\",\n        \"Luke\", \"Chase\", \"Blake\", \"Trevor\", \"Garrett\", \"Spencer\", \"Colton\", \"Mason\",\n        \"Hunter\", \"Wyatt\", \"Jake\", \"Bryce\",\n    ),\n    Origin.DOMINICAN: (\n        \"Juan\", \"Luis\", \"José\", \"Rafael\", \"Ramón\", \"Pedro\", \"Manuel\", \"Francisco\",\n        \"Wilson\", \"Yunior\", \"Starlin\", \"Wander\", \"Elvis\", \"Henry\", \"Robinson\",\n        \"Franklin\", \"Wellington\", \"Danilo\", \"Héctor\", \"Ángel\",\n        \"Miguel\", \"Carlos\", \"Alexis\", \"Johan\", \"Ronny\", \"Félix\", \"Yeison\", \"Cristian\",\n        \"Edwin\", \"Jeuris\", \"Julio\", \"Bartolo\", \"Nelson\", \"Fausto\", \"Wily\",\n    ),\n    Origin.CUBAN: (\n        \"Yoandy\", \"Yasiel\", \"Yordanis\", \"Osvaldo\", \"Reinaldo\", \"Orlando\", \"Alexei\",\n        \"Yunieski\", \"Raúl\", \"Ernesto\", \"Ariel\", \"Leonel\", \"Rolando\", \"Lázaro\",\n        \"Adonis\", \"Yuliesky\", \"Jorge\", \"Alberto\", \"Eduardo\", \"Camilo\",\n        \"Aroldis\", \"Yandy\", \"Liván\", \"Orestes\", \"Dayán\", \"Yunel\", \"Kendrys\", \"Yonder\",\n        \"Rusney\", \"Raidel\", \"Yadiel\", \"Erisbel\", \"Dalier\", \"Norge\", \"Yoan\",\n    ),\n    Origin.JAPANESE: (\n        \"Hiroshi\", \"Takashi\", \"Kenji\", \"Haruto\", \"Ren\", \"Sota\", \"Yuto\", \"Daiki\",\n        \"Kaito\", \"Riku\", \"Shota\", \"Takumi\", \"Hayato\", \"Kazuki\", \"Ryota\", \"Satoshi\",\n        \"Kenta\", \"Yuki\", \"Daisuke\", \"Shin\",\n        \"Kota\", \"Sho\", \"Yusei\", \"Masato\", \"Tomoya\", \"Naoki\", \"Ryo\", \"Kazuya\",\n        \"Shunsuke\", \"Hideki\", \"Tatsuya\", \"Koji\", \"Makoto\", \"Akira\", \"Junichi\",\n    ),\n}  # fmt: skip\n\n# Last names, grouped by origin.\nLAST_NAMES: dict[Origin, tuple[str, ...]] = {\n    Origin.AMERICAN: (\n        \"Smith\", \"Johnson\", \"Williams\", \"Brown\", \"Jones\", \"Miller\", \"Davis\", \"Wilson\",\n        \"Anderson\", \"Thomas\", \"Taylor\", \"Moore\", \"Jackson\", \"Martin\", \"Lee\",\n        \"Thompson\", \"White\", \"Harris\", \"Clark\", \"Lewis\", \"Robinson\", \"Walker\",\n        \"Young\", \"Allen\", \"King\", \"Wright\", \"Scott\", \"Hill\", \"Green\", \"Adams\",\n        \"Nelson\", \"Baker\", \"Hall\", \"Campbell\", \"Mitchell\", \"Carter\", \"Roberts\",\n        \"Phillips\", \"Evans\", \"Turner\", \"Parker\", \"Edwards\", \"Collins\", \"Stewart\",\n        \"Morris\", \"Murphy\", \"Cook\", \"Rogers\", \"Morgan\", \"Cooper\",\n        \"Bell\", \"Murray\", \"Ward\", \"Gray\", \"Reed\", \"Bailey\", \"Price\", \"Hughes\", \"Myers\",\n        \"Ford\", \"Sullivan\", \"Russell\", \"Hayes\", \"Fisher\", \"Graham\", \"Wells\", \"Cole\",\n        \"West\", \"Hunt\", \"Butler\", \"Barnes\", \"Fox\", \"Stone\", \"Hart\", \"Lane\",\n    ),\n    Origin.DOMINICAN: (\n        \"Rodríguez\", \"Pérez\", \"Martínez\", \"García\", \"Sánchez\", \"Peña\", \"Reyes\",\n        \"Santana\", \"Almonte\", \"De la Cruz\", \"Polanco\", \"Batista\", \"Jiménez\",\n        \"Familia\", \"Encarnación\", \"Tejada\", \"Ureña\",\n        \"Rosario\", \"Mejía\", \"Castro\", \"Féliz\", \"Paulino\", \"Bautista\", \"Cuevas\", \"Frías\",\n        \"Marte\", \"Guzmán\", \"Núñez\", \"Taveras\", \"Valdez\", \"Vásquez\", \"Peralta\",\n    ),\n    Origin.CUBAN: (\n        \"Hernández\", \"González\", \"Díaz\", \"Fernández\", \"López\", \"Álvarez\", \"Morales\",\n        \"Castillo\", \"Ruiz\", \"Cabrera\", \"Céspedes\", \"Abreu\", \"Puig\", \"Valdés\",\n        \"Betancourt\", \"Estrada\", \"Quintana\",\n        \"Rojas\", \"Mesa\", \"Alonso\", \"Vargas\", \"Suárez\", \"Ortega\", \"Medina\", \"Ramos\",\n        \"Navarro\", \"Cárdenas\", \"Pacheco\", \"Guerra\", \"Benítez\", \"Delgado\", \"Herrera\",\n    ),\n    Origin.JAPANESE: (\n        \"Sato\", \"Suzuki\", \"Takahashi\", \"Tanaka\", \"Watanabe\", \"Ito\", \"Yamamoto\",\n        \"Nakamura\", \"Kobayashi\", \"Kato\", \"Yoshida\", \"Yamada\", \"Sasaki\", \"Matsumoto\",\n        \"Inoue\", \"Kimura\",\n        \"Hayashi\", \"Shimizu\", \"Yamaguchi\", \"Mori\", \"Abe\", \"Ikeda\", \"Hashimoto\",\n        \"Ishikawa\", \"Ogawa\", \"Okada\", \"Goto\", \"Hasegawa\", \"Murakami\", \"Kondo\", \"Ishii\",\n        \"Fujita\",\n    ),\n}  # fmt: skip\n\n_shared_rng = random.Random()\n\n\ndef _rng(seed: int | None) -> random.Random:\n    return _shared_rng if seed is None else random.Random(seed)\n\n\ndef _pool(table: dict[Origin, tuple[str, ...]], origin: Origin | str | None) -> list[str]:\n    if origin is None:\n        return [name for names in table.values() for name in names]\n    return list(table[Origin(origin)])\n\n\ndef first_names(origin: Origin | str | None = None) -> list[str]:\n    \"\"\"All first names, or only those of one origin.\"\"\"\n    return _pool(FIRST_NAMES, origin)\n\n\ndef last_names(origin: Origin | str | None = None) -> list[str]:\n    \"\"\"All last names, or only those of one origin.\"\"\"\n    return _pool(LAST_NAMES, origin)\n\n\ndef random_first_name(origin: Origin | str | None = None, *, seed: int | None = None) -> str:\n    return _rng(seed).choice(first_names(origin))\n\n\ndef random_last_name(origin: Origin | str | None = None, *, seed: int | None = None) -> str:\n    return _rng(seed).choice(last_names(origin))\n\n\ndef _full_name(rng: random.Random, origin: Origin | str | None, match_origin: bool) -> str:\n    if origin is None and match_origin:\n        origin = rng.choice(list(Origin))\n    return f\"{rng.choice(first_names(origin))} {rng.choice(last_names(origin))}\"\n\n\ndef full_name(\n    origin: Origin | str | None = None,\n    *,\n    match_origin: bool = True,\n    seed: int | None = None,\n) -> str:\n    \"\"\"One random \"First Last\" name.\n\n    origin: limit both names to one origin.\n    match_origin: when no origin is given, True picks one origin for both names;\n        False mixes any first name with any last name.\n    seed: makes the result repeatable.\n    \"\"\"\n    return _full_name(_rng(seed), origin, match_origin)\n\n\ndef full_names(\n    count: int,\n    origin: Origin | str | None = None,\n    *,\n    match_origin: bool = True,\n    unique: bool = False,\n    seed: int | None = None,\n) -> list[str]:\n    \"\"\"A list of random full names. unique=True guarantees no repeats.\"\"\"\n    rng = _rng(seed)\n    if not unique:\n        return [_full_name(rng, origin, match_origin) for _ in range(count)]\n\n    available = _combination_count(origin, match_origin)\n    if count > available:\n        raise ValueError(f\"Only {available} unique names are possible, asked for {count}.\")\n    seen: dict[str, None] = {}  # keeps insertion order\n    while len(seen) < count:\n        seen[_full_name(rng, origin, match_origin)] = None\n    return list(seen)\n\n\ndef _combination_count(origin: Origin | str | None, match_origin: bool) -> int:\n    if origin is not None:\n        origin = Origin(origin)\n        return len(FIRST_NAMES[origin]) * len(LAST_NAMES[origin])\n    if match_origin:\n        return sum(len(FIRST_NAMES[o]) * len(LAST_NAMES[o]) for o in Origin)\n    return len(first_names()) * len(last_names())\n\n\n__all__ = [\n    \"FIRST_NAMES\",\n    \"LAST_NAMES\",\n    \"Origin\",\n    \"first_names\",\n    \"full_name\",\n    \"full_names\",\n    \"last_names\",\n    \"random_first_name\",\n    \"random_last_name\",\n]\n","veeone/narrate.py":"\"\"\"Play-by-play text for game events, e.g. \"Juan Soto homers to right center field.\"\n\n`describe(event, game)` turns one `season.Event` from a live game into a\nsentence (or None for events that don't need one). Flavor details, like\n\"left center\" vs \"left field\", come from a separate random generator so\nnarrating a game never changes how it plays out.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\n\nfrom veeone.atbat import Pitch\nfrom veeone.battedball import BallType, BattedBall, FieldSide\nfrom veeone.field import Position\nfrom veeone.league import TeamGame\nfrom veeone.outcomes import Outcome\nfrom veeone.season import Event\n\nPOSITION_NAMES = {\n    Position.PITCHER: \"pitcher\",\n    Position.CATCHER: \"catcher\",\n    Position.FIRST_BASE: \"first baseman\",\n    Position.SECOND_BASE: \"second baseman\",\n    Position.THIRD_BASE: \"third baseman\",\n    Position.SHORTSTOP: \"shortstop\",\n    Position.LEFT_FIELD: \"left fielder\",\n    Position.CENTER_FIELD: \"center fielder\",\n    Position.RIGHT_FIELD: \"right fielder\",\n}\n\nBASE_NAMES = {2: \"second\", 3: \"third\"}\n\n# Where a ball to each side of the field can be described as landing.\nOUTFIELD_SPOTS = {\n    FieldSide.LEFT: (\"left field\", \"left field\", \"left center field\"),\n    FieldSide.CENTER: (\"center field\", \"left center field\", \"right center field\"),\n    FieldSide.RIGHT: (\"right field\", \"right field\", \"right center field\"),\n}\nGAP_SPOTS = {\n    FieldSide.LEFT: (\"the left field corner\", \"the left center field gap\", \"left field\"),\n    FieldSide.CENTER: (\n        \"the left center field gap\",\n        \"the right center field gap\",\n        \"deep center field\",\n    ),\n    FieldSide.RIGHT: (\"the right field corner\", \"the right center field gap\", \"right field\"),\n}\nGROUND_SINGLE = {\n    FieldSide.LEFT: \"through the left side\",\n    FieldSide.CENTER: \"up the middle\",\n    FieldSide.RIGHT: \"through the right side\",\n}\nGROUND_DOUBLE = {\n    FieldSide.LEFT: \"down the third base line\",\n    FieldSide.CENTER: \"up the middle\",\n    FieldSide.RIGHT: \"down the first base line\",\n}\n\nOUT_VERBS = {\n    BallType.GROUND_BALL: \"grounds out to\",\n    BallType.LINE_DRIVE: \"lines out to\",\n    BallType.FLY_BALL: \"flies out to\",\n    BallType.POP_UP: \"pops out to\",\n}\n\nPITCH_TEXT = {\n    Pitch.BALL: \"Ball\",\n    Pitch.WILD_PITCH: \"Ball, wild pitch\",\n    Pitch.CALLED_STRIKE: \"Called strike\",\n    Pitch.WHIFF: \"Swinging strike\",\n    Pitch.FOUL: \"Foul ball\",\n}\n\n\ndef ordinal(n: int) -> str:\n    suffix = \"th\" if 11 <= n % 100 <= 13 else {1: \"st\", 2: \"nd\", 3: \"rd\"}.get(n % 10, \"th\")\n    return f\"{n}{suffix}\"\n\n\nclass Narrator:\n    \"\"\"Describes the events of one game.\"\"\"\n\n    def __init__(self, game: TeamGame, seed: int = 0):\n        self.game = game\n        self.flavor = random.Random(seed)\n\n    # --- helpers ---\n\n    def fielder(self, position: Position) -> str:\n        \"\"\"e.g. \"shortstop Juan Reyes\", using whoever is in the field right now.\"\"\"\n        fielding = self.game.home if self.game.top else self.game.away\n        if position is Position.PITCHER:\n            half = self.game.half\n            name = half.pitcher.full_name if half and half.pitcher else \"the pitcher\"\n        else:\n            player = fielding.at(position)\n            name = player.full_name if player else \"\"\n        return f\"{POSITION_NAMES[position]} {name}\".strip()\n\n    def spot(self, table: dict[FieldSide, tuple[str, ...]], side: FieldSide) -> str:\n        return self.flavor.choice(table[side])\n\n    # --- events ---\n\n    def describe(self, event: Event) -> str | None:\n        match event.kind:\n            case \"half_start\":\n                return self.half_start(event)\n            case \"half_end\":\n                return self.half_end(event)\n            case \"game_end\":\n                return self.game_end()\n            case \"pitch\":\n                return self.pitch(event)\n            case \"steal\":\n                return self.steal(event)\n            case \"change\":\n                return self.change(event)\n            case \"play\":\n                return self.play(event)\n        return None\n\n    def half_start(self, event: Event) -> str:\n        g = self.game\n        batting, pitching = (g.away, g.home) if g.top else (g.home, g.away)\n        staff = g.home_staff if g.top else g.away_staff\n        half = \"Top\" if g.top else \"Bottom\"\n        return (\n            f\"{half} of the {ordinal(event.inning)}: {batting.name} batting, \"\n            f\"{staff.current.full_name} pitching for {pitching.name}.\"\n        )\n\n    def half_end(self, event: Event) -> str:\n        g = self.game\n        half = \"top\" if g.top else \"bottom\"\n        return (\n            f\"End of the {half} of the {ordinal(event.inning)}. \"\n            f\"{g.away.name} {g.away_runs}, {g.home.name} {g.home_runs}.\"\n        )\n\n    def game_end(self) -> str:\n        g = self.game\n        winner, loser = g.winner, g.loser\n        w_runs = g.home_runs if winner is g.home else g.away_runs\n        l_runs = g.away_runs if winner is g.home else g.home_runs\n        extra = f\" in {g.innings} innings\" if g.innings != 9 else \"\"\n        parts = [f\"Final{extra}: {winner.name} {w_runs}, {loser.name} {l_runs}.\"]\n        if g.winning_pitcher:\n            parts.append(f\"W: {g.winning_pitcher.full_name}.\")\n        if g.losing_pitcher:\n            parts.append(f\"L: {g.losing_pitcher.full_name}.\")\n        if g.save:\n            parts.append(f\"S: {g.save.full_name}.\")\n        return \" \".join(parts)\n\n    def pitch(self, event: Event) -> str:\n        pa = event.pa\n        assert pa is not None\n        last = pa.pitches[-1]\n        return f\"{PITCH_TEXT.get(last.result, str(last.result))} ({pa.balls}-{pa.strikes}).\"\n\n    def steal(self, event: Event) -> str:\n        attempt = event.steal\n        assert attempt is not None\n        base = BASE_NAMES[attempt.to_base]\n        if attempt.success:\n            return f\"{attempt.runner.full_name} steals {base}.\"\n        return f\"{attempt.runner.full_name} is caught stealing {base}.\"\n\n    def change(self, event: Event) -> str:\n        assert event.pitcher is not None and event.replaced is not None\n        team = self.game.home if self.game.top else self.game.away\n        role = team.role(event.pitcher)\n        return (\n            f\"Pitching change: {event.pitcher.full_name} ({role}) \"\n            f\"replaces {event.replaced.full_name}.\"\n        )\n\n    def play(self, event: Event) -> str:\n        play, pa = event.play, event.pa\n        assert play is not None and pa is not None\n        batter = pa.hitter.full_name\n        if pa.intentional:\n            text = f\"{batter} is intentionally walked.\"\n        else:\n            text = f\"{batter} {self.result(pa.outcome, pa.batted_ball, pa.pitches[-1].result)}\"\n        runners = [p for p in play.scored if p is not pa.hitter]\n        if runners:\n            text += \" \" + \" \".join(f\"{p.full_name} scores.\" for p in runners)\n        if event.walk_off:\n            text += \" Walk-off!\"\n        return text\n\n    def result(self, outcome: Outcome, ball: BattedBall | None, last_pitch: Pitch) -> str:\n        match outcome:\n            case Outcome.STRIKEOUT:\n                return (\n                    \"strikes out looking.\"\n                    if last_pitch is Pitch.CALLED_STRIKE\n                    else \"strikes out swinging.\"\n                )\n            case Outcome.WALK:\n                return \"walks.\"\n            case Outcome.HIT_BY_PITCH:\n                return \"is hit by a pitch.\"\n        assert ball is not None\n        side = ball.side\n        match outcome:\n            case Outcome.OUT:\n                return f\"{OUT_VERBS[ball.type]} {self.fielder(ball.fielder)}.\"\n            case Outcome.SINGLE:\n                if ball.type is BallType.GROUND_BALL:\n                    return f\"singles on a ground ball {GROUND_SINGLE[side]}.\"\n                if ball.type is BallType.POP_UP:\n                    return f\"bloops a single to {self.spot(OUTFIELD_SPOTS, side)}.\"\n                return f\"singles to {self.spot(OUTFIELD_SPOTS, side)}.\"\n            case Outcome.DOUBLE:\n                if ball.type is BallType.GROUND_BALL:\n                    return f\"doubles {GROUND_DOUBLE[side]}.\"\n                return f\"doubles to {self.spot(GAP_SPOTS, side)}.\"\n            case Outcome.TRIPLE:\n                return f\"triples to {self.spot(GAP_SPOTS, side)}.\"\n            case Outcome.HOME_RUN:\n                return f\"homers to {self.spot(OUTFIELD_SPOTS, side)}.\"\n        return f\"{outcome}.\"\n\n\ndef describe(event: Event, game: TeamGame) -> str | None:\n    \"\"\"One-off description (for repeated use, keep a Narrator per game).\"\"\"\n    return Narrator(game).describe(event)\n","veeone/odds.py":"\"\"\"The probability math every rating effect uses.\n\nStart from a base probability for an average (50) rating or matchup, then shift\nits log-odds by EFFECT * (rating gap / 10). Average gives exactly the base rate,\nprobabilities always stay between 0 and 1, and a negative EFFECT lowers it.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nimport random\nfrom collections.abc import Mapping\n\nfrom veeone.person import RATING_MEAN, RATING_SD\n\n\ndef rating_gap(attack: float, defense: float = RATING_MEAN) -> float:\n    \"\"\"Advantage in standard deviations. rating_gap(60, 50) == 1.0.\"\"\"\n    return (attack - defense) / RATING_SD\n\n\ndef adjust[K](base: Mapping[K, float], effects: Mapping[K, float], gap: float) -> dict[K, float]:\n    \"\"\"Shift a set of outcome probabilities by a rating gap.\n\n    Each outcome's weight is multiplied by exp(effect * gap); outcomes with no\n    effect stay as the reference. The result is renormalized to sum to 1.\n    With gap == 0 the base probabilities come back unchanged.\n    \"\"\"\n    weights = {k: p * math.exp(effects.get(k, 0.0) * gap) for k, p in base.items()}\n    total = sum(weights.values())\n    return {k: w / total for k, w in weights.items()}\n\n\ndef chance(base: float, effect: float, gap: float, shift: float = 0.0) -> float:\n    \"\"\"Yes/no version of `adjust`: the probability of 'yes'.\n\n    shift: an extra log-odds nudge on top of the rating effect.\n    \"\"\"\n    log_odds = math.log(base / (1 - base)) + effect * gap + shift\n    return 1 / (1 + math.exp(-log_odds))\n\n\ndef pick[K](probs: Mapping[K, float], rng: random.Random) -> K:\n    \"\"\"Choose one key, weighted by its probability.\"\"\"\n    return rng.choices(list(probs), weights=list(probs.values()))[0]\n","veeone/outcomes.py":"\"\"\"How a plate appearance can end.\"\"\"\n\nfrom __future__ import annotations\n\nfrom enum import StrEnum\n\n\nclass Outcome(StrEnum):\n    STRIKEOUT = \"strikeout\"\n    WALK = \"walk\"\n    HIT_BY_PITCH = \"hit by pitch\"\n    OUT = \"out\"  # ball in play, no hit\n    SINGLE = \"single\"\n    DOUBLE = \"double\"\n    TRIPLE = \"triple\"\n    HOME_RUN = \"home run\"\n\n    @property\n    def is_hit(self) -> bool:\n        return self in HITS\n\n\nHITS = (Outcome.SINGLE, Outcome.DOUBLE, Outcome.TRIPLE, Outcome.HOME_RUN)\n","veeone/person.py":"\"\"\"People with a name, age, nationality, class, handedness and ratings.\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom dataclasses import dataclass, fields, replace\nfrom enum import StrEnum\nfrom typing import Self\n\nfrom veeone.field import Position\nfrom veeone.names import Origin, first_names, last_names\n\nMIN_AGE = 18\nMAX_AGE = 70\n\n# Ratings use the 20-80 scouting scale: 50 is average, each 10 points is one\n# standard deviation. Random ratings follow a bell curve clamped to the range.\nMIN_RATING = 20\nMAX_RATING = 80\nRATING_MEAN = 50\nRATING_SD = 10\n\n\nclass PlayerClass(StrEnum):\n    \"\"\"The only allowed values for a person's class.\"\"\"\n\n    PITCHER = \"pitcher\"\n    POSITION = \"position\"\n\n\nclass Handedness(StrEnum):\n    \"\"\"L = left, R = right, S = switch (both).\"\"\"\n\n    L = \"L\"\n    R = \"R\"\n    S = \"S\"\n\n\n# How often each handedness comes up when picked at random, by class.\nHANDEDNESS_WEIGHTS: dict[PlayerClass, dict[Handedness, float]] = {\n    PlayerClass.POSITION: {Handedness.R: 0.55, Handedness.L: 0.33, Handedness.S: 0.12},\n    PlayerClass.PITCHER: {Handedness.R: 0.72, Handedness.L: 0.27, Handedness.S: 0.01},\n}\n\n\ndef random_rating(rng: random.Random | None = None) -> int:\n    \"\"\"One rating from the bell curve, clamped to MIN_RATING..MAX_RATING.\"\"\"\n    rng = rng or random.Random()\n    value = round(rng.gauss(RATING_MEAN, RATING_SD))\n    return max(MIN_RATING, min(MAX_RATING, value))\n\n\n@dataclass\nclass Ratings:\n    \"\"\"Base for a group of ratings. Every field must be MIN_RATING..MAX_RATING.\"\"\"\n\n    def __post_init__(self) -> None:\n        for f in fields(self):\n            value = getattr(self, f.name)\n            if not MIN_RATING <= value <= MAX_RATING:\n                raise ValueError(f\"{f.name} must be {MIN_RATING}-{MAX_RATING}, got {value}\")\n\n    @classmethod\n    def random(cls, rng: random.Random | None = None) -> Self:\n        rng = rng or random.Random()\n        return cls(*(random_rating(rng) for _ in fields(cls)))\n\n    def __str__(self) -> str:\n        return \" \".join(f\"{f.name.upper()} {getattr(self, f.name)}\" for f in fields(self))\n\n\n@dataclass\nclass PositionRatings(Ratings):\n    con_r: int  # contact vs right-handed pitchers\n    con_l: int  # contact vs left-handed pitchers\n    pow: int  # power\n    eye: int  # plate discipline: lays off pitches out of the zone\n    fld: int  # fielding\n    spd: int  # speed on the bases and in the field\n    stl: int  # stealing: chance an attempted steal succeeds\n\n    def con_vs(self, pitcher_hand: Handedness | str) -> int:\n        \"\"\"The con rating to use against a pitcher throwing with this hand.\"\"\"\n        return self.con_l if Handedness(pitcher_hand) is Handedness.L else self.con_r\n\n\n# Platoon split: most hitters make better contact against pitchers who throw\n# with the opposite hand. When generating a hitter, con_r and con_l are their\n# overall contact plus/minus half a random gap, favoring the opposite hand.\nPLATOON_GAP_MEAN = 6  # rating points, for L or R hitters\nPLATOON_GAP_SD = 5\nSWITCH_GAP_SD = 4  # switch hitters have no built-in favorite side\n\n\ndef random_con_split(\n    handedness: Handedness | str, rng: random.Random | None = None\n) -> tuple[int, int]:\n    \"\"\"(con_r, con_l) for a new hitter who bats with this hand.\"\"\"\n    rng = rng or random.Random()\n    overall = rng.gauss(RATING_MEAN, RATING_SD)\n    match
