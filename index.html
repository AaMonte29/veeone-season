Handedness(handedness):\n        case Handedness.R:  # better vs LHP\n            gap_toward_l = rng.gauss(PLATOON_GAP_MEAN, PLATOON_GAP_SD)\n        case Handedness.L:  # better vs RHP\n            gap_toward_l = -rng.gauss(PLATOON_GAP_MEAN, PLATOON_GAP_SD)\n        case Handedness.S:\n            gap_toward_l = rng.gauss(0, SWITCH_GAP_SD)\n\n    def clamp(value: float) -> int:\n        return max(MIN_RATING, min(MAX_RATING, round(value)))\n\n    return clamp(overall - gap_toward_l / 2), clamp(overall + gap_toward_l / 2)\n\n\n@dataclass\nclass PitcherRatings(Ratings):\n    mov: int  # movement\n    acc: int  # accuracy\n    vel: int  # velocity\n    sta: int  # stamina\n\n\nRATINGS_FOR_CLASS: dict[PlayerClass, type[Ratings]] = {\n    PlayerClass.POSITION: PositionRatings,\n    PlayerClass.PITCHER: PitcherRatings,\n}\n\n\n@dataclass\nclass Person:\n    first_name: str\n    last_name: str\n    age: int\n    nationality: Origin\n    # Named player_class because `class` is a reserved word in Python.\n    player_class: PlayerClass\n    handedness: Handedness\n    # PositionRatings for position players, PitcherRatings for pitchers.\n    ratings: PositionRatings | PitcherRatings\n    # Where they play: P for pitchers; any other position for position players.\n    # None until they're placed on a team.\n    position: Position | None = None\n\n    def __post_init__(self) -> None:\n        # Strings like \"pitcher\", \"L\" or \"SS\" are accepted; anything invalid raises ValueError.\n        self.player_class = PlayerClass(self.player_class)\n        self.handedness = Handedness(self.handedness)\n        expected = RATINGS_FOR_CLASS[self.player_class]\n        if type(self.ratings) is not expected:\n            raise ValueError(f\"A {self.player_class} needs {expected.__name__}.\")\n        if self.position is not None:\n            self.position = Position(self.position)\n            is_pitcher = self.player_class is PlayerClass.PITCHER\n            if is_pitcher != (self.position is Position.PITCHER):\n                raise ValueError(\"Pitchers play P, and only pitchers play P.\")\n\n    @property\n    def full_name(self) -> str:\n        return f\"{self.first_name} {self.last_name}\"\n\n    def __str__(self) -> str:\n        where = f\", {self.position}\" if self.position is not None else \"\"\n        return (\n            f\"{self.full_name}, {self.age}, {self.nationality.title()}, \"\n            f\"{self.player_class.title()}{where}, {self.handedness} | {self.ratings}\"\n        )\n\n\ndef random_handedness(\n    player_class: PlayerClass | str, rng: random.Random | None = None\n) -> Handedness:\n    rng = rng or random.Random()\n    weights = HANDEDNESS_WEIGHTS[PlayerClass(player_class)]\n    return rng.choices(list(weights), weights=list(weights.values()))[0]\n\n\ndef create_person(\n    nationality: Origin | str | None = None,\n    *,\n    player_class: PlayerClass | str | None = None,\n    handedness: Handedness | str | None = None,\n    position: Position | str | None = None,\n    min_age: int = MIN_AGE,\n    max_age: int = MAX_AGE,\n    rng: random.Random | None = None,\n) -> Person:\n    \"\"\"A random person. Their name matches their nationality.\n\n    nationality: pick one, or leave as None for a random one.\n    player_class: \"pitcher\" or \"position\", or None for a random one.\n        Position players get con_r/con_l/pow/eye/fld/spd/stl (con split by\n        platoon, see random_con_split); pitchers get mov/acc/vel/sta.\n    handedness: \"L\", \"R\" or \"S\", or None for a random one (see HANDEDNESS_WEIGHTS).\n    position: e.g. \"SS\" or Position.SHORTSTOP. Sets the class if it isn't given\n        (P makes a pitcher; anything else a position player).\n    rng: pass random.Random(seed) for repeatable people.\n    \"\"\"\n    rng = rng or random.Random()\n    origin = Origin(nationality) if nationality is not None else rng.choice(list(Origin))\n    if position is not None:\n        position = Position(position)\n        if player_class is None:\n            is_pitcher = position is Position.PITCHER\n            player_class = PlayerClass.PITCHER if is_pitcher else PlayerClass.POSITION\n    if player_class is None:\n        player_class = rng.choice(list(PlayerClass))\n    player_class = PlayerClass(player_class)\n    if handedness is None:\n        handedness = random_handedness(player_class, rng)\n    handedness = Handedness(handedness)\n    ratings = RATINGS_FOR_CLASS[player_class].random(rng)\n    if isinstance(ratings, PositionRatings):\n        con_r, con_l = random_con_split(handedness, rng)\n        ratings = replace(ratings, con_r=con_r, con_l=con_l)\n    return Person(\n        first_name=rng.choice(first_names(origin)),\n        last_name=rng.choice(last_names(origin)),\n        age=rng.randint(min_age, max_age),\n        nationality=origin,\n        player_class=player_class,\n        handedness=handedness,\n        ratings=ratings,\n        position=position,\n    )\n","veeone/season.py":"\"\"\"Simulate games and seasons of plate appearances and tally batting lines.\n\nA game is 9 innings of 3 outs for the lineup, batting in order and carrying the\norder over between innings. Each game starts at the leadoff hitter. Runners move\nby the rules in `veeone.bases`. Before each plate appearance a runner may try\nto steal; a runner caught stealing is an out, and if it is the third out the\nbatter leads off the next inning.\n\nRun from the command line:\n    uv run python -m veeone.season            # random lineup vs average pitcher, 162 games\n    uv run python -m veeone.season --games 50 --seed 7\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport random\nfrom collections.abc import Generator\nfrom dataclasses import dataclass, field, fields, replace\nfrom typing import Protocol\n\nfrom veeone.atbat import (\n    Outcome,\n    PlateAppearance,\n    batting_side,\n    plate_appearance_steps,\n    run_steps,\n    throwing_hand,\n)\nfrom veeone.bases import EMPTY, Bases, StealAttempt, advance, maybe_steal\nfrom veeone.battedball import Defense\nfrom veeone.names import Origin\nfrom veeone.person import (\n    RATING_MEAN,\n    Handedness,\n    Person,\n    PitcherRatings,\n    PositionRatings,\n    create_person,\n)\nfrom veeone.strategy import wants_intentional_walk\n\nINNINGS = 9\nOUTS_PER_INNING = 3\nOUTS_PER_GAME = INNINGS * OUTS_PER_INNING\nGAMES_PER_SEASON = 162\n\n\n@dataclass\nclass BattingLine:\n    player: Person | None = None  # None for a team total\n    games: int = 0\n    pa: int = 0\n    singles: int = 0\n    doubles: int = 0\n    triples: int = 0\n    hr: int = 0\n    bb: int = 0  # every walk, intentional ones included\n    ibb: int = 0\n    hbp: int = 0\n    so: int = 0\n    outs_in_play: int = 0\n    pitches: int = 0\n    runs: int = 0\n    rbi: int = 0\n    sb: int = 0\n    cs: int = 0\n\n    def record(self, pa: PlateAppearance, rbi: int = 0) -> None:\n        self.pa += 1\n        self.rbi += rbi\n        self.pitches += len(pa.pitches)\n        match pa.outcome:\n            case Outcome.SINGLE:\n                self.singles += 1\n            case Outcome.DOUBLE:\n                self.doubles += 1\n            case Outcome.TRIPLE:\n                self.triples += 1\n            case Outcome.HOME_RUN:\n                self.hr += 1\n            case Outcome.WALK:\n                self.bb += 1\n                self.ibb += pa.intentional\n            case Outcome.HIT_BY_PITCH:\n                self.hbp += 1\n            case Outcome.STRIKEOUT:\n                self.so += 1\n            case Outcome.OUT:\n                self.outs_in_play += 1\n\n    def __add__(self, other: BattingLine) -> BattingLine:\n        total = BattingLine(None, max(self.games, other.games))\n        for f in fields(self):\n            if f.name not in (\"player\", \"games\"):\n                setattr(total, f.name, getattr(self, f.name) + getattr(other, f.name))\n        return total\n\n    @property\n    def hits(self) -> int:\n        return self.singles + self.doubles + self.triples + self.hr\n\n    @property\n    def ab(self) -> int:\n        return self.pa - self.bb - self.hbp\n\n    @property\n    def total_bases(self) -> int:\n        return self.singles + 2 * self.doubles + 3 * self.triples + 4 * self.hr\n\n    @property\n    def avg(self) -> float:\n        return self.hits / self.ab if self.ab else 0.0\n\n    @property\n    def obp(self) -> float:\n        return (self.hits + self.bb + self.hbp) / self.pa if self.pa else 0.0\n\n    @property\n    def slg(self) -> float:\n        return self.total_bases / self.ab if self.ab else 0.0\n\n    @property\n    def ops(self) -> float:\n        return self.obp + self.slg\n\n\nOUT_OUTCOMES = (Outcome.OUT, Outcome.STRIKEOUT)\n\n\n@dataclass\nclass Play:\n    pa: PlateAppearance\n    inning: int\n    scored: list[Person] = field(default_factory=list)  # runners who scored, batter included\n    # For each run scored, the pitcher it's charged to: whoever let that runner on base.\n    charged: list[Person] = field(default_factory=list)\n\n    @property\n    def rbi(self) -> int:\n        return len(self.scored)\n\n\n@dataclass\nclass GameResult:\n    plays: list[Play] = field(default_factory=list)\n    steals: list[tuple[int, StealAttempt]] = field(default_factory=list)  # (inning, attempt)\n    steal_pitchers: list[Person] = field(default_factory=list)  # pitching for each steal\n    left_on_base: int = 0  # runners stranded when each half-inning ended\n\n    @property\n    def outs(self) -> int:\n        pa_outs = sum(play.pa.outcome in OUT_OUTCOMES for play in self.plays)\n        caught = sum(not attempt.success for _, attempt in self.steals)\n        return pa_outs + caught\n\n    @property\n    def runs(self) -> int:\n        return sum(play.rbi for play in self.plays)\n\n    def runs_in_inning(self, inning: int) -> int:\n        return sum(play.rbi for play in self.plays if play.inning == inning)\n\n    def outs_by(self, pitcher: Person) -> int:\n        \"\"\"Outs recorded while this pitcher was on the mound (including caught stealing).\"\"\"\n        pa_outs = sum(p.pa.pitcher is pitcher and p.pa.outcome in OUT_OUTCOMES for p in self.plays)\n        caught = sum(\n            on_mound is pitcher and not attempt.success\n            for (_, attempt), on_mound in zip(self.steals, self.steal_pitchers, strict=True)\n        )\n        return pa_outs + caught\n\n    def runs_charged_to(self, pitcher: Person) -> int:\n        return sum(charged is pitcher for play in self.plays for charged in play.charged)\n\n\nclass PitcherSource(Protocol):\n    \"\"\"Decides who pitches to each batter (see `veeone.bullpen.PitchingManager`).\"\"\"\n\n    def pitcher_for(self, inning: int, outs: int, lead: int) -> Person:\n        \"\"\"Who pitches next. lead: the fielding team's lead right now.\"\"\"\n        ...\n\n    def record(self, pa: PlateAppearance, runs: int) -> None:\n        \"\"\"A plate appearance just happened; `runs` scored on it.\"\"\"\n        ...\n\n\n@dataclass\nclass Event:\n    \"\"\"One step of a game, for following it live (see `half_inning_steps`).\n\n    kind: \"pitch\"  - a pitch was thrown (pa is the plate appearance so far)\n          \"play\"   - a plate appearance ended (play has the result and runs)\n          \"steal\"  - a steal attempt (steal)\n          \"change\" - a pitching change (pitcher replaced `replaced`)\n          Games add \"half_start\", \"half_end\" and \"game_end\" (see `veeone.league`).\n    \"\"\"\n\n    kind: str\n    inning: int\n    pa: PlateAppearance | None = None\n    play: Play | None = None\n    steal: StealAttempt | None = None\n    pitcher: Person | None = None\n    replaced: Person | None = None\n    outs: int = 0\n    bases: Bases = EMPTY\n    walk_off: bool = False\n\n\n@dataclass\nclass HalfInningState:\n    \"\"\"What's happening right now in a half-inning (updated as it's played).\"\"\"\n\n    inning: int\n    batter: int = 0  # lineup index of the batter up (or about to be)\n    outs: int = 0\n    runs: int = 0\n    bases: Bases = EMPTY\n    pitcher: Person | None = None\n    pa: PlateAppearance | None = None  # the plate appearance in progress, if any\n\n\ndef half_inning_steps(\n    game: GameResult,\n    lineup: list[Person],\n    batter: int,\n    pitcher: Person | PitcherSource,\n    inning: int,\n    rng: random.Random,\n    defense: Defense = RATING_MEAN,\n    runs_to_win: int | None = None,\n    fielding_lead: int = 0,\n    state: HalfInningState | None = None,\n) -> Generator[Event, None, int]:\n    \"\"\"One team bats until 3 outs, one Event at a time. Plays are added to `game`.\n\n    batter: index in the lineup of who leads off.\n    pitcher: one pitcher for the whole half-inning, or a PitcherSource that can\n        change pitchers between batters.\n    runs_to_win: for a home team in the 9th or later: stop as soon as they score\n        this many (a walk-off). Only the runs needed count, unless it's a home run.\n    fielding_lead: the fielding team's lead when the half-inning starts.\n    state: kept up to date as the half-inning goes, for showing it live.\n    Returns the lineup index of who leads off next time.\n    \"\"\"\n    st = state or HalfInningState(inning)\n    st.inning, st.batter = inning, batter\n    responsible: dict[int, Person] = {}  # runner on base -> pitcher who let them on\n    last = pitcher if isinstance(pitcher, Person) else getattr(pitcher, \"current\", None)\n\n    def on_mound() -> Person:\n        if isinstance(pitcher, Person):\n            return pitcher\n        return pitcher.pitcher_for(inning, st.outs, fielding_lead - st.runs)\n\n    def mound_check() -> Generator[Event, None, Person]:\n        nonlocal last\n        current = on_mound()\n        st.pitcher = current\n        if last is not None and current is not last:\n            yield Event(\n                \"change\", inning, pitcher=current, replaced=last, outs=st.outs, bases=st.bases\n            )\n        last = current\n        return current\n\n    while st.outs < OUTS_PER_INNING:\n        current = yield from mound_check()\n        st.bases, attempt = maybe_steal(st.bases, rng)\n        if attempt is not None:\n            game.steals.append((inning, attempt))\n            game.steal_pitchers.append(current)\n            if not attempt.success:\n                responsible.pop(id(attempt.runner), None)\n                st.outs += 1\n            yield Event(\"steal\", inning, steal=attempt, outs=st.outs, bases=st.bases)\n            if st.outs == OUTS_PER_INNING:\n                break  # same batter leads off next inning\n            current = yield from mound_check()\n\n        hitter = lineup[st.batter]\n        on_deck = lineup[(st.batter + 1) % len(lineup)]\n        lead = fielding_lead - st.runs\n        if wants_intentional_walk(st.bases, st.outs, inning, lead, hitter, on_deck, rng):\n            hand = throwing_hand(current, hitter)\n            pa = PlateAppearance(\n                hitter,\n                current,\n                Outcome.WALK,\n                pitcher_hand=hand,\n                bat_side=batting_side(hitter, hand),\n                finished=True,\n                intentional=True,\n            )\n        else:\n            for pa in plate_appearance_steps(hitter, current, rng, defense):\n                st.pa = pa\n                if not pa.finished:\n                    yield Event(\"pitch\", inning, pa=pa, outs=st.outs, bases=st.bases)\n            assert st.pa is not None\n            pa = st.pa\n            st.pa = None\n\n        st.bases, scored = advance(st.bases, pa.outcome, hitter, rng)\n        st.batter = (st.batter + 1) % len(lineup)\n        if pa.outcome not in OUT_OUTCOMES:\n            responsible[id(hitter)] = current\n        charged = [responsible.pop(id(runner), current) for runner in scored]\n        walk_off = runs_to_win is not None and st.runs + len(scored) >= runs_to_win\n        if walk_off and pa.outcome is not Outcome.HOME_RUN:\n            keep = runs_to_win - st.runs  # type: ignore[operator]\n            scored, charged = scored[:keep], charged[:keep]\n        play = Play(pa, inning, scored, charged)\n        game.plays.append(play)\n        if not isinstance(pitcher, Person):\n            pitcher.record(pa, len(scored))\n        st.runs += len(scored)\n        if pa.outcome in OUT_OUTCOMES:\n            st.outs += 1\n        yield Event(\n            \"play\", inning, pa=pa, play=play, outs=st.outs, bases=st.bases, walk_off=walk_off\n        )\n        if walk_off:\n            break\n    return st.batter\n\n\ndef play_half_inning(\n    game: GameResult,\n    lineup: list[Person],\n    batter: int,\n    pitcher: Person | PitcherSource,\n    inning: int,\n    rng: random.Random,\n    defense: Defense = RATING_MEAN,\n    runs_to_win: int | None = None,\n    fielding_lead: int = 0,\n) -> int:\n    \"\"\"`half_inning_steps` played straight through. Returns who leads off next.\"\"\"\n    return run_steps(\n        half_inning_steps(\n            game, lineup, batter, pitcher, inning, rng, defense, runs_to_win, fielding_lead\n        )\n    )\n\n\ndef simulate_game(\n    lineup: list[Person],\n    pitcher: Person,\n    rng: random.Random | None = None,\n    defense: Defense = RATING_MEAN,\n) -> GameResult:\n    \"\"\"The lineup bats through INNINGS innings of OUTS_PER_INNING outs.\n\n    defense: the fielders by position, or one fld rating for all of them (50 = average).\n    \"\"\"\n    rng = rng or random.Random()\n    game = GameResult()\n    batter = 0\n    for inning in range(1, INNINGS + 1):\n        batter = play_half_inning(game, lineup, batter, pitcher, inning, rng, defense)\n    return game\n\n\ndef tally_batting(game: GameResult, lines_by_player: dict[int, BattingLine]) -> None:\n    \"\"\"Add one game's plays and steals to batting lines, keyed by id(player).\"\"\"\n    for play in game.plays:\n        lines_by_player[id(play.pa.hitter)].record(play.pa, play.rbi)\n        for runner in play.scored:\n            lines_by_player[id(runner)].runs += 1\n    for _, attempt in game.steals:\n        line = lines_by_player[id(attempt.runner)]\n        if attempt.success:\n            line.sb += 1\n        else:\n            line.cs += 1\n\n\ndef simulate_season(\n    lineup: list[Person],\n    pitcher: Person,\n    games: int = GAMES_PER_SEASON,\n    rng: random.Random | None = None,\n    defense: Defense = RATING_MEAN,\n) -> list[BattingLine]:\n    \"\"\"One batting line per hitter, in lineup order.\"\"\"\n    rng = rng or random.Random()\n    lines = [BattingLine(player) for player in lineup]\n    by_id = {id(player): line for player, line in zip(lineup, lines, strict=True)}\n    for _ in range(games):\n        game = simulate_game(lineup, pitcher, rng, defense)\n        for line in lines:\n            line.games += 1\n        tally_batting(game, by_id)\n    return lines\n\n\n# Pitcher quality -> the rating used for all four pitcher ratings.\n# 30 and 70 are 2 standard deviations below and above average.\nPITCHER_TIERS: dict[str, int] = {\"bad\": 30, \"average\": 50, \"elite\": 70}\n\n\ndef rated_pitcher(tier: str) -> Person:\n    \"\"\"A pitcher with every rating set to PITCHER_TIERS[tier].\"\"\"\n    value = PITCHER_TIERS[tier]\n    ratings = PitcherRatings(value, value, value, value)\n    return Person(tier.title(), \"Pitcher\", 28, Origin.AMERICAN, \"pitcher\", \"R\", ratings)\n\n\ndef average_pitcher() -> Person:\n    \"\"\"A pitcher rated 50 (league average) in everything.\"\"\"\n    return rated_pitcher(\"average\")\n\n\ndef random_lineup(size: int = 9, rng: random.Random | None = None) -> list[Person]:\n    \"\"\"Random position players with no repeated names.\"\"\"\n    rng = rng or random.Random()\n    lineup: list[Person] = []\n    names: set[str] = set()\n    while len(lineup) < size:\n        person = create_person(player_class=\"position\", rng=rng)\n        if person.full_name not in names:\n            names.add(person.full_name)\n            lineup.append(person)\n    return lineup\n\n\n# Batting sides for the average lineup: a typical mix of righties, lefties and a switch hitter.\nAVERAGE_LINEUP_HANDS = (\"R\", \"L\", \"R\", \"S\", \"L\", \"R\", \"R\", \"L\", \"R\")\n\n\ndef average_lineup(rng: random.Random | None = None) -> list[Person]:\n    \"\"\"9 hitters rated 50 (league average) in everything, with random names.\"\"\"\n    rng = rng or random.Random()\n    lineup = random_lineup(len(AVERAGE_LINEUP_HANDS), rng)\n    ratings = PositionRatings(*[RATING_MEAN] * len(fields(PositionRatings)))\n    for person, hand in zip(lineup, AVERAGE_LINEUP_HANDS, strict=True):\n        person.ratings = replace(ratings)\n        person.handedness = Handedness(hand)\n    return lineup\n\n\n# ---------------------------------------------------------------------------\n# Printing\n# ---------------------------------------------------------------------------\n\n\ndef _rate(value: float) -> str:\n    text = f\"{value:.3f}\"\n    return text[1:] if text.startswith(\"0\") else text  # .250, but 1.012 stays\n\n\ndef format_season(lines: list[BattingLine], pitcher_line: bool = True) -> str:\n    \"\"\"Batting table. pitcher_line: add a footer of the same totals as one pitcher allowed.\"\"\"\n    header = (\n        f\"{'#':>2} {'Player':<20} {'B':1} \"\n        f\"{'CnR':>3} {'CnL':>3} {'POW':>3} {'EYE':>3} {'SPD':>3} {'STL':>3} \"\n        f\"{'G':>3} {'PA':>4} {'AB':>4} {'R':>4} {'H':>4} {'2B':>3} {'3B':>3} {'HR':>3} \"\n        f\"{'RBI':>4} {'BB':>3} {'HBP':>3} {'SO':>4} {'SB':>3} {'CS':>3} \"\n        f\"{'AVG':>5} {'OBP':>5} {'SLG':>5} {'OPS':>5}\"\n    )\n    rows = [header, \"-\" * len(header)]\n\n    def stat_cols(s: BattingLine) -> str:\n        return (\n            f\"{s.games:>3} {s.pa:>4} {s.ab:>4} {s.runs:>4} {s.hits:>4} {s.doubles:>3} \"\n            f\"{s.triples:>3} {s.hr:>3} {s.rbi:>4} {s.bb:>3} {s.hbp:>3} {s.so:>4} \"\n            f\"{s.sb:>3} {s.cs:>3} \"\n            f\"{_rate(s.avg):>5} {_rate(s.obp):>5} {_rate(s.slg):>5} {_rate(s.ops):>5}\"\n        )\n\n    for i, line in enumerate(lines, 1):\n        p = line.player\n        assert p is not None\n        r = p.ratings\n        assert isinstance(r, PositionRatings)\n        rows.append(\n            f\"{i:>2} {p.full_name[:20]:<20} {p.handedness:1} \"\n            f\"{r.con_r:>3} {r.con_l:>3} {r.pow:>3} {r.eye:>3} {r.spd:>3} {r.stl:>3} \"\n            f\"{stat_cols(line)}\"\n        )\n\n    total = sum(lines[1:], lines[0])\n    rows.append(\"-\" * len(header))\n    blank = \" \" * len(f\"{'':>2} {'':<20} {'':1} {'':>3} {'':>3} {'':>3} {'':>3} {'':>3} {'':>3}\")\n    rows.append(f\"{'Team':<{len(blank)}} {stat_cols(total)}\")\n    k_rate = total.so / total.pa if total.pa else 0\n    bb_rate = total.bb / total.pa if total.pa else 0\n    attempts = total.sb + total.cs\n    sb_rate = total.sb / attempts if attempts else 0\n    rows.append(\n        f\"\\nTeam: runs/game {total.runs / total.games:.2f}  K% {k_rate:.1%}  BB% {bb_rate:.1%}  \"\n        f\"SB% {sb_rate:.0%}  steal attempts/game {attempts / total.games:.2f}  \"\n        f\"pitches/PA {total.pitches / total.pa:.2f}  PA/game {total.pa / total.games:.1f}\"\n    )\n    if pitcher_line:\n        # The same totals from the pitcher's side. Every game is 9 innings, and all runs count.\n        g = total.games\n        rows.append(\n            f\"Pitcher: ERA {total.runs / g:.2f}  WHIP {(total.hits + total.bb) / g / 9:.2f}  \"\n            f\"K/9 {total.so / g:.1f}  BB/9 {total.bb / g:.1f}  HR/9 {total.hr / g:.1f}  \"\n            f\"K per 800 BF {total.so / total.pa * 800:.0f}  opp AVG {_rate(total.avg)}\"\n        )\n    return \"\\n\".join(rows)\n\n\ndef main(argv: list[str] | None = None) -> None:\n    parser = argparse.ArgumentParser(description=\"Simulate a season for random lineups.\")\n    parser.add_argument(\"--games\", type=int, default=GAMES_PER_SEASON)\n    parser.add_argument(\"--seed\", type=int, default=None, help=\"repeatable results\")\n    parser.add_argument(\n        \"--pitcher\",\n        nargs=\"+\",\n        choices=list(PITCHER_TIERS),\n        default=[\"average\"],\n        help=\"one random team per pitcher, e.g. --pitcher bad elite\",\n    )\n    parser.add_argument(\n        \"--defense\",\n        type=float,\n        default=RATING_MEAN,\n        help=\"fielding team's average fld (50 = average)\",\n    )\n    parser.add_argument(\n        \"--lineup\",\n        choices=[\"random\", \"average\"],\n        default=\"random\",\n        help=\"random: a new random lineup per pitcher; average: one all-50 lineup faces each\",\n    )\n    args = parser.parse_args(argv)\n\n    rng = random.Random(args.seed)\n    shared = average_lineup(rng) if args.lineup == \"average\" else None\n    for number, tier in enumerate(args.pitcher, 1):\n        pitcher = rated_pitcher(tier)\n        lineup = shared if shared is not None else random_lineup(rng=rng)\n        if len(args.pitcher) > 1:\n            label = f\"{tier} pitcher\" if shared is not None else f\"Team {number}\"\n            print(f\"=== {label.title()} ===\")\n        print(\n            f\"{args.games} games vs {tier} pitcher ({pitcher.ratings}), defense {args.defense:g}\\n\"\n        )\n        print(format_season(simulate_season(lineup, pitcher, args.games, rng, args.defense)))\n        print()\n\n\nif __name__ == \"__main__\":\n    main()\n","veeone/strategy.py":"\"\"\"Managers' in-game decisions (beyond the pitching changes in `bullpen`).\n\nIntentional walks: with first base open and a runner in scoring position late in\na close game, a manager may put a dangerous hitter on to face a weaker one. The\nbatter goes straight to first; no pitches are thrown.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\n\nfrom veeone.bases import Bases\nfrom veeone.person import Person, PositionRatings\n\nLATE_INNING = 7  # from here on, managers walk hitters on purpose much more often\nEARLY_FACTOR = 0.3  # how often (relative to late innings) it happens before then\nMIN_THREAT = 55  # only walk hitters at least this dangerous\nMIN_GAP = 2  # ... and at least this much more dangerous than the next hitter\nGAP_SCALE = 20  # each point of gap past MIN_GAP adds 1/GAP_SCALE to the chance\nMAX_CHANCE = 0.6\n\n\ndef hitter_threat(hitter: Person) -> float:\n    \"\"\"How dangerous a hitter is, on the 20-80 scale: contact and power.\"\"\"\n    r = hitter.ratings\n    assert isinstance(r, PositionRatings)\n    return 0.45 * (r.con_r + r.con_l) / 2 + 0.55 * r.pow\n\n\ndef wants_intentional_walk(\n    bases: Bases,\n    outs: int,\n    inning: int,\n    fielding_lead: int,\n    hitter: Person,\n    on_deck: Person,\n    rng: random.Random,\n) -> bool:\n    \"\"\"Whether the fielding team walks `hitter` on purpose to face `on_deck`.\"\"\"\n    first, second, third = bases\n    if first is not None or (second is None and third is None):\n        return False  # only with first base open and a runner in scoring position\n    if not -2 <= fielding_lead <= 1:\n        return False  # only in a close game\n    threat = hitter_threat(hitter)\n    gap = threat - hitter_threat(on_deck)\n    if threat < MIN_THREAT or gap < MIN_GAP:\n        return False\n    chance = min(MAX_CHANCE, (gap - MIN_GAP + 3) / GAP_SCALE)\n    if inning < LATE_INNING:\n        chance *= EARLY_FACTOR\n    if outs == 2:\n        chance *= 1.3  # set up the force for the third out\n    return rng.random() < chance\n","veeone/team.py":"\"\"\"Teams: a pitching staff (5 starters, 8 relievers, a closer), 8 fielders and a DH.\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass, field\nfrom enum import StrEnum\n\nfrom veeone.atbat import team_defense\nfrom veeone.field import FIELDERS, ROSTER_POSITIONS, Position, draw_field\nfrom veeone.person import Person, PitcherRatings, PlayerClass, create_person\n\nROTATION_SIZE = 5  # starting pitchers SP1-SP5\nBULLPEN_SIZE = 8  # relief pitchers RP1-RP8 (plus one closer)\n\n# Names for generated teams, in order.\nTEAM_NAMES = (\n    \"Red\", \"Blue\", \"Green\", \"Gold\", \"Black\", \"White\",\n    \"Orange\", \"Purple\", \"Silver\", \"Navy\", \"Teal\", \"Maroon\",\n    \"Brown\", \"Gray\", \"Pink\", \"Copper\",\n)  # fmt: skip\n\n\nclass StaffRole(StrEnum):\n    STARTER = \"SP\"\n    RELIEVER = \"RP\"\n    CLOSER = \"CP\"\n\n\n@dataclass\nclass Team:\n    name: str\n    members: list[Person] = field(default_factory=list)\n    league: str = \"\"  # which league the team plays in (\"\" when there's only one)\n    # Each pitcher's job on the staff, keyed by id(pitcher).\n    staff_roles: dict[int, StaffRole] = field(default_factory=dict)\n\n    @property\n    def size(self) -> int:\n        return len(self.members)\n\n    def add(self, person: Person, staff_role: StaffRole | str | None = None) -> None:\n        \"\"\"Add a player.\n\n        Pitchers fill the rotation first, then the bullpen, then the closer spot,\n        unless staff_role says where they go. Every other position holds one player.\n        \"\"\"\n        if person.position is Position.PITCHER:\n            role = StaffRole(staff_role) if staff_role else self._open_staff_role()\n            limits = {\n                StaffRole.STARTER: ROTATION_SIZE,\n                StaffRole.RELIEVER: BULLPEN_SIZE,\n                StaffRole.CLOSER: 1,\n            }\n            if self._count(role) >= limits[role]:\n                raise ValueError(f\"Team {self.name} has no open {role} spot.\")\n            self.staff_roles[id(person)] = role\n        elif person.position is not None and self.at(person.position) is not None:\n            raise ValueError(f\"Team {self.name} already has a {person.position}.\")\n        self.members.append(person)\n\n    def _count(self, role: StaffRole) -> int:\n        return sum(r is role for r in self.staff_roles.values())\n\n    def _open_staff_role(self) -> StaffRole:\n        if self._count(StaffRole.STARTER) < ROTATION_SIZE:\n            return StaffRole.STARTER\n        if self._count(StaffRole.RELIEVER) < BULLPEN_SIZE:\n            return StaffRole.RELIEVER\n        if self._count(StaffRole.CLOSER) < 1:\n            return StaffRole.CLOSER\n        raise ValueError(f\"Team {self.name}'s pitching staff is full.\")\n\n    def at(self, position: Position | str | int) -> Person | None:\n        \"\"\"Who plays a position, by name (\"SS\"), enum, or number (6). P gives SP1.\"\"\"\n        if isinstance(position, int):\n            position = Position.from_number(position)\n        position = Position(position)\n        if position is Position.PITCHER:\n            return self.rotation[0] if self.rotation else None\n        return next((p for p in self.members if p.position is position), None)\n\n    def of_class(self, player_class: PlayerClass | str) -> list[Person]:\n        \"\"\"Members of one class, e.g. team.of_class(\"pitcher\").\"\"\"\n        player_class = PlayerClass(player_class)\n        return [p for p in self.members if p.player_class is player_class]\n\n    def _staff(self, role: StaffRole) -> list[Person]:\n        return [p for p in self.members if self.staff_roles.get(id(p)) is role]\n\n    @property\n    def rotation(self) -> list[Person]:\n        \"\"\"Starting pitchers in order: index 0 is SP1.\"\"\"\n        return self._staff(StaffRole.STARTER)\n\n    @property\n    def bullpen(self) -> list[Person]:\n        \"\"\"Relief pitchers in order: index 0 is RP1 (the best).\"\"\"\n        return self._staff(StaffRole.RELIEVER)\n\n    @property\n    def closer(self) -> Person | None:\n        closers = self._staff(StaffRole.CLOSER)\n        return closers[0] if closers else None\n\n    @property\n    def pitchers(self) -> list[Person]:\n        \"\"\"The whole staff: starters, relievers, then the closer.\"\"\"\n        return [*self.rotation, *self.bullpen, *self._staff(StaffRole.CLOSER)]\n\n    def starter(self, slot: int) -> Person:\n        \"\"\"SP1-SP5 by slot number (1-based).\"\"\"\n        if not 1 <= slot <= len(self.rotation):\n            raise ValueError(f\"Team {self.name} has no SP{slot}.\")\n        return self.rotation[slot - 1]\n\n    def starter_for_game(self, game_number: int) -> Person:\n        \"\"\"Who starts game 1, 2, 3...: the rotation cycles SP1, SP2, ... SP5, SP1, ...\"\"\"\n        return self.rotation[(game_number - 1) % len(self.rotation)]\n\n    def role(self, person: Person) -> str:\n        \"\"\"SP1-SP5, RP1-RP8 or CP for pitchers, otherwise the position (e.g. \"SS\").\"\"\"\n        staff_role = self.staff_roles.get(id(person))\n        match staff_role:\n            case StaffRole.STARTER:\n                return f\"SP{self.rotation.index(person) + 1}\"\n            case StaffRole.RELIEVER:\n                return f\"RP{self.bullpen.index(person) + 1}\"\n            case StaffRole.CLOSER:\n                return \"CP\"\n        return str(person.position) if person.position is not None else \"-\"\n\n    @property\n    def pitcher(self) -> Person | None:\n        \"\"\"The ace (SP1).\"\"\"\n        return self.at(Position.PITCHER)\n\n    @property\n    def fielders(self) -> list[Person]:\n        \"\"\"The 8 players behind the pitcher (positions 2-9) who are filled.\"\"\"\n        return [p for pos in FIELDERS if (p := self.at(pos)) is not None]\n\n    @property\n    def lineup(self) -> list[Person]:\n        \"\"\"Batting order: the 8 fielders and the DH (pitchers don't bat).\"\"\"\n        return [p for p in self.members if p.position is not Position.PITCHER]\n\n    @property\n    def defense(self) -> float:\n        \"\"\"Defense rating for the fielders on the field (average fld).\"\"\"\n        return team_defense(self.fielders)\n\n    def field_diagram(self, starter: Person | None = None) -> str:\n        \"\"\"The field with everyone in place. starter: who's pitching (default SP1).\"\"\"\n        names = {p.position: p.last_name for p in self.lineup if p.position is not None}\n        on_mound = starter or self.pitcher\n        if on_mound is not None:\n            names[Position.PITCHER] = on_mound.last_name\n        return draw_field(names)\n\n    def __str__(self) -> str:\n        noun = \"member\" if self.size == 1 else \"members\"\n        lines = [f\"Team {self.name} ({self.size} {noun})\"]\n        for person in self.pitchers:\n            lines.append(f\"  {self.role(person):<5} {person}\")\n        for person in sorted(self.lineup, key=_roster_order):\n            pos = person.position\n            label = f\"{pos.number or '':>1} {pos:<2}\" if pos is not None else \"    \"\n            lines.append(f\"  {label:<5} {person}\")\n        return \"\\n\".join(lines)\n\n\ndef _roster_order(person: Person) -> int:\n    if person.position is None:\n        return len(ROSTER_POSITIONS)\n    return ROSTER_POSITIONS.index(person.position)\n\n\ndef create_team(\n    name: str,\n    *,\n    rng: random.Random | None = None,\n    taken_names: set[str] | None = None,\n) -> Team:\n    \"\"\"A full random team (23 players).\n\n    SP1-SP5 and RP1-RP8 are each ordered best first, and the best of the nine\n    relievers generated becomes the closer (CP). Then one player at each of\n    positions 2-9, and a DH.\n\n    taken_names: full names already in use; new members avoid them, and their\n        names are added to the set. Share one set across teams so nobody repeats.\n    \"\"\"\n    rng = rng or random.Random()\n    taken = taken_names if taken_names is not None else set()\n\n    def new_player(position: Position) -> Person:\n        while True:\n            person = create_person(position=position, rng=rng)\n            if person.full_name not in taken:\n                taken.add(person.full_name)\n                return person\n\n    def best_first(pitchers: list[Person]) -> list[Person]:\n        return sorted(pitchers, key=pitcher_quality, reverse=True)\n\n    team = Team(name)\n    starters = best_first([new_player(Position.PITCHER) for _ in range(ROTATION_SIZE)])\n    relievers = best_first([new_player(Position.PITCHER) for _ in range(BULLPEN_SIZE + 1)])\n    for person in starters:\n        team.add(person, StaffRole.STARTER)\n    for person in relievers[1:]:\n        team.add(person, StaffRole.RELIEVER)\n    team.add(relievers[0], StaffRole.CLOSER)\n    for position in (*FIELDERS, Position.DESIGNATED_HITTER):\n        team.add(new_player(position))\n    return team\n\n\n# The two leagues created on start, in order, with their teams. The player's team\n# is always in the Diamond League.\nLEAGUES: dict[str, tuple[str, ...]] = {\n    \"Diamond League\": (\n        \"Player1's Team\", \"Stampede\", \"Hyenas\", \"Leopards\",\n        \"Falcons\", \"Ospreys\", \"Sharks\", \"Whales\",\n    ),\n    \"Platinum League\": (\n        \"Cobras\", \"Anacondas\", \"Hawks\", \"Vultures\",\n        \"Hornets\", \"Widows\", \"Polar Bears\", \"Grizzlies\",\n    ),\n}  # fmt: skip\n\n# Short code and colors for each team's crest: (code, main color, accent color).\nTEAM_LOOK: dict[str, tuple[str, str, str]] = {\n    \"Player1's Team\": (\"P1\", \"#1f4fa8\", \"#f2c230\"),\n    \"Stampede\": (\"STM\", \"#7a4a24\", \"#e8c48a\"),\n    \"Hyenas\": (\"HYE\", \"#9c7a3c\", \"#2d2418\"),\n    \"Leopards\": (\"LEO\", \"#d9a21b\", \"#2b2b2b\"),\n    \"Falcons\": (\"FAL\", \"#5b6b7a\", \"#d63a2f\"),\n    \"Ospreys\": (\"OSP\", \"#0f6e74\", \"#f4f1e8\"),\n    \"Sharks\": (\"SHK\", \"#2b5c8a\", \"#9fd3e8\"),\n    \"Whales\": (\"WHL\", \"#12355b\", \"#4fb3d9\"),\n    \"Cobras\": (\"COB\", \"#1d6b3a\", \"#e3c13b\"),\n    \"Anacondas\": (\"ANA\", \"#4f6b1f\", \"#c9d65e\"),\n    \"Hawks\": (\"HWK\", \"#8a2f1f\", \"#e9d8b4\"),\n    \"Vultures\": (\"VUL\", \"#3b2d3f\", \"#c88b5a\"),\n    \"Hornets\": (\"HOR\", \"#1f1f1f\", \"#f2c400\"),\n    \"Widows\": (\"WID\", \"#141414\", \"#d1242f\"),\n    \"Polar Bears\": (\"PB\", \"#5fa8d3\", \"#ffffff\"),\n    \"Grizzlies\": (\"GRZ\", \"#5a3a22\", \"#d9a441\"),\n}\n\n\ndef team_look(name: str) -> tuple[str, str, str]:\n    \"\"\"(code, main color, accent color) for a team's crest.\"\"\"\n    return TEAM_LOOK.get(name) or (\n        \"\".join(w[0] for w in name.split())[:3].upper(),\n        \"#4a5568\",\n        \"#ffffff\",\n    )\n\n\ndef create_leagues(rng: random.Random | None = None) -> list[Team]:\n    \"\"\"Every team in LEAGUES, league by league. Nobody shares a name.\"\"\"\n    taken: set[str] = set()\n    teams = []\n    for league, names in LEAGUES.items():\n        for name in names:\n            team = create_team(name, rng=rng, taken_names=taken)\n            team.league = league\n            teams.append(team)\n    return teams\n\n\ndef create_league(\n    count: int,\n    rng: random.Random | None = None,\n    names: Sequence[str] | None = None,\n) -> list[Team]:\n    \"\"\"`count` random teams, named from `names` (default TEAM_NAMES).\n\n    Nobody shares a name across the teams.\n    \"\"\"\n    names = TEAM_NAMES if names is None else names\n    if count > len(names):\n        raise ValueError(f\"At most {len(names)} teams.\")\n    taken: set[str] = set()\n    return [create_team(name, rng=rng, taken_names=taken) for name in names[:count]]\n\n\ndef pitcher_quality(pitcher: Person) -> float:\n    \"\"\"How good a pitcher is per batter, for ordering: average of mov, acc and vel.\n\n    sta decides how long they can go, not how good they are, so it doesn't count here.\n    \"\"\"\n    r = pitcher.ratings\n    if not isinstance(r, PitcherRatings):\n        raise ValueError(f\"{pitcher.full_name} is not a pitcher.\")\n    return (r.mov + r.acc + r.vel) / 3\n","veeone/web.py":"\"\"\"The season page you open in the browser.\n\nTwo ways to use it:\n    uv run veeone-season\n        Starts a local server and opens the page with a fresh league (11 random\n        teams + Player1's Team) and nothing played yet. The Simulate tab plays\n        games: sim whole days, or start a game and advance it a pitch, an at-bat,\n        a half inning, an inning or the rest of the game at a time.\n    uv run veeone-season --export reports/season.html\n        Simulates a whole season and writes one self-contained HTML file (no\n        server needed; open it by double-clicking).\n    uv run veeone-season --phone reports/phone\n        Builds the phone version into a folder: the game engine runs inside the\n        browser, so it can be hosted on any static host. Seasons are saved in\n        that browser. See veeone.bundle for the files it needs.\n\nOther options: --seed 7 (repeatable), --games 60, --port 8765, --no-open.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport random\nimport webbrowser\nfrom pathlib import Path\nfrom typing import Any\n\nfrom veeone.awards import add_war\nfrom veeone.league import (\n    LeagueRun,\n    LeagueSeason,\n    PitchingLine,\n    TeamGame,\n    simulate_league_season,\n)\nfrom veeone.person import Person, PitcherRatings, PositionRatings\nfrom veeone.season import GAMES_PER_SEASON, BattingLine\nfrom veeone.team import team_look\n\nTEMPLATE = Path(__file__).with_name(\"season_template.html\")\n\n\n# ---------------------------------------------------------------------------\n# Data export\n# ---------------------------------------------------------------------------\n\n\ndef _person(p: Person) -> dict[str, Any]:\n    return {\n        \"name\": p.full_name,\n        \"age\": p.age,\n        \"nat\": p.nationality.title(),\n        \"hand\": str(p.handedness),\n    }\n\n\ndef _batter(team: str, line: BattingLine) -> dict[str, Any]:\n    p = line.player\n    assert p is not None\n    r = p.ratings\n    assert isinstance(r, PositionRatings)\n    return {\n        **_person(p),\n        \"team\": team,\n        \"pos\": str(p.position),\n        \"ratings\": {\n            \"cnr\": r.con_r,\n            \"cnl\": r.con_l,\n            \"pow\": r.pow,\n            \"eye\": r.eye,\n            \"fld\": r.fld,\n            \"spd\": r.spd,\n            \"stl\": r.stl,\n        },\n        \"g\": line.games,\n        \"pa\": line.pa,\n        \"ab\": line.ab,\n        \"r\": line.runs,\n        \"h\": line.hits,\n        \"d\": line.doubles,\n        \"t\": line.triples,\n        \"hr\": line.hr,\n        \"rbi\": line.rbi,\n        \"bb\": line.bb,\n        \"ibb\": line.ibb,\n        \"hbp\": line.hbp,\n        \"so\": line.so,\n        \"sb\": line.sb,\n        \"cs\": line.cs,\n        \"tb\": line.total_bases,\n    }\n\n\ndef _pitcher(team: str, role: str, line: PitchingLine) -> dict[str, Any]:\n    p = line.pitcher\n    r = p.ratings\n    assert isinstance(r, PitcherRatings)\n    return {\n        **_person(p),\n        \"team\": team,\n        \"role\": role,\n        \"ratings\": {\"mov\": r.mov, \"acc\": r.acc, \"vel\": r.vel, \"sta\": r.sta},\n        \"g\": line.g,\n        \"gs\": line.gs,\n        \"w\": line.w,\n        \"l\": line.l,\n        \"sv\": line.sv,\n        \"cg\": line.cg,\n        \"sho\": line.sho,\n        \"outs\": line.outs,\n        \"bf\": line.bf,\n        \"h\": line.h,\n        \"r\": line.r,\n        \"hr\": line.hr,\n        \"bb\": line.bb,\n        \"ibb\": line.ibb,\n        \"hbp\": line.hbp,\n        \"so\": line.so,\n    }\n\n\ndef _game(game: TeamGame) -> dict[str, Any]:\n    def name(p: Person | None) -> str | None:\n        return p.full_name if p is not None else None\n\n    return {\n        \"day\": game.day,\n        \"away\": game.away.name,\n        \"home\": game.home.name,\n        \"ar\": game.away_runs,\n        \"hr\": game.home_runs,\n        \"inn\": game.innings,\n        \"wo\": game.walk_off,\n        \"asp\": game.away_starter.full_name,\n        \"hsp\": game.home_starter.full_name,\n        \"wp\": name(game.winning_pitcher),\n        \"lp\": name(game.losing_pitcher),\n        \"sv\": name(game.save),\n    }\n\n\ndef season_data(\n    season: LeagueSeason, *, seed: int | None = None, player_team: str | None = None\n) -> dict[str, Any]:\n    \"\"\"Everything the page shows, as plain JSON-ready data.\"\"\"\n    teams = []\n    batters = []\n    pitchers = []\n    for record in season.records:\n        team = record.team\n        teams.append(\n            {\n                \"name\": team.name,\n                \"league\": team.league,\n                \"abbr\": team_look(team.name)[0],\n                \"color\": team_look(team.name)[1],\n                \"color2\": team_look(team.name)[2],\n                \"w\": record.w,\n                \"l\": record.l,\n                \"rs\": record.runs_scored,\n                \"ra\": record.runs_allowed,\n                \"defense\": round(team.defense, 1),\n            }\n        )\n        batters += [_batter(team.name, line) | {\"league\": team.league} for line in record.batting]\n        pitchers += [\n            _pitcher(team.name, team.role(line.pitcher), line) | {\"league\": team.league}\n            for line in record.pitching\n        ]\n    data = {\n        \"seed\": seed,\n        \"playerTeam\": player_team,\n        \"gamesPerTeam\": max((r.games for r in season.records), default=0),\n        \"leagues\": list(dict.fromkeys(t[\"league\"] for t in teams)),\n        \"teams\": teams,\n        \"batters\": batters,\n        \"pitchers\": pitchers,\n        \"games\": [_game(g) for g in season.games],\n    }\n    add_war(data, season)\n    return data\n\n\ndef _script_json(value: Any) -> str:\n    # \"<\/\" can't appear inside a <script> block, so escape it in the JSON.\n    return json.dumps(value, ensure_ascii=False, separators=(\",\", \":\")).replace(\"<\/\", \"<\\\\/\")\n\n\ndef render_html(\n    data: dict[str, Any] | None,\n    title: str = \"veeOne Season\",\n    bundle: dict[str, Any] | None = None,\n) -> str:\n    \"\"\"The page with season `data` embedded, or with None to get it from an engine:\n    the local server, or (with `bundle`) the Python engine running in the browser.\"\"\"\n    html = TEMPLATE.read_text(encoding=\"utf-8\")\n    return (\n        html.replace(\"__TITLE__\", title)\n        .replace(\"__SEASON_DATA__\", _script_json(data))\n        .replace(\"__BUNDLE__\", _script_json(bundle))\n    )\n\n\ndef write_report(\n    season: LeagueSeason,\n    out: Path,\n    *,\n    seed: int | None = None,\n    player_team: str | None = None,\n    title: str = \"veeOne Season\",\n) -> Path:\n    out.parent.mkdir(parents=True, exist_ok=True)\n    data = season_data(season, seed=seed, player_team=player_team)\n    out.write_text(render_html(data, title), encoding=\"utf-8\")\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Command line\n# ---------------------------------------------------------------------------\n\n\ndef main(argv: list[str] | None = None) -> None:\n    from veeone import PLAYER_TEAM_NAME, create_starting_teams\n    from veeone.server import SeasonApp, serve\n\n    parser = argparse.ArgumentParser(description=\"Play a season in the browser.\")\n    parser.add_argument(\"--games\", type=int, default=GAMES_PER_SEASON, help=\"games per team\")\n    parser.add_argument(\"--seed\", type=int, default=None, help=\"repeatable results\")\n    parser.add_argument(\"--port\", type=int, default=8765, help=\"local server port\")\n    parser.add_argument(\n        \"--export\", type=Path, default=None, help=\"sim the whole season into this HTML file\"\n    )\n    parser.add_argument(\n        \"--phone\",\n        type=Path,\n        default=None,\n        help=\"build the phone version (runs in the browser, no server) into this folder\",\n    )\n    parser.add_argument(\n        \"--cdn\", action=\"store_true\", help=\"with --phone: load Pyodide from jsDelivr\"\n    )\n    parser.add_argument(\"--no-open\", action=\"store_true\", help=\"don't open the browser\")\n    args = parser.parse_args(argv)\n\n    if args.phone is not None:\n        from veeone.bundle import build_phone_page, download_hint, missing_pyodide_files\n\n        folder = build_phone_page(args.phone, cdn=args.cdn).resolve()\n        print(f\"Phone version written to {folder} (index.html, artifact.html)\")\n        missing = [] if args.cdn else missing_pyodide_files(folder)\n        if missing:\n            print(f\"It also needs Pyodide's runtime in {folder / 'pyodide'}. Missing: {missing}\")\n            print(\"Download it with:\")\n            print(download_hint(folder))\n        return\n\n    seed = args.seed if args.seed is not None else random.randrange(1_000_000)\n    rng = random.Random(seed)\n    teams = create_starting_teams(rng)\n\n    if args.export is not None:\n        season = simulate_league_season(teams, args.games, rng, keep_games=True)\n        path = write_report(season, args.export, seed=seed, player_team=PLAYER_TEAM_NAME)\n        print(f\"Season stats written to {path.resolve()}  (seed {seed})\")\n        if not args.no_open:\n            webbrowser.open(path.resolve().as_uri())\n        return\n\n    app = SeasonApp(LeagueRun(teams, args.games, rng), player_team=PLAYER_TEAM_NAME, seed=seed)\n    server = serve(app, port=args.port)\n    url = f\"http://127.0.0.1:{server.server_address[1]}/\"\n    print(f\"Season page: {url}  (seed {seed})  Press Ctrl+C to stop.\")\n    if not args.no_open:\n        webbrowser.open(url)\n    try:\n        server.serve_forever()\n    except KeyboardInterrupt:\n        print(\"Stopped.\")\n    finally:\n        server.server_close()\n\n\nif __name__ == \"__main__\":\n    main()\n"}}</script>
<script>
"use strict";
// The page runs two ways: as a saved file (season data embedded below), or
// served by `uv run veeone-season`, where it loads data from the server and the
// Simulate tab plays games.
const EMBEDDED = JSON.parse(document.getElementById("season-data").textContent);
// The phone version carries the Python engine and runs it in the browser (Pyodide).
const BUNDLE = JSON.parse(document.getElementById("engine-bundle").textContent);
const IN_BROWSER = BUNDLE !== null;
const SERVER = EMBEDDED === null; // true when there's an engine to play games (server or in-browser)
const SAVE_KEY = "veeone-season-v1";
let session = null; // the in-browser engine's BrowserSession

let D, G, byTeam, standings, maxDiff, LEAD_BY = {};
let SIM = { day: 0, days: 0, over: true, today: [], live: null };
let lastHappened = [];
let lastStep = null;
let busy = false;
let errorText = "";

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rate = (x) => { if (!isFinite(x)) return "-"; const s = x.toFixed(3); return s.startsWith("0") ? s.slice(1) : s; };
const dec = (n) => (x) => (isFinite(x) ? x.toFixed(n) : "-");
const int = (x) => String(x ?? 0);
const div = (a, b) => (b ? a / b : NaN);
const ipFmt = (outs) => `${Math.floor(outs / 3)}.${outs % 3}`;
const signed = (x) => (x > 0 ? `+${x}` : String(x));
const ratingClass = (r) => (r < 35 ? "r1" : r < 45 ? "r2" : r < 55 ? "r3" : r < 65 ? "r4" : "r5");
const isMine = (name) => D && D.playerTeam === name;

// ---------- derived stats ----------
function prepare(data) {
  D = data;
  G = D.gamesPerTeam;
  D.history = D.history || [];
  D.seasonNumber = D.seasonNumber || 1;
  D.batters.forEach((b, i) => { b.id = "b" + i; deriveBatter(b, G); });
  D.pitchers.forEach((p, i) => {
    p.id = "p" + i;
    derivePitcher(p, G);
    p.kind = p.role.startsWith("SP") ? "SP" : p.role.startsWith("RP") ? "RP" : "CP";
    p.roleOrder = (p.kind === "SP" ? 0 : p.kind === "RP" ? 10 : 20) + (parseInt(p.role.slice(2)) || 0);
  });
  const POS_ORDER = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "DH"];
  D.batters.forEach((b) => (b.posOrder = POS_ORDER.indexOf(b.pos)));

  byTeam = {};
  D.teams.forEach((t) => {
    byTeam[t.name] = t;
    t.gp = t.w + t.l;
    t.pct = div(t.w, t.gp);
    t.diff = t.rs - t.ra;
    t.games = [];
    t.home = [0, 0]; t.away = [0, 0];
    const sum = (arr, k) => arr.reduce((a, x) => a + x[k], 0);
    const bat = D.batters.filter((b) => b.team === t.name);
    const pa = sum(bat, "pa"), ab = sum(bat, "ab"), h = sum(bat, "h");
    t.bat = { pa, ab, h, hr: sum(bat, "hr"), sb: sum(bat, "sb"), so: sum(bat, "so"), bb: sum(bat, "bb"),
      avg: div(h, ab), obp: div(h + sum(bat, "bb") + sum(bat, "hbp"), pa), slg: div(sum(bat, "tb"), ab) };
    t.bat.ops = t.bat.obp + t.bat.slg;
    const pit = D.pitchers.filter((p) => p.team === t.name);
    const outs = sum(pit, "outs");
    t.pit = { outs, era: div(sum(pit, "r") * 27, outs), whip: div((sum(pit, "h") + sum(pit, "bb")) * 3, outs),
      k9: div(sum(pit, "so") * 27, outs), so: sum(pit, "so"), oavg: div(sum(pit, "h"), sum(pit, "bf") - sum(pit, "bb") - sum(pit, "hbp")) };
  });
  D.games.forEach((g, i) => {
    g.id = i;
    const homeWon = g.hr > g.ar;
    const h = byTeam[g.home], a = byTeam[g.away];
    h.home[homeWon ? 0 : 1]++; a.away[homeWon ? 1 : 0]++;
    h.games.push({ g, won: homeWon }); a.games.push({ g, won: !homeWon });
  });
  // Standings: each league ranked on its own, Diamond first.
  D.leagues = D.leagues && D.leagues.length ? D.leagues : [""];
  standings = [];
  D.leagues.forEach((lg) => {
    const group = D.teams.filter((t) => leagueOf(t) === lg)
      .sort((a, b) => (b.pct || 0) - (a.pct || 0) || b.diff - a.diff || a.name.localeCompare(b.name));
    group.forEach((t, i) => { t.rank = i + 1; t.gb = (group[0].w - t.w + (t.l - group[0].l)) / 2; });
    standings.push(...group);
  });
  standings.forEach((t) => {
    const last10 = t.games.slice(-10);
    const w10 = last10.filter((x) => x.won).length;
    t.l10 = `${w10}-${last10.length - w10}`;
    let streak = 0, kind = null;
    for (let j = t.games.length - 1; j >= 0; j--) {
      const won = t.games[j].won;
      if (kind === null) kind = won;
      if (won !== kind) break;
      streak++;
    }
    t.strk = kind === null ? "-" : `${kind ? "W" : "L"}${streak}`;
    t.strkVal = kind === null ? 0 : kind ? streak : -streak;
  });
  maxDiff = Math.max(1, ...D.teams.map((t) => Math.abs(t.diff)));

  LEAD_BY = leaderSets(D.batters, D.pitchers);
  // Past seasons: same formulas, each league with its own leaders.
  D.history.forEach((h) => {
    h.batters.forEach((b) => deriveBatter(b, h.gamesPerTeam));
    h.pitchers.forEach((p) => derivePitcher(p, h.gamesPerTeam));
    h.leadsBy = leaderSets(h.batters, h.pitchers);
  });

  // Names are unique across the league, so any name in the page can link to its player.
  byName = {};
  [...D.batters, ...D.pitchers].forEach((p) => (byName[p.name] = p));
  const names = Object.keys(byName).sort((a, b) => b.length - a.length).map((n) => esc(n).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  nameRegex = names.length ? new RegExp(names.join("|"), "g") : null;
}

let byName = {}, nameRegex = null;

// ---------- stat formulas (shared by this season and archived ones) ----------
function deriveBatter(b, G) {
  b.avg = div(b.h, b.ab);
  b.obp = div(b.h + b.bb + b.hbp, b.pa);
  b.slg = div(b.tb, b.ab);
  b.ops = b.obp + b.slg;
  b.qual = G > 0 && b.pa >= 3.1 * G;
  return b;
}
function derivePitcher(p, G) {
  const per9 = (v) => div(v * 27, p.outs);
  p.era = per9(p.r); p.k9 = per9(p.so); p.bb9 = per9(p.bb); p.hr9 = per9(p.hr);
  p.whip = div((p.h + p.bb) * 3, p.outs);
  p.oavg = div(p.h, p.bf - p.bb - p.hbp);
  p.qual = G > 0 && p.outs >= 3 * G;
  return p;
}

// ---------- league leaders ----------
// Which stats count as "leading the league", and whether low or high is best.
// Rate stats (AVG, ERA, ...) need a qualified player, like the leaderboards.
const BAT_LEAD = { r: "max", h: "max", d: "max", t: "max", hr: "max", rbi: "max", bb: "max", ibb: "max", sb: "max",
  avg: "max", obp: "max", slg: "max", ops: "max", war: "max" };
const PIT_LEAD = { w: "max", sv: "max", cg: "max", sho: "max", outs: "max", so: "max", era: "min", whip: "min", k9: "max",
  bb9: "min", hr9: "min", oavg: "min", war: "max" };
const RATE_STATS = new Set(["avg", "obp", "slg", "ops", "era", "whip", "k9", "bb9", "hr9", "oavg"]);

function bestOf(rows, value, dir) {
  let best;
  for (const r of rows) {
    const v = value(r);
    if (!isFinite(v)) continue;
    if (dir === "max" && v <= 0) continue; // nobody "leads" with zero
    if (best === undefined || (dir === "max" ? v > best : v < best)) best = v;
  }
  return best;
}
function computeLeaders(batters, pitchers) {
  const out = {};
  for (const [rows, spec] of [[batters, BAT_LEAD], [pitchers, PIT_LEAD]]) {
    const own = {};
    for (const [key, dir] of Object.entries(spec)) {
      own[key] = bestOf(RATE_STATS.has(key) ? rows.filter((r) => r.qual) : rows, (r) => r[key], dir);
    }
    out[rows === batters ? "bat" : "pit"] = own;
  }
  return out;
}
// Leaders are per league: "leads the league" means the player's own league.
const leagueOf = (row) => (row && row.league) || "";
function leaderSets(batters, pitchers) {
  const out = {};
  for (const lg of new Set([...batters, ...pitchers].map(leagueOf))) {
    out[lg] = computeLeaders(batters.filter((b) => leagueOf(b) === lg), pitchers.filter((p) => leagueOf(p) === lg));
  }
  return out;
}
const leadOf = (row, side) => (LEAD_BY[leagueOf(row)] || {})[side];

// Team crest: a shield in the team's colors with its short code.
function teamIcon(name, size = 18) {
  const t = byTeam && byTeam[name];
  if (!t || !t.abbr) return "";
  const fs = t.abbr.length > 2 ? 7.2 : 8.6;
  return `<svg class="crest" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 1.5 21.5 4.6v7.1c0 5.8-4 9.8-9.5 11.3C6.5 21.5 2.5 17.5 2.5 11.7V4.6z" fill="${t.color}" stroke="${t.color2}" stroke-width="1.4"/>
    <text x="12" y="15" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${t.color2}" font-family="system-ui, sans-serif" letter-spacing="-.3">${esc(t.abbr)}</text></svg>`;
}
const teamName = (name, size) => `${teamIcon(name, size)}${esc(name)}`;
const leagueTitle = (lg) => lg || "League";

// Does this row lead (or tie for the lead in) `key`? `best` is one side of computeLeaders.
function leads(best, row, key, value = row[key]) {
  return best && best[key] !== undefined && value === best[key] && (!RATE_STATS.has(key) || row.qual);
}
function bold(html, on) { return on ? `<b class="lead">${html}</b>` : html; }
const boxes = {}; // finished-game box scores fetched from the server, by game id

// Escape text and turn every player name in it into a link to their card.
function linkNames(text) {
  const safe = esc(text);
  return nameRegex ? safe.replace(nameRegex, (m) => (byName[m] ? `<a data-player="${byName[m].id}">${m}</a>` : m)) : safe;
}
function nameLink(name) {
  const p = byName[name];
  return p ? `<a data-player="${p.id}">${esc(name)}</a>` : esc(name);
}

// A player's line in the live game's box score, if they're in it.
function todayLine(p) {
  const box = SIM.live && SIM.live.box;
  if (!box) return null;
  for (const side of ["away", "home"]) {
    const list = p.id[0] === "b" ? box[side].batting : box[side].pitching;
    const line = list.find((x) => x.name === p.name);
    if (line) return { line, recorded: SIM.live.recorded };
  }
  return null;
}

// Season totals including the game in progress (once a game is recorded, the
// season stats already include it).
const BAT_COUNTS = ["pa", "ab", "r", "h", "d", "t", "hr", "rbi", "bb", "ibb", "hbp", "so", "sb", "cs"];
const PIT_COUNTS = ["outs", "bf", "h", "r", "bb", "ibb", "so", "hr"];
function seasonNow(p, today, recorded) {
  const s = { ...p };
  if (today && !recorded) {
    (p.id[0] === "b" ? BAT_COUNTS : PIT_COUNTS).forEach((k) => (s[k] = (p[k] || 0) + (today[k] || 0)));
    if (p.id[0] === "b") { s.g = p.g + 1; s.tb = p.tb + today.h + today.d + 2 * today.t + 3 * today.hr; }
    else { s.g = p.g + 1; s.gs = p.gs + (today.started ? 1 : 0); if (today.decision === "W") s.w = p.w + 1; if (today.decision === "L") s.l = p.l + 1; if (today.decision === "S") s.sv = p.sv + 1; }
  }
  if (p.id[0] === "b") {
    s.avg = div(s.h, s.ab); s.obp = div(s.h + s.bb + s.hbp, s.pa); s.slg = div(s.tb, s.ab); s.ops = s.obp + s.slg;
  } else {
    s.era = div(s.r * 27, s.outs); s.whip = div((s.h + s.bb) * 3, s.outs); s.k9 = div(s.so * 27, s.outs);
  }
  return s;
}

const sorts = {};
function teamLink(name) {
  return `<a class="teamlink" href="#team/${encodeURIComponent(name)}">${teamName(name)}</a>${isMine(name) ? `<span class="tag mine">You</span>` : ""}`;

const ratingCol = (key, label) => ({ key: "r_" + key, label, value: (r) => r.ratings[key], cell: (r) => r.ratings[key], cls: (r) => "rt " + ratingClass(r.ratings[key]), title: label + " rating" });

function table(id, rows, cols, opts = {}) {
  const st = sorts[id] || (sorts[id] = { key: opts.sort, dir: opts.dir ?? -1 });
  const col = cols.find((c) => c.key === st.key);
  if (col) {
    const val = col.value || ((r) => r[col.key]);
    rows = [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      if (typeof x === "string" || typeof y === "string") return String(x).localeCompare(String(y)) * st.dir;
      const xn = isFinite(x) ? x : -Infinity * st.dir, yn = isFinite(y) ? y : -Infinity * st.dir;
      return (xn - yn) * st.dir || 0;
    });
  }
  const head = cols.map((c) => {
    const cls = [c.text ? "t" : "", c.key === st.key ? "sorted" : "", c.key === st.key && st.dir > 0 ? "asc" : ""].join(" ");
    return `<th class="${cls}" data-table="${id}" data-key="${c.key}" title="${esc(c.title || "")}">${c.label}</th>`;
  }).join("");
  const body = rows.map((r) => `<tr class="${opts.rowClass ? opts.rowClass(r) : ""}">${cols.map((c) => {
    let content = c.cell ? c.cell(r) : (c.fmt || int)(r[c.key]);
    if (opts.lead && opts.lead(r, c)) content = bold(content, true);
    const cls = (c.cls ? c.cls(r) : "") + (c.text ? " t" : "");
    return `<td class="${cls}">${content}</td>`;
  }).join("")}</tr>`).join("");
  const total = opts.total ? `<tr class="total">${cols.map((c, i) => `<td class="${c.text ? "t" : ""}">${i === 0 ? "Total" : (opts.total[c.key] ?? "")}</td>`).join("")}</tr>` : "";
  return `<div class="panel tw"><table><thead><tr>${head}</tr></thead><tbody>${body}${total}</tbody></table></div>`;
}

// A trophy, drawn inline so it needs no image file.
const TROPHY = `<svg class="trophy" viewBox="0 0 64 64" aria-hidden="true">

// The headline stats for a player's season, each bold if it led the league.
// A season's stats for award panels: the line for `name` and that season's leaders.
function seasonLookup(season) {
  const h = D.history.find((x) => x.season === season);
  if (!h) return (name) => { const p = byName[name]; return p ? { line: p, best: leadOf(p, p.id[0] === "b" ? "bat" : "pit") } : null; };
  return (name, kind) => {
    const line = (kind === "pitcher" ? h.pitchers : h.batters).find((x) => x.name === name);
    return line ? { line, best: (h.leadsBy[leagueOf(line)] || {})[kind === "pitcher" ? "pit" : "bat"] } : null;
  };
}
// A season's awards (all leagues): {leagues: {name: {mvp, mvpVotes, cy, cyVotes}}}.
function seasonAwards(season) {
  if (season === D.seasonNumber) return D.awards;
  const h = D.history.find((x) => x.season === season);
  return h && h.awards;
}
// One league's awards for a season.
function awardsFor(season, league = "") {
  const a = seasonAwards(season);
  if (!a) return null;
  return a.leagues ? a.leagues[league] || null : a;
}
// Every award handed out in a season: [{key, league, name, team}].
function awardWinners(season) {
  const a = seasonAwards(season);
  if (!a) return [];
  const byLeague = a.leagues || { "": a };
  const out = [];
  for (const [league, aw] of Object.entries(byLeague)) {
    for (const key of ["mvp", "cy"]) {
      const votes = aw && aw[AWARDS[key].votes];
      if (votes && votes.length) out.push({ key, league, name: votes[0].name, team: votes[0].team });
    }
  }
  return out;
}
const AWARDS = { mvp: { title: "Most Valuable Player", label: "MVP", votes: "mvpVotes" },
                 cy: { title: "Cy Young Award", label: "Cy Young", votes: "cyVotes" } };

// The headline stats for a player's season, each bold if it led the league.
function keyStats(found, kind) {
  if (!found) return [];
  const { line: p, best } = found;
  const stat = (label, key, fmt) => ({ label, value: bold(fmt(p[key]), leads(best, p, key)) });
  return kind === "pitcher"
    ? [{ label: "W-L", value: `${bold(p.w, leads(best, p, "w"))}-${p.l}` }, stat("ERA", "era", dec(2)), stat("IP", "outs", ipFmt),
       stat("SO", "so", int), stat("SV", "sv", int)]
    : [stat("AVG", "avg", rate), stat("HR", "hr", int), stat("RBI", "rbi", int), stat("OPS", "ops", rate), stat("SB", "sb", int)];
}

function awardPanelFor(key, season, league = "") {
  const awards = awardsFor(season, league);
  return awards ? awardPanel(AWARDS[key].title, awards[AWARDS[key].votes], season, league) : "";
}

// A clickable award badge that opens that season's voting.
function awardBadge(key, season, league = "", text = AWARDS[key].label) {
  return `<a class="award" data-award="${key}" data-season="${season}" data-league="${esc(league)}" title="See the ${esc(league ? league + " " : "")}${AWARDS[key].title} voting">${esc(text)}</a>`;
}

function awardPanel(title, votes, season, league = "") {
  if (!votes || !votes.length) return "";
  const v = votes;
  const lookup = seasonLookup(season);
  const mixed = v.some((x) => x.kind !== "pitcher"); // tag pitchers only when hitters are on the ballot too
  const w = v[0];
  const winner = lookup(w.name, w.kind);
  const strip = [...keyStats(winner, w.kind), { label: "WAR", value: bold(dec(1)(w.war), winner && leads(winner.best, winner.line, "war")) }]
    .map((x) => `<div class="mvpstat"><div class="k">${x.label}</div><div class="v">${x.value}</div></div>`).join("");
  const rows = v.map((x, i) => {
    const line = keyStats(lookup(x.name, x.kind), x.kind).map((st) => `${st.value} ${st.label}`).join(" &middot; ");
    return `<tr><td>${i + 1}</td><td class="t">${nameLink(x.name)}${mixed && x.kind === "pitcher" ? ` <span class="tag">P</span>` : ""}</td>
      <td class="t">${teamLink(x.team)}</td><td class="t mvpline">${line}</td><td>${dec(1)(x.war)}</td><td>${x.first}</td><td>${x.points}</td></tr>`;
  }).join("");
  const where = winner ? (winner.line.pos || winner.line.role || "") : "";
  return `<div class="panel mvp">
      <div class="mvphead">
        ${TROPHY}
        <div>
          <div class="mvptitle">${title}</div>
          <div class="muted">${league ? esc(league) + " &middot; " : ""}Season ${season}</div>
        </div>
      </div>
      <div class="who">${nameLink(w.name)} <span class="muted" style="font-size:16px;font-weight:500">${where ? esc(where) + " &middot; " : ""}${esc(w.team)}</span></div>
      <div class="muted">${w.first} of 30 first-place votes &middot; ${w.points} points</div>
      <div class="mvpstats">${strip}</div>
      <h4 class="mvpvoting">Voting</h4>
      <div class="tw"><table><thead><tr><th>#</th><th class="t">Player</th><th class="t">Team</th><th class="t">Season</th><th>WAR</th><th>1st</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}

// Open an award's voting in the popup.
function showAward(key, season, league = "") {

function pastChampions() {
  if (!D.history.length) return "";
  const rows = [...D.history].reverse().flatMap((h) => {
    const leagues = h.leagues && h.leagues.length ? h.leagues : [""];
    return leagues.map((lg) => {
      const champ = h.champions ? h.champions[lg] : h.champion;
      const c = h.standings.find((x) => x.name === champ) || h.standings[0];
      const aw = awardsFor(h.season, lg) || {};
      const cell = (key) => (aw[key] ? `${nameLink(aw[key])} ${awardBadge(key, h.season, lg, "Votes")}` : "-");
      return `<tr><td>${h.season}</td><td class="t">${esc(leagueTitle(lg))}</td><td class="t">${teamLink(champ)}</td><td>${c.w}-${c.l}</td><td>${signed(c.rs - c.ra)}</td><td class="t">${cell("mvp")}</td><td class="t">${cell("cy")}</td></tr>`;
    });
