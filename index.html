// Every season's record for one team, newest first, plus awards its players won.
function recordHistory(name) {
  const rows = [];
  const teamAwards = (team, season) => awardWinners(season).filter((w) => w.team === team)
    .map((w) => `${awardBadge(w.key, season, w.league)} ${nameLink(w.name)}`);
  const t = byTeam[name];
  if (t && t.gp > 0) {
    rows.push({ season: D.seasonNumber, w: t.w, l: t.l, rs: t.rs, ra: t.ra, rank: t.rank, gb: t.gb,
      champ: SIM.over && t.rank === 1, now: !SIM.over, awards: SIM.over ? teamAwards(name, D.seasonNumber) : [] });
  }
  [...D.history].reverse().forEach((h) => {
    const mine = h.standings.find((x) => x.name === name);
    if (!mine) return;
    const group = h.standings.filter((x) => leagueOf(x) === leagueOf(mine)); // ranked within its league
    const i = group.indexOf(mine), top = group[0], r = mine;
    rows.push({ season: h.season, w: r.w, l: r.l, rs: r.rs, ra: r.ra, rank: i + 1,
      gb: (top.w - r.w + (r.l - top.l)) / 2, champ: i === 0, awards: teamAwards(name, h.season) });
  });
  if (!rows.length) return "";
  const body = rows.map((r) => `<tr>
      <td>${r.season}${r.now ? ` <span class="tag">now</span>` : ""}</td><td>${r.w}</td><td>${r.l}</td><td>${rate(div(r.w, r.w + r.l))}</td>
      <td>${ordinal(r.rank)}${r.champ ? ` <span class="award">League champion</span>` : ""}</td><td>${r.gb === 0 ? "-" : r.gb}</td>
      <td>${r.rs}</td><td>${r.ra}</td><td class="${r.rs >= r.ra ? "pos" : "neg"}">${signed(r.rs - r.ra)}</td>
      <td class="t">${r.awards.join(" &middot; ") || ""}</td></tr>`).join("");
  const total = rows.reduce((a, r) => ({ w: a.w + r.w, l: a.l + r.l, titles: a.titles + (r.champ ? 1 : 0) }), { w: 0, l: 0, titles: 0 });
  const summary = rows.length > 1 ? `<p class="muted" style="margin-top:6px">All-time: ${total.w}-${total.l} (${rate(div(total.w, total.w + total.l))}), ${total.titles} title${total.titles === 1 ? "" : "s"}.</p>` : "";
  return `<h2>Record by season</h2><div class="panel tw"><table><thead><tr><th>Season</th><th>W</th><th>L</th><th>PCT</th><th>Finish</th><th>GB</th><th>RS</th><th>RA</th><th>DIFF</th><th class="t">Awards</th></tr></thead><tbody>${body}</tbody></table></div>${summary}`;
}

function viewTeam(name) {
  const t = byTeam[name];
  if (!t) return `<p>No team called ${esc(name)}.</p>`;
  const bat = D.batters.filter((b) => b.team === name);
  const pit = D.pitchers.filter((p) => p.team === name);
  const games = [...t.games].reverse().slice(0, 20).map((x) => x.g);
  const chip = (k, v) => `<div class="panel card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="teamhead">${teamIcon(name, 52)}<h2>${esc(name)}</h2>${isMine(name) ? `<span class="tag mine">Your team</span>` : ""}<span class="sub">${t.league ? esc(t.league) + " &middot; " : ""}${t.gp ? `${t.w}-${t.l} &middot; ${ordinal(t.rank)} place${t.gb ? ", " + t.gb + " GB" : ""}` : "No games yet"}</span></div>
    <div class="cards">${chip("Runs scored", t.rs)}${chip("Runs allowed", t.ra)}${chip("Run diff", `<span class="${t.diff >= 0 ? "pos" : "neg"}">${signed(t.diff)}</span>`)}
      ${chip("Home / Away", `${t.home.join("-")} / ${t.away.join("-")}`)}${chip("Slash line", `${rate(t.bat.avg)}/${rate(t.bat.obp)}/${rate(t.bat.slg)}`)}
      ${chip("Team ERA", dec(2)(t.pit.era))}${chip("Defense", t.defense.toFixed(1))}${chip("Last 10 / Streak", `${t.l10} / ${t.strk}`)}</div>
    <h2>Batting</h2>${table("tb-" + name, bat, BAT_COLS(false, true), { sort: "posOrder", dir: 1, lead: batLead, total: {
      pa: t.bat.pa, ab: t.bat.ab, h: t.bat.h, hr: t.bat.hr, so: t.bat.so, bb: t.bat.bb, sb: t.bat.sb, r: t.rs,
      avg: rate(t.bat.avg), obp: rate(t.bat.obp), slg: rate(t.bat.slg), ops: rate(t.bat.ops) } })}
    <h2>Pitching</h2>${table("tp-" + name, pit, PIT_COLS(false, true), { sort: "roleOrder", dir: 1, lead: pitLead, total: {
      outs: ipFmt(t.pit.outs), so: t.pit.so, r: t.ra, era: dec(2)(t.pit.era), whip: dec(2)(t.pit.whip), k9: dec(1)(t.pit.k9), oavg: rate(t.pit.oavg) } })}
    ${recordHistory(name)}
    <h2>${games.length ? `Last ${games.length} games` : "Games"}</h2>${games.length ? gamesTable("tg-" + name, games, name) : `<p class="muted">No games played yet.</p>`}`;
}

function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function filterPlayers(rows) {
  const q = ui.search.trim().toLowerCase();
  return rows.filter((r) => (ui.team === "all" || r.team === ui.team) && (ui.league === "all" || leagueOf(r) === ui.league)
    && (!q || r.name.toLowerCase().includes(q)) && (!ui.qualified || r.qual));
}

function controls(extra = "") {
  return `<div class="controls">
    <input type="search" id="q" placeholder="Search players..." value="${esc(ui.search)}">
    ${leagueOptions(ui.league)}
    <select id="teamsel">${teamOptions(ui.team)}</select>
    ${extra}
    <label class="chk"><input type="checkbox" id="qual" ${ui.qualified ? "checked" : ""}> Qualified only</label>
    <label class="chk"><input type="checkbox" id="rat" ${ui.ratings ? "checked" : ""}> Show ratings</label>
  </div>`;
}

function viewBatting() {
  const rows = filterPlayers(D.batters);
  return controls() + table("batting", rows, BAT_COLS(true, ui.ratings), { sort: "ops", rowClass: mineRow, lead: batLead }) + countNote(rows.length, "hitters") + leadNote();
}

function viewPitching() {
  const roleSel = `<select id="rolesel">${["all", "SP", "RP", "CP"].map((r) => `<option value="${r}" ${ui.role === r ? "selected" : ""}>${r === "all" ? "All roles" : r}</option>`).join("")}</select>`;
  const rows = filterPlayers(D.pitchers).filter((p) => ui.role === "all" || p.kind === ui.role);
  return controls(roleSel) + table("pitching", rows, PIT_COLS(true, ui.ratings), { sort: "era", dir: 1, rowClass: mineRow, lead: pitLead }) + countNote(rows.length, "pitchers") + leadNote();
}

const batLead = (r, c) => leads(leadOf(r, "bat"), r, c.key);
const pitLead = (r, c) => leads(leadOf(r, "pit"), r, c.key);
const leadNote = () => `<p class="muted" style="margin-top:4px"><b class="lead">Bold</b> = leads their league.</p>`;

function countNote(n, what) {
  const rule = what === "hitters" ? `3.1 PA per team game (${Math.ceil(3.1 * G)} PA)` : `1 IP per team game (${G} IP)`;
  return `<p class="muted" style="margin-top:8px">${n} ${what}. Qualified: ${rule}.</p>`;
}

function viewLeaders() {
  return D.leagues.map((lg) => (lg ? `<h2 class="leaguehead">${esc(lg)}</h2>` : "") +
    leaderBoards(D.batters.filter((b) => leagueOf(b) === lg), D.pitchers.filter((p) => leagueOf(p) === lg))).join("");
}

function leaderBoards(batters, pitchers) {
  const qb = batters.filter((b) => b.qual), qp = pitchers.filter((p) => p.qual);
  const board = (title, rows, key, fmt, asc = false) => {
    const top = [...rows].filter((p) => isFinite(p[key]) && (asc || p[key] > 0)).sort((a, b) => (asc ? a[key] - b[key] : b[key] - a[key])).slice(0, 10);
    const list = top.length
      ? `<ol>${top.map((p, i) => `<li><span class="n">${i + 1}</span><span class="who">${playerLink(p)} <span class="tm">${esc(p.team)}</span></span><span class="val">${bold(fmt(p[key]), p[key] === top[0][key])}</span></li>`).join("")}</ol>`
      : `<div class="empty">No qualified players yet.</div>`;
    return `<div class="panel"><h3>${title}</h3>${list}</div>`;
  };
  return `<h3 class="subhead">Batting</h3><div class="leaders">
      ${board("Batting average", qb, "avg", rate)}${board("Home runs", batters, "hr", int)}${board("Runs batted in", batters, "rbi", int)}
      ${board("On-base %", qb, "obp", rate)}${board("Slugging %", qb, "slg", rate)}${board("OPS", qb, "ops", rate)}
      ${board("Hits", batters, "h", int)}${board("Runs", batters, "r", int)}${board("WAR", batters, "war", dec(1))}
    </div>
    <h3 class="subhead">Pitching</h3><div class="leaders">
      ${board("Wins", pitchers, "w", int)}${board("ERA", qp, "era", dec(2), true)}${board("Strikeouts", pitchers, "so", int)}
      ${board("Saves", pitchers, "sv", int)}${board("WHIP", qp, "whip", dec(2), true)}${board("K per 9", qp, "k9", dec(1))}
      ${board("Innings", pitchers, "outs", ipFmt)}${board("Opponent AVG", qp, "oavg", rate, true)}${board("WAR", pitchers, "war", dec(1))}
      ${board("Complete games", pitchers, "cg", int)}${board("Shutouts", pitchers, "sho", int)}
    </div>`;
}

function gamesTable(id, games, team = null) {
  const cols = [
    { key: "day", label: "Day" },
    ...(team ? [{ key: "res", label: "", text: true, value: (g) => ((g.home === team) === (g.hr > g.ar) ? 1 : 0),
      cell: (g) => ((g.home === team) === (g.hr > g.ar) ? `<span class="pos">W</span>` : `<span class="neg">L</span>`) }] : []),
    { key: "away", label: "Away", text: true, cell: (g) => teamLink(g.away) },
    { key: "ar", label: "R", cell: (g) => (g.ar > g.hr ? `<b>${g.ar}</b>` : g.ar) },
    { key: "home", label: "Home", text: true, cell: (g) => teamLink(g.home) },
    { key: "hr", label: "R", cell: (g) => (g.hr > g.ar ? `<b>${g.hr}</b>` : g.hr) },
    { key: "inn", label: "Inn" },
    { key: "wp", label: "W", text: true, cell: (g) => esc(g.wp ?? "") },
    { key: "lp", label: "L", text: true, cell: (g) => esc(g.lp ?? "") },
    { key: "sv", label: "SV", text: true, cell: (g) => esc(g.sv ?? "") },
    { key: "note", label: "", text: true, value: (g) => g.inn, cell: (g) => (g.wo ? `<span class="tag">walk-off</span>` : "") + (g.inn > 9 ? `<span class="tag">${g.inn} inn</span>` : "") },
    ...(SERVER ? [{ key: "box", label: "", text: true, value: (g) => g.id, cell: (g) => `<a href="#box/${g.id}">Box</a>` }] : []),
  ];
  return table(id, games, cols, { sort: "day", dir: team ? -1 : 1, rowClass: (g) => (isMine(g.home) || isMine(g.away) ? "mine" : "") });
}

function viewGames() {
  const games = D.games.filter((g) => ui.gameTeam === "all" || g.home === ui.gameTeam || g.away === ui.gameTeam);
  if (!D.games.length) return `<p class="muted">No games played yet.${SERVER ? ` Use the <a href="#simulate">Simulate</a> tab to play some.` : ""}</p>`;
  return `<div class="controls"><select id="gamesel">${teamOptions(ui.gameTeam)}</select><span class="count">${games.length} games</span></div>` +
    gamesTable("games", games, ui.gameTeam === "all" ? null : ui.gameTeam);
}

// ---------- Simulate tab ----------
// ---------- home ----------
const SEASON_LENGTHS = [[162, "Full season (162 games)"], [81, "Half season (81)"], [40, "Short season (40)"], [20, "Quick season (20)"]];
const hasStarted = () => SIM.day > 1 || D.seasonNumber > 1 || (SIM.today || []).some((g) => g.status !== "pending");
function viewHome() {
  const me = D.playerTeam && byTeam[D.playerTeam];
  const started = hasStarted();
  const dis = busy ? "disabled" : "";
  const err = errorText ? `<p class="error">${esc(errorText)}</p>` : "";
  const myGame = (SIM.today || []).find((g) => g.mine);

  // Where the season stands, and the quick buttons.
  const status = SIM.over ? `Season ${D.seasonNumber} is over` : `Season ${D.seasonNumber} &middot; Day ${SIM.day} of ${SIM.days}`;
  let playBtn = "";
  if (myGame && myGame.status !== "final" && !SIM.over) {
    playBtn = `<button class="primary" data-act="playmine" data-index="${myGame.index}" ${dis}>${myGame.status === "live" ? "Resume my game" : "Play my game"}</button>`;
  }
  const hero = `<div class="panel hero">
    <div class="herotop">${me ? teamIcon(me.name, 56) : ""}<div>
      <div class="herotitle">${me ? esc(me.name) : "veeOne"}</div>
      <div class="muted">${status}${me && me.gp ? ` &middot; ${me.w}-${me.l}, ${ordinal(me.rank)} in the ${esc(leagueTitle(leagueOf(me)))}` : ""}</div>
    </div></div>
    <div class="heroacts">
      ${playBtn}
      <a class="btn ${playBtn ? "" : "primary"}" href="#simulate">${started ? "Continue" : "Go to today's games"}</a>
      ${SIM.over ? "" : `<button data-act="sim" data-days="1" ${dis}>Sim day</button>`}
      ${me ? `<a class="btn" href="#team/${esc(me.name)}">My team</a>` : ""}
      <a class="btn" href="#standings">Standings</a>
      <a class="btn" href="#leaders">Leaders</a>
    </div></div>`;

  // Today's game for the player's team.
  let today = `<div class="muted">No game today.</div>`;
  if (myGame) {
    const home = myGame.home === D.playerTeam;
    const opp = home ? myGame.away : myGame.home;
    const score = myGame.status === "pending" ? "" : `<div class="score">${teamName(myGame.away)} ${myGame.ar}, ${teamName(myGame.home)} ${myGame.hr}</div>
      <div class="muted">${myGame.status === "final" ? "Final" : esc(myGame.inning)}</div>`;
    today = `<div class="big">${home ? "vs" : "@"} ${teamName(opp, 22)}</div>
      ${myGame.seriesLength ? `<div class="muted">Game ${myGame.seriesGame} of ${myGame.seriesLength}${myGame.interleague ? ` <span class="tag inter">Interleague</span>` : ""}</div>` : ""}
      ${score || `<div class="muted" style="margin-top:6px">${esc(myGame.away)}: ${esc(myGame.awaySP)}<br>${esc(myGame.home)}: ${esc(myGame.homeSP)}</div>`}`;
  } else if (SIM.over) today = `<div class="muted">The season is over. Start the next one from the Simulate tab.</div>`;

  // Last few results.
  let recent = `<div class="muted">No games played yet.</div>`;
  if (me && me.games.length) {
    recent = `<div class="chips">` + me.games.slice(-10).reverse().map(({ g, won }) => {
      const home = g.home === me.name;
      const us = home ? g.hr : g.ar, them = home ? g.ar : g.hr;
      const opp = byTeam[home ? g.away : g.home];
      return `<span class="chip ${won ? "w" : "l"}" title="Day ${g.day}">${won ? "W" : "L"} ${us}-${them} ${home ? "vs" : "@"} ${esc((opp && opp.abbr) || "")}</span>`;
    }).join("") + `</div><div class="muted" style="margin-top:8px">Streak ${me.strk} &middot; Last 10: ${me.l10}</div>`;
  }

  // The player's league table.
  const lg = me ? leagueOf(me) : D.leagues[0];
  const race = `<table class="mini"><thead><tr><th class="t">Team</th><th>W</th><th>L</th><th>GB</th></tr></thead><tbody>` +
    standings.filter((t) => leagueOf(t) === lg).map((t) => `<tr class="${isMine(t.name) ? "mine" : ""}"><td class="t">${teamLink(t.name)}</td><td>${t.w}</td><td>${t.l}</td><td>${t.gb === 0 ? "-" : t.gb}</td></tr>`).join("") +
    `</tbody></table>`;

  // The player's best players so far, by WAR.
  const top = (rows, n) => rows.filter((r) => r.team === D.playerTeam).sort((a, b) => (b.war || 0) - (a.war || 0)).slice(0, n);
  const stars = [...top(D.batters, 3).map((b) => [b, b.pos]), ...top(D.pitchers, 2).map((x) => [x, x.role])];
  const starList = D.games.length && stars.length
    ? `<ol class="stars">${stars.map(([r, pos]) => `<li><span class="who">${nameLink(r.name)} <span class="muted">${esc(pos)}</span></span><span class="val">${(r.war || 0).toFixed(1)} WAR</span></li>`).join("")}</ol>`
    : `<div class="muted">Play some games to see who's leading the way.</div>`;

  const cards = `<div class="homegrid">
    <div class="panel hcard"><h3>Today</h3>${today}</div>
    <div class="panel hcard"><h3>Recent results</h3>${recent}</div>
    <div class="panel hcard"><h3>${esc(leagueTitle(lg))}</h3>${race}</div>
    <div class="panel hcard"><h3>Top players</h3>${starList}</div>
  </div>`;

  // Start over.
  const newGame = `<div class="panel hcard newgame"><h3>New game</h3>
    <p class="muted">A brand-new league: new players on every team, season 1, day 1.${started ? " <b>Your current league and all its history will be erased.</b>" : ""}</p>
    <div class="ngrow">
      <label>Season length <select id="nglen">${SEASON_LENGTHS.map(([n, label]) => `<option value="${n}" ${n === ui.newGames ? "selected" : ""}>${label}</option>`).join("")}</select></label>
      <label>League seed <input id="ngseed" inputmode="numeric" placeholder="random" value="${esc(ui.newSeed)}" size="9"></label>
      <button class="${started ? "danger" : "primary"}" data-act="newgame" ${dis}>${ui.confirmNew ? "Tap again to erase and start over" : "Start new game"}</button>
    </div>
    <div class="muted small">This league's seed is ${esc(SIM.seed ?? "?")}. The same seed and length always build the same league.</div>
  </div>`;

  return err + hero + cards + newGame + pastChampions();
}

function viewSimulate() {
  const err = errorText ? `<p class="error">${esc(errorText)}</p>` : "";
  if (SIM.live && !ui.hideLive) return err + viewLive(SIM.live);
  if (SIM.over) {
    return err + `<div class="simhead"><h2>Season ${D.seasonNumber} complete</h2>
        <button class="primary" data-act="nextseason" ${busy ? "disabled" : ""}>Start season ${D.seasonNumber + 1}</button></div>
      <p>All ${SIM.days} days have been played. ${D.leagues.map((lg) => {
        const top = standings.find((t) => leagueOf(t) === lg);
        return `${teamLink(top.name)} won ${lg ? "the " + esc(lg) : "the title"} at ${top.w}-${top.l}.`;
      }).join(" ")}
      See the <a href="#standings">standings</a> and <a href="#leaders">leaders</a>.</p>
      ${D.leagues.map((lg) => (lg ? `<h2 class="leaguehead">${esc(lg)} awards</h2>` : "") + awardPanelFor("mvp", D.seasonNumber, lg) + awardPanelFor("cy", D.seasonNumber, lg)).join("")}
      <p class="muted">Starting the next season keeps every team and player (a year older), saves this season's stats to each
      player's career, and resets the standings.</p>`;
  }
  const dis = busy ? "disabled" : "";
  const head = `<div class="simhead">
      <h2>Season ${D.seasonNumber} &middot; Day ${SIM.day} of ${SIM.days}</h2>
      <button class="primary" data-act="sim" data-days="1" ${dis}>Sim day</button>
      <button data-act="sim" data-days="7" ${dis}>Sim 7 days</button>
      <button data-act="sim" data-days="${SIM.days}" ${dis}>Sim to end of season</button>
    </div>`;
  const card = (g) => {
    let body;
    if (g.status === "final") {
      body = `<div class="score">${teamName(g.away)} ${g.ar}, ${teamName(g.home)} ${g.hr}</div><div class="sp">Final${g.innings !== 9 ? ` (${g.innings})` : ""}</div>
        <div class="actions"><a href="#box/${g.gameId}">Box score</a></div>`;
    } else if (g.status === "live") {
      body = `<div class="score">${teamName(g.away)} ${g.ar}, ${teamName(g.home)} ${g.hr}</div><div class="sp">${esc(g.inning)}</div>
        <div class="actions"><button class="primary" data-act="start" data-index="${g.index}" ${dis}>Resume game</button></div>`;
    } else {
      body = `<div class="sp">${esc(g.away)}: ${esc(g.awaySP)}<br>${esc(g.home)}: ${esc(g.homeSP)}</div>
        <div class="actions">${g.mine ? `<button class="primary" data-act="start" data-index="${g.index}" ${dis}>Start game</button>` : `<span class="muted small">Sims after your game</span>`}</div>`;
    }
    return `<div class="panel gamecard ${g.mine ? "mine" : ""}">
      <div class="teams">${teamName(g.away, 22)} @ ${teamName(g.home, 22)}${g.mine ? ` <span class="tag mine">Your game</span>` : ""}</div>
      ${g.seriesLength ? `<div class="series">Game ${g.seriesGame} of ${g.seriesLength}${g.interleague ? ` <span class="tag inter">Interleague</span>` : ""}</div>` : ""}${body}</div>`;
  };
  const byMine = (a, b) => b.mine - a.mine || a.index - b.index;
  const section = (title, games) => (games.length ? (title ? `<h3 class="subhead">${esc(title)}</h3>` : "") + `<div class="games">${games.sort(byMine).map(card).join("")}</div>` : "");
  const inter = SIM.today.filter((g) => g.interleague);
  const cards = section("Interleague", inter) + D.leagues.map((lg) => section(lg, SIM.today.filter((g) => !g.interleague && (g.league || "") === lg))).join("");
  const progress = progressText ? `<p><b>${esc(progressText)}</b></p>` : "";
  const saved = IN_BROWSER ? " Your season is saved in this browser." : "";
  return err + head + progress + `<p class="muted">Play your game pitch by pitch; the other games sim when it ends. Or sim the whole day. Today's games are played with each team's next starter.${saved}</p>
    ${cards}`;
}

function viewLive(L) {
  const innings = Math.max(9, L.lineScore.away.length);
  const cell = (v) => (v === null || v === undefined ? "" : v);
  const lsHead = `<tr><th class="t"></th>${Array.from({ length: innings }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th></tr>`;
  const lsRow = (side) => {
    const t = L[side];
    return `<tr><td class="t"><b>${teamName(t.name)}</b>${isMine(t.name) ? ` <span class="tag mine">You</span>` : ""}</td>${Array.from({ length: innings }, (_, i) => `<td>${cell(L.lineScore[side][i])}</td>`).join("")}<td class="rh">${t.runs}</td><td class="rh">${t.hits}</td></tr>`;
  };
  const dots = (cls, n, max, label) => `<div class="dots ${cls}"><b>${label}</b>${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>`;
  const runners = ["1st", "2nd", "3rd"].map((b, i) => (L.bases[i] ? `${b}: ${nameLink(L.bases[i])}` : null)).filter(Boolean).join(" &middot; ");
  const dis = busy || L.finished ? "disabled" : "";
  const situation = L.finished
    ? `<div class="final">${esc(L.status)}: ${esc(L.away.name)} ${L.away.runs}, ${esc(L.home.name)} ${L.home.runs}</div>
       ${L.autoSimmed ? `<div class="note" style="margin-bottom:6px">The other ${L.autoSimmed.games} games on day ${L.autoSimmed.day} were simmed. <a href="#games">See the results</a>.</div>` : ""}
       <div class="muted">W: ${L.decisions.w ? nameLink(L.decisions.w) : "-"} &middot; L: ${L.decisions.l ? nameLink(L.decisions.l) : "-"}${L.decisions.s ? ` &middot; S: ${nameLink(L.decisions.s)}` : ""}</div>`
    : `<div class="situation">
        <div class="inningbig">${L.top ? "&#9650;" : "&#9660;"} ${esc(L.status)}</div>
        <div class="diamond"><i class="b2 ${L.bases[1] ? "on" : ""}"></i><i class="b3 ${L.bases[2] ? "on" : ""}"></i><i class="b1 ${L.bases[0] ? "on" : ""}"></i></div>
        <div>${dots("balls", L.balls, 3, "B")}${dots("strikes", L.strikes, 2, "S")}${dots("outs", L.outs, 2, "O")}</div>
      </div>
      <div class="runners">${runners || "Bases empty"}</div>
      <div class="matchup">
        <div><div class="k">Pitching &middot; ${esc(L.fielding)}</div>
          <div class="who">${L.pitcher ? nameLink(L.pitcher.name) : "-"} ${L.pitcher ? `<span class="tag">${esc(L.pitcher.role)}</span>` : ""}</div>
          <div class="muted">${L.pitcher ? `${L.pitcher.pitches} pitches &middot; ${esc(L.pitcher.today)}` : ""}</div></div>
        <div><div class="k">At bat &middot; ${esc(L.batting)}</div>
          <div class="who">${L.batter ? nameLink(L.batter.name) : "-"} ${L.batter ? `<span class="tag">${esc(L.batter.pos)}, bats ${esc(L.batter.hand)}</span>` : ""}</div>
          <div class="muted">${L.batter ? esc(L.batter.today) : ""}${L.onDeck ? ` &middot; on deck: ${nameLink(L.onDeck)}` : ""}</div></div>
      </div>`;
  const steps = [["pitch", "1 pitch"], ["ab", "At-bat"], ["half", "&frac12; inning"], ["inning", "Inning"], ["game", "Rest of game"]];
  const buttons = L.finished
    ? `<button class="primary" data-act="close" ${busy ? "disabled" : ""}>${SIM.over ? "Done" : L.day !== SIM.day ? `Continue to day ${SIM.day}` : "Back to today's games"}</button>`
    : `<span class="muted">Advance:</span>` + steps.map(([k, label]) => `<button class="${k === "pitch" ? "primary" : ""}" data-act="adv" data-step="${k}" ${dis}>${label}</button>`).join("") +
      `<button data-act="togglebox">${ui.showBox ? "Hide" : "Show"} box score</button>` +
      `<button data-act="back" ${busy ? "disabled" : ""}>Back to schedule</button>`;
  const happened = lastHappened.length
    ? `<ul class="happened">${lastHappened.map((e) => `<li class="${e.kind}">${linkNames(e.text)}</li>`).join("")}</ul>`
    : `<p class="muted">Press an Advance button to play.</p>`;
  const feed = [];
  let lastHalf = null;
  [...L.log].reverse().forEach((e) => {
    if (e.kind === "half_start") return;
    const half = `${e.top ? "Top" : "Bottom"} ${ordinal(e.inning)}`;
    if (half !== lastHalf) { feed.push(`<li class="inning">${half}</li>`); lastHalf = half; }
    const big = e.kind === "game_end" || /homers|Walk-off/.test(e.text) ? "big" : "";
    feed.push(`<li class="${e.kind} ${big}">${linkNames(e.text)}</li>`);
  });
  return `<div class="live">
      <div>
        <div class="panel box">
          <h3>Day ${L.day} &middot; ${esc(L.away.name)} @ ${esc(L.home.name)}</h3>
          <div class="tw"><table class="linescore"><thead>${lsHead}</thead><tbody>${lsRow("away")}${lsRow("home")}</tbody></table></div>
          ${situation}
          <div class="advance">${buttons}</div>
        </div>
        <div class="panel box" style="margin-top:14px">
          <h3>What happened${lastStep ? ` &middot; ${esc(lastStep)}` : ""}</h3>${happened}
        </div>
      </div>
      <div class="panel box"><h3>Play-by-play</h3>${feed.length ? `<ul class="feed">${feed.join("")}</ul>` : `<p class="muted">Nothing yet.</p>`}</div>
    </div>` + (L.box && (L.finished || ui.showBox) ? renderBox({ ...L.box, recorded: L.recorded }) : "");
}

// ---------- box score ----------
function renderBox(box) {
  const recorded = box.recorded;
  const season = (name) => {
    const p = byName[name];
    if (!p) return null;
    const side = ["away", "home"].find((k) => box[k].batting.concat(box[k].pitching).some((x) => x.name === name));
    const list = p.id[0] === "b" ? box[side].batting : box[side].pitching;
    return seasonNow(p, list.find((x) => x.name === name), recorded);
  };
  const innings = Math.max(9, box.innings);
  const lineScore = `<div class="tw"><table class="linescore"><thead><tr><th class="t"></th>${Array.from({ length: innings }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th><th>LOB</th></tr></thead><tbody>` +
    ["away", "home"].map((k) => {
      const b = box[k];
      const byInning = box.lines ? box.lines[k] : [];
      return `<tr><td class="t"><b>${esc(b.team)}</b></td>${Array.from({ length: innings }, (_, i) => `<td>${byInning[i] ?? ""}</td>`).join("")}<td class="rh">${b.runs}</td><td class="rh">${b.hits}</td><td>${b.lob}</td></tr>`;
    }).join("") + `</tbody></table></div>`;

  const notes = (items) => items.filter((x) => x).map((x) => `<div class="note">${x}</div>`).join("");
  const listNote = (label, rows, key, seasonKey) => {
    const who = rows.filter((r) => r[key] > 0).map((r) => {
      const s = season(r.name);
      const count = r[key] > 1 ? `${r[key]}, ` : "";
      return `${nameLink(r.name)} (${count}${s ? s[seasonKey ?? key] : "?"})`;
    });
    return who.length ? `<b>${label}:</b> ${who.join(", ")}.` : "";
  };

  const side = (k) => {
    const b = box[k];
    const tot = (key) => b.batting.reduce((a, r) => a + r[key], 0);
    const bat = `<div class="tw"><table class="boxtable"><thead><tr><th class="t">${esc(b.team)}</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>AVG</th></tr></thead><tbody>` +
      b.batting.map((r) => {
        const s = season(r.name);
        return `<tr><td class="t">${nameLink(r.name)} <span class="muted">${esc(r.pos)}</span></td><td>${r.ab}</td><td>${r.r}</td><td>${r.h}</td><td>${r.rbi}</td><td>${r.bb}</td><td>${r.so}</td><td>${s ? rate(s.avg) : ""}</td></tr>`;
      }).join("") +
      `<tr class="total"><td class="t">Totals</td><td>${tot("ab")}</td><td>${tot("r")}</td><td>${tot("h")}</td><td>${tot("rbi")}</td><td>${tot("bb")}</td><td>${tot("so")}</td><td></td></tr></tbody></table></div>`;
    const batNotes = notes([
      listNote("2B", b.batting, "d"), listNote("3B", b.batting, "t"), listNote("HR", b.batting, "hr"),
      listNote("RBI", b.batting, "rbi"), listNote("IBB", b.batting, "ibb"), listNote("SB", b.batting, "sb"), listNote("CS", b.batting, "cs"),
      `<b>Team LOB:</b> ${b.lob}.`,
    ]);
    const decision = (r) => {
      if (!r.decision) return "";
      const s = season(r.name);
      if (!s) return ` (${r.decision})`;
      return r.decision === "S" ? ` (S, ${s.sv})` : ` (${r.decision}, ${s.w}-${s.l})`;
    };
    const pit = `<div class="tw"><table class="boxtable"><thead><tr><th class="t">${esc(b.team)}</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>SO</th><th>HR</th><th>ERA</th></tr></thead><tbody>` +
      b.pitching.map((r) => {
        const s = season(r.name);
        return `<tr><td class="t">${nameLink(r.name)}<span class="muted">${esc(decision(r))}</span></td><td>${ipFmt(r.outs)}</td><td>${r.h}</td><td>${r.r}</td><td>${r.r}</td><td>${r.bb}</td><td>${r.so}</td><td>${r.hr}</td><td>${s ? dec(2)(s.era) : ""}</td></tr>`;
      }).join("") + `</tbody></table></div>`;
    const wp = b.pitching.filter((r) => r.wp > 0).map((r) => `${nameLink(r.name)}${r.wp > 1 ? ` (${r.wp})` : ""}`);
    const hbp = b.pitching.flatMap((r) => r.hbp.map((batter) => `by ${nameLink(r.name)} (${nameLink(batter)})`));
    const ibb = b.pitching.filter((r) => r.ibb > 0).map((r) => `${nameLink(r.name)}${r.ibb > 1 ? ` (${r.ibb})` : ""}`);
    const pitNotes = notes([
      `<b>Pitches-strikes:</b> ${b.pitching.map((r) => `${nameLink(r.name)} ${r.pitches}-${r.strikes}`).join(", ")}.`,
      `<b>Batters faced:</b> ${b.pitching.map((r) => `${nameLink(r.name)} ${r.bf}`).join(", ")}.`,
      wp.length ? `<b>WP:</b> ${wp.join(", ")}.` : "",
      hbp.length ? `<b>HBP:</b> ${hbp.join(", ")}.` : "",
      ibb.length ? `<b>IBB:</b> ${ibb.join(", ")}.` : "",
    ]);
    return { bat: bat + batNotes, pit: pit + pitNotes };
  };
  const away = side("away"), home = side("home");
  const status = box.finished ? `Final${box.innings !== 9 ? ` (${box.innings})` : ""}` : "In progress";
  return `<div class="panel box boxscore">
      <h3>Box score &middot; Day ${box.day} &middot; ${status}</h3>
      ${lineScore}
      <h4>Batting</h4>
      <div class="boxgrid"><div>${away.bat}</div><div>${home.bat}</div></div>
      <h4>Pitching</h4>
      <div class="boxgrid"><div>${away.pit}</div><div>${home.pit}</div></div>
      <p class="muted" style="margin:10px 0 0">Season totals in parentheses. ER = R (errors aren't modeled yet, so every run is earned).</p>
    </div>`;
}

function viewBox(id) {
  const box = boxes[id];
  if (!box) {
    fetchBox(id);
    return `<p class="muted">Loading box score&hellip;</p>`;
  }
  return `<p><a href="#games">&larr; All games</a></p>` + renderBox(box);
}

async function fetchBox(id) {
  try {
    const { payload: out } = await request("GET", "/api/box", { game: id });
    if (out.ok) { boxes[id] = out.box; render(); }
    else { errorText = out.error; render(); }
  } catch (_) { errorText = "Can't reach the season engine."; render(); }
}

// One request to the engine: the local server, or the copy running in this page.
async function request(method, path, body = {}) {
  if (IN_BROWSER) {
    const out = JSON.parse(session.request(method, path, JSON.stringify(body)));
    if (method === "POST" && out.status === 200) saveSeason();
    return out;
  }
  const query = method === "GET" && Object.keys(body).length ? "?" + new URLSearchParams(body) : "";
  const res = await fetch(path + query, method === "GET" ? {} : { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return { status: res.status, payload: await res.json() };
}

function saveSeason() {
  try { localStorage.setItem(SAVE_KEY, session.save()); } catch (_) { /* storage blocked: the season just won't be kept */ }
}

const nextFrame = () => new Promise((r) => setTimeout(r, 0));

const STEP_LABEL = { pitch: "1 pitch", ab: "At-bat", half: "Half inning", inning: "Inning", game: "Rest of game" };

async function api(path, body) {
  busy = true; errorText = ""; render();
  await nextFrame(); // let the page show "busy" before the engine works
  try {
    if (IN_BROWSER && path === "/api/sim" && body.days > 1) return await simManyDays(body.days);
    const { status, payload: out } = await request(body === undefined ? "GET" : "POST", path, body ?? {});
    if (status !== 200 || out.ok === false) { errorText = out.error || `Request failed (${status})`; return null; }
    applyState(out);
    return out;
  } catch (e) {
    console.error(e);
    errorText = IN_BROWSER ? `The game engine hit an error: ${e.message || e}` : "Can't reach the season server. Is `uv run veeone-season` still running?";
    return null;
  } finally {
    busy = false; progressText = ""; render();
  }
}

// On a phone, sim a day at a time so the page stays responsive and shows progress.
let progressText = "";
async function simManyDays(days) {
  const stop = Math.min(SIM.days, SIM.day + days - 1);
  let out = null;
  while (!SIM.over && SIM.day <= stop) {
    progressText = `Simming day ${SIM.day} of ${stop}\u2026`;
    render();
    await nextFrame();
    out = (await request("POST", "/api/sim", { days: 1, quiet: true })).payload;
    if (out.ok === false) { errorText = out.error; break; }
    SIM = { ...SIM, day: out.day, over: out.over, today: out.today, live: out.live };
  }
  const { payload } = await request("GET", "/api/state");
  applyState(payload);
  return payload;
}

function applyState(out) {
  if (out.season) prepare(out.season);
  SIM = { day: out.day, days: out.days, over: out.over, today: out.today, live: out.live, seed: out.seed };
  updateSubtitle();
}

// ---------- player card ----------
const BAT_CAREER = [["g", "G"], ["pa", "PA"], ["ab", "AB"], ["r", "R"], ["h", "H"], ["d", "2B"], ["t", "3B"], ["hr", "HR"],
  ["rbi", "RBI"], ["bb", "BB"], ["ibb", "IBB"], ["so", "SO"], ["sb", "SB"], ["avg", "AVG", rate], ["obp", "OBP", rate], ["slg", "SLG", rate], ["ops", "OPS", rate], ["war", "WAR", dec(1)]];
const PIT_CAREER = [["g", "G"], ["gs", "GS"], ["w", "W"], ["l", "L"], ["sv", "SV"], ["cg", "CG"], ["sho", "SHO"], ["outs", "IP", ipFmt], ["h", "H"], ["r", "R"],
  ["bb", "BB"], ["ibb", "IBB"], ["so", "SO"], ["hr", "HR"], ["era", "ERA", dec(2)], ["whip", "WHIP", dec(2)], ["k9", "K/9", dec(1)], ["war", "WAR", dec(1)]];
const SUMMABLE = ["war", "g", "gs", "w", "l", "sv", "cg", "sho", "pa", "ab", "r", "h", "d", "t", "hr", "rbi", "bb", "ibb", "hbp", "so", "sb", "cs", "tb", "outs", "bf"];

// Awards this player has won, e.g. "MVP: Season 1, Season 3".
function awardsLine(p) {
  const seasons = [...D.history.map((h) => h.season), ...(D.awards ? [D.seasonNumber] : [])];
  const parts = [];
  for (const key of ["mvp", "cy"]) {
    for (const n of seasons) {
      for (const w of awardWinners(n)) {
        if (w.key === key && w.name === p.name) parts.push(awardBadge(key, n, w.league, `${AWARDS[key].label} \u00b7 Season ${n}`));
      }
    }
  }
  return parts.length ? `<div class="awards">${parts.join(" ")}</div>` : "";
}

// Every season this player has played, this one included, with a career total.
// A number is bold if it led the league that season.
function careerTable(p, isB, current) {
  const cols = isB ? BAT_CAREER : PIT_CAREER;
  const side = isB ? "bat" : "pit";
  const rows = [];
  D.history.forEach((h) => {
    const line = (isB ? h.batters : h.pitchers).find((x) => x.name === p.name);
    if (line) rows.push({ season: h.season, label: `Season ${h.season}`, team: line.team, age: line.age, line, best: (h.leadsBy[leagueOf(line)] || {})[side] });
  });
  if (current.g > 0) rows.push({ season: D.seasonNumber, label: `Season ${D.seasonNumber}`, team: p.team, age: p.age, line: current, best: leadOf(p, side), now: true });
  if (!rows.length) return `<div class="muted">${isB ? "No plate appearances yet." : "Hasn't pitched yet."}</div>`;

  const total = {};
  SUMMABLE.forEach((k) => (total[k] = rows.reduce((a, r) => a + (r.line[k] || 0), 0)));
  isB ? deriveBatter(total, 0) : derivePitcher(total, 0);

  const won = (season) => awardWinners(season).filter((w) => w.name === p.name)
    .map((w) => awardBadge(w.key, season, w.league)).join(" ");
  const head = `<tr><th class="t">Season</th><th class="t">Team</th><th>Age</th>${cols.map(([, label]) => `<th>${label}</th>`).join("")}<th class="t">Awards</th></tr>`;
  const body = rows.map((r) => `<tr><td class="t">${r.label}${r.now && !SIM.over ? ` <span class="tag">now</span>` : ""}</td><td class="t">${esc(r.team)}</td><td>${r.age}</td>${
    cols.map(([key, , fmt]) => `<td>${bold((fmt || int)(r.line[key]), leads(r.best, r.line, key))}</td>`).join("")}<td class="t">${won(r.season)}</td></tr>`).join("");
  const totals = rows.length > 1
    ? `<tr class="total"><td class="t">Career</td><td></td><td></td>${cols.map(([key, , fmt]) => `<td>${(fmt || int)(total[key])}</td>`).join("")}<td></td></tr>`
    : "";
  return `<div class="tw seasonline"><table><thead>${head}</thead><tbody>${body}${totals}</tbody></table></div>
    <p class="muted" style="margin:6px 0 0"><b class="lead">Bold</b> = led the league that season.</p>`;
}

function showPlayer(id) {
  const p = (id[0] === "b" ? D.batters : D.pitchers).find((x) => x.id === id);
  if (!p) return;
  const isB = id[0] === "b";
  const labels = isB ? { cnr: "CON vs R", cnl: "CON vs L", pow: "POW", eye: "EYE", fld: "FLD", spd: "SPD", stl: "STL" }
                     : { mov: "MOV", acc: "ACC", vel: "VEL", sta: "STA" };
  const bars = Object.entries(labels).map(([k, label]) => {
    const v = p.ratings[k];
    return `<span class="muted">${label}</span><span class="rbar"><i style="width:${((v - 20) / 60) * 100}%"></i></span><b class="${ratingClass(v)}" style="text-align:center;border-radius:4px">${v}</b>`;
  }).join("");

  const live = todayLine(p);
  let today = "";
  if (live) {
    const t = live.line;
    const L = SIM.live;
    const where = `${L.away.name} @ ${L.home.name}, ${L.finished ? L.status : L.status}`;
    if (isB) {
      const extras = [[t.hr, "HR"], [t.t, "3B"], [t.d, "2B"], [t.rbi, "RBI"], [t.r, "R"], [t.bb, "BB"], [t.hbp, "HBP"], [t.so, "K"], [t.sb, "SB"]]
        .filter(([n]) => n > 0).map(([n, l]) => (n > 1 ? `${n} ${l}` : l));
      today = t.pa ? `${t.h}-for-${t.ab}${extras.length ? ", " + extras.join(", ") : ""}` : "Hasn't batted yet";
    } else {
      today = `${ipFmt(t.outs)} IP, ${t.h} H, ${t.r} R, ${t.bb} BB, ${t.so} K, ${t.hr} HR &middot; ${t.pitches} pitches (${t.strikes} strikes)${t.decision ? ` &middot; ${t.decision}` : ""}`;
    }
    today = `<h4>Today &middot; ${esc(where)}</h4><div>${today}</div>`;
  }

  const s = seasonNow(p, live && live.line, live && live.recorded);
  const career = careerTable(p, isB, s);

  document.getElementById("player-body").innerHTML = `
    <button class="close" onclick="document.getElementById('player').close()" aria-label="Close">&times;</button>
    <h3>${esc(p.name)}</h3>
    <div class="muted">${isB ? p.pos : p.role} &middot; ${teamLink(p.team)} &middot; ${isB ? "Bats" : "Throws"} ${p.hand} &middot; ${p.age} &middot; ${esc(p.nat)}</div>
    ${awardsLine(p)}
    <h4>Ratings</h4><div class="rbars" style="margin-top:4px">${bars}</div>
    ${today}
    <h4>Career${live && !live.recorded ? " (this season includes today)" : ""}</h4>${career}`;
  document.getElementById("player").showModal();
}

// ---------- routing & events ----------
// The current view lives here; the URL hash mirrors it when the browser allows
// (bookmarks, back button), but the page doesn't depend on it.
let route = decodeURIComponent(location.hash.slice(1)) || (SERVER ? "home" : "standings");
function go(to) {
  route = to;
  try { history.pushState(null, "", "#" + encodeURIComponent(to).replace("%2F", "/")); } catch (_) { /* e.g. data: URLs */ }
  render();
  window.scrollTo(0, 0);
}
function render() {
  if (!D) return;
  let [view, arg] = route.split("/");
  if ((view === "simulate" || view === "home") && !SERVER) view = "standings";
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("on", a.dataset.view === view || (view === "team" && a.dataset.view === "teams") || (view === "box" && a.dataset.view === "games")));
  const views = { home: viewHome, simulate: viewSimulate, standings: viewStandings, teams: viewTeams, team: () => viewTeam(arg), batting: viewBatting, pitching: viewPitching, leaders: viewLeaders, games: viewGames, box: () => (SERVER ? viewBox(+arg) : viewGames()) };
  const searchHadFocus = document.activeElement && document.activeElement.id === "q";
  document.getElementById("app").innerHTML = (views[view] || viewStandings)();
  const q = document.getElementById("q");
  if (q && searchHadFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

document.addEventListener("click", async (e) => {
  const th = e.target.closest("th[data-key]");
  if (th && th.dataset.table) {
    const st = sorts[th.dataset.table];
    if (st.key === th.dataset.key) st.dir = -st.dir;
    else { st.key = th.dataset.key; st.dir = ["name", "team", "away", "home", "wp", "lp", "sv", "rank", "day", "posOrder", "roleOrder", "era", "whip", "bb9", "hr9", "oavg"].includes(st.key) ? 1 : -1; }
    render();
    return;
  }
  const act = e.target.closest("[data-act]");
  if (act && !act.disabled) {
    const kind = act.dataset.act;
    if (kind === "start") {
      const resuming = SIM.live && SIM.live.index === +act.dataset.index;
      if (!resuming) { lastHappened = []; lastStep = null; }
      ui.hideLive = false;
      await api("/api/start", { index: +act.dataset.index });
    }
    else if (kind === "adv") {
      const step = act.dataset.step;
      const out = await api("/api/advance", { step });
      if (out) {
        // For bigger steps, show the plays and skip pitch-by-pitch detail.
        lastHappened = step === "pitch" ? out.happened : out.happened.filter((x) => x.kind !== "pitch");
        lastStep = STEP_LABEL[step];
        render();
      }
    }
    else if (kind === "close") { lastHappened = []; lastStep = null; await api("/api/close", {}); }
    else if (kind === "back") { ui.hideLive = true; render(); }
    else if (kind === "togglebox") { ui.showBox = !ui.showBox; render(); }
    else if (kind === "sim") { lastHappened = []; ui.hideLive = false; await api("/api/sim", { days: +act.dataset.days }); }
    else if (kind === "nextseason") {
      lastHappened = []; Object.keys(boxes).forEach((k) => delete boxes[k]);
      await api("/api/next-season", {});
    }
    else if (kind === "playmine") {
      const index = +act.dataset.index;
      const resuming = SIM.live && SIM.live.index === index;
      if (!resuming) { lastHappened = []; lastStep = null; }
      ui.hideLive = false;
      go("simulate");
      await api("/api/start", { index });
    }
    else if (kind === "newgame") {
      // Two taps once there's something to lose: pop-up confirms aren't available everywhere.
      if (hasStarted() && !ui.confirmNew) { ui.confirmNew = true; render(); setTimeout(() => { ui.confirmNew = false; render(); }, 4000); return; }
      ui.confirmNew = false;
      const seed = String(ui.newSeed || "").trim();
      if (seed && !/^\d+$/.test(seed)) { errorText = "The seed has to be a whole number (or leave it blank)."; render(); return; }
      lastHappened = []; lastStep = null; ui.hideLive = false; Object.keys(boxes).forEach((k) => delete boxes[k]);
      const out = await api("/api/new-game", { games: ui.newGames, seed });
      if (out) { ui.newSeed = ""; go("simulate"); }
    }
    return;
  }
  const aw = e.target.closest("[data-award]");
  if (aw) { e.preventDefault(); showAward(aw.dataset.award, +aw.dataset.season, aw.dataset.league || ""); return; }
  const pl = e.target.closest("[data-player]");
  if (pl) { e.preventDefault(); showPlayer(pl.dataset.player); return; }
  const link = e.target.closest('a[href^="#"]');
  if (link) {
    e.preventDefault();
    document.getElementById("player").close();
    go(decodeURIComponent(link.getAttribute("href").slice(1)));
    return;
  }
  const card = e.target.closest("[data-team]");
  if (card) { go("team/" + card.dataset.team); return; }
  const nav = e.target.closest("#nav a");
  if (nav) { go(nav.dataset.view); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ngseed") { ui.newSeed = e.target.value; return; }
  if (e.target.id === "q") { ui.search = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "teamsel") ui.team = e.target.value;
  else if (id === "leaguesel") ui.league = e.target.value;
  else if (id === "qual") ui.qualified = e.target.checked;
  else if (id === "rat") ui.ratings = e.target.checked;
  else if (id === "rolesel") ui.role = e.target.value;
  else if (id === "gamesel") ui.gameTeam = e.target.value;
  else if (id === "nglen") { ui.newGames = +e.target.value; return; }
  else return;
  render();
});
document.getElementById("player").addEventListener("click", (e) => { if (e.target.id === "player") e.target.close(); });
window.addEventListener("popstate", () => { route = decodeURIComponent(location.hash.slice(1)) || (SERVER ? "home" : "standings"); render(); });

function updateSubtitle() {
  const parts = [`${D.teams.length} teams`];
  if (SERVER) parts.push(`season ${D.seasonNumber}`, SIM.over ? "complete" : `day ${SIM.day} of ${SIM.days}`);
  else parts.push(`${G} games each`, `${D.games.length} games played`);
  if (D.seed != null) parts.push(`seed ${D.seed}`);
  document.getElementById("subtitle").textContent = parts.join(" · ");
}

// ---------- in-browser engine (phone version) ----------
let engineModule = null;
function showLoading(title, detail, fraction) {
  document.getElementById("app").innerHTML = `<div class="loading panel box">
    <h3>${esc(title)}</h3><div class="barwrap"><i style="width:${Math.round((fraction || 0) * 100)}%"></i></div>
    <div class="muted">${esc(detail || "")}</div></div>`;
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = src; tag.onload = resolve; tag.onerror = () => reject(new Error("Couldn't load " + src));
    document.head.appendChild(tag);
  });
}
async function bootEngine() {
  const base = BUNDLE.pyodideBase || `https://cdn.jsdelivr.net/npm/pyodide@${BUNDLE.pyodide}/`;
  showLoading("Loading the game engine", "Downloading Python for the browser (first visit only takes a bit longer)\u2026", 0.1);
  await loadScript(base + "pyodide.js");
  const py = await loadPyodide({ indexURL: base });
  showLoading("Loading the game engine", "Setting up the league\u2026", 0.6);
  await nextFrame();
  for (const [path, source] of Object.entries(BUNDLE.files)) {
    const full = "/home/pyodide/" + path;
    py.FS.mkdirTree(full.slice(0, full.lastIndexOf("/")));
    py.FS.writeFile(full, source);
  }
  py.runPython("import sys; sys.path.insert(0, '/home/pyodide')");
  engineModule = py.pyimport("veeone.app");
  session = engineModule.BrowserSession();
  let saved = null;
  try { saved = localStorage.getItem(SAVE_KEY); } catch (_) {}
  if (saved) {
    const total = session.load(saved);
    let left = total;
    while (left > 0) {
      showLoading("Restoring your season", `Replaying your games (day ${session.day()})\u2026`, 1 - left / Math.max(1, total));
      await nextFrame();
      left = session.replay(20);
    }
  }
}

if (SERVER) {
  document.getElementById("nav-sim").classList.remove("hidden");
  document.getElementById("nav-home").classList.remove("hidden");
  if (IN_BROWSER) {
    bootEngine().then(() => api("/api/state")).catch((e) => {
      console.error(e);
      document.getElementById("app").innerHTML = `<p class="error">Couldn't start the game engine: ${esc(e.message || e)}</p>`;
    });
  } else {
    api("/api/state");
  }
} else {
  prepare(EMBEDDED);
  updateSubtitle();
  render();
}
</script>
</body>
</html>
