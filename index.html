<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veeOne Season</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f1f3f6;
    --text: #1b1f24;
    --muted: #667085;
    --line: #e3e6eb;
    --accent: #2f6fde;
    --accent-soft: #e8f0fd;
    --mine: #fff6d6;
    --mine-line: #e9c24a;
    --trophy: #d9a520;
    --trophy-dark: #9c7414;
    --good: #1e8a4c;
    --bad: #c2412d;
    --r1: #f9d6d0; --r2: #fcebd8; --r3: transparent; --r4: #dcefe2; --r5: #bfe3cb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    color-scheme: light; /* the app always uses its light theme */
  }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  }
  .bar { max-width: 1280px; margin: 0 auto; padding: 14px 16px 0; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  nav a {
    padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted);
    white-space: nowrap; font-weight: 500;
  }
  nav a:hover { color: var(--text); text-decoration: none; }
  nav a.on { color: var(--accent); border-bottom-color: var(--accent); }
  nav a.hidden { display: none; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 48px; }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .card { padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .s { color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  input[type=search], select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  input[type=search] { min-width: 220px; }
  button {
    font: inherit; font-weight: 550; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .count { color: var(--muted); margin-left: auto; font-size: 12px; }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th {
    position: sticky; top: 0; background: var(--panel-2); font-weight: 600; font-size: 12px;
    color: var(--muted); text-align: right; cursor: pointer; user-select: none;
  }
  th.t, td.t { text-align: left; }
  td { text-align: right; }
  th:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  th.sorted::after { content: " \25BC"; font-size: 9px; }
  th.sorted.asc::after { content: " \25B2"; }
  tbody tr:hover td { background: var(--accent-soft); }
  tr.mine td { background: var(--mine); }
  tr.total td { font-weight: 650; background: var(--panel-2); }
  td.rt { text-align: center; padding: 6px 4px; }
  .r1 { background: var(--r1); } .r2 { background: var(--r2); } .r4 { background: var(--r4); } .r5 { background: var(--r5); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .tag {
    display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px;
    background: var(--panel-2); color: var(--muted); margin-left: 4px;
  }
  .tag.mine { background: var(--mine-line); color: #1b1f24; }
  .hero { padding: 20px 22px; margin-bottom: 14px; }
  .herotop { display: flex; align-items: center; gap: 14px; }
  .herotitle { font-size: 28px; font-weight: 800; line-height: 1.15; }
  .heroacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  a.btn { display: inline-block; padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  a.btn:hover { text-decoration: none; border-color: var(--accent); color: var(--accent); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .homegrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); margin-bottom: 14px; }
  .hcard { padding: 14px 16px; }
  .hcard h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .hcard .big { font-size: 20px; font-weight: 700; }
  .hcard .score { font-size: 17px; font-weight: 650; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 12px; padding: 2px 7px; border-radius: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.w { background: #e3f4e8; color: #1c6b38; }
  .chip.l { background: #fbe6e6; color: #9b2c2c; }
  table.mini td, table.mini th { padding: 3px 6px; }
  ol.stars { list-style: none; margin: 0; padding: 0; }
  ol.stars li { display: flex; gap: 8px; padding: 4px 0; align-items: baseline; }
  ol.stars .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.stars .val { font-variant-numeric: tabular-nums; }
  .newgame { margin-bottom: 14px; }
  .ngrow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 6px 0 10px; }
  .ngrow label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  .ngrow input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button.danger { background: #b42318; border-color: #b42318; color: #fff; }
  .small { font-size: 12px; }
  .tag.inter { background: #e4e9f7; color: #1f3d8a; }
  .gamecard .series { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .leaders { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .leaders .panel h3 { margin: 0; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .leaders ol { list-style: none; margin: 0; padding: 4px 0; }
  .leaders li { display: flex; gap: 8px; padding: 4px 12px; align-items: baseline; }
  .leaders li .n { color: var(--muted); width: 18px; text-align: right; }
  .leaders li .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leaders li .tm { color: var(--muted); font-size: 12px; }
  .leaders li .val { font-variant-numeric: tabular-nums; }
  b.lead { font-weight: 700; }
  .crest { vertical-align: -4px; margin-right: 6px; flex: none; }
  .teamcard .nm { display: flex; align-items: center; gap: 4px; }
  .teamcard .nm .crest { margin-right: 6px; vertical-align: middle; }
  .teamhead .crest { vertical-align: middle; margin-right: 0; }
  .teamhead { align-items: center; }
  .leaguehead { font-size: 20px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
  .leaguehead:first-child { margin-top: 0; }
  .subhead { font-size: 14px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .awards { margin-top: 10px; font-weight: 600; }
  .award { display: inline-block; padding: 1px 8px; border-radius: 4px; background: var(--mine); border: 1px solid var(--mine-line); font-size: 12px; letter-spacing: .04em; margin-right: 4px; color: var(--text); white-space: nowrap; }
  a.award { cursor: pointer; }
  a.award:hover { text-decoration: none; border-color: var(--accent); color: var(--accent); }
  .mvp { padding: 22px 24px; margin: 16px 0; }
  .mvphead { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .trophy { width: 64px; height: 64px; flex: none; }
  .mvptitle { font-size: 30px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .mvp .who { font-size: 26px; font-weight: 700; margin: 4px 0; }
  .mvpstats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
  .mvpstat { background: var(--panel-2); border-radius: 8px; padding: 8px 14px; min-width: 72px; }
  .mvpstat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .mvpstat .v { font-size: 22px; font-variant-numeric: tabular-nums; }
  .mvpvoting { margin: 18px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .mvpline { white-space: nowrap; }

  .leaders .empty { padding: 10px 12px; color: var(--muted); }
  .teamhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .teamhead h2 { margin: 0; font-size: 22px; }
  .teamgrid { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 980px) { .teamgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .teamcard { padding: 14px; cursor: pointer; }
  .teamcard:hover { border-color: var(--accent); }
  .teamcard.mine, .gamecard.mine { border-color: var(--mine-line); background: var(--mine); }
  .teamcard .nm { font-weight: 650; font-size: 16px; }
  .teamcard .rec { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .teamcard .ln { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .diffbar { display: inline-block; height: 8px; border-radius: 4px; vertical-align: middle; }
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(1040px, 96vw);
    max-height: 92vh; overflow-y: auto;
    background: var(--panel); color: var(--text); font-size: 15px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg { padding: 24px 28px; }
  .dlg h3 { margin: 0 0 6px; font-size: 26px; }
  .dlg h4 { font-size: 13px !important; margin-top: 20px !important; }
  .dlg .seasonline table td, .dlg .seasonline table th { padding: 6px 9px; }
  .dlg .rbar { height: 14px; border-radius: 7px; }
  @media (max-width: 560px) { .dlg { padding: 18px 16px; } .dlg h3 { font-size: 22px; } }
  .rbars { display: grid; grid-template-columns: 80px 1fr 40px; gap: 8px 12px; align-items: center; margin: 14px 0; }
  .rbar { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
  .rbar i { display: block; height: 100%; background: var(--accent); }
  .close { float: right; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .muted { color: var(--muted); }
  .error { color: var(--bad); margin: 8px 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }

  /* --- Simulate tab --- */
  .simhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .simhead h2 { margin: 0 12px 0 0; font-size: 20px; }
  .games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .gamecard { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .gamecard .teams { font-weight: 650; font-size: 15px; }
  .gamecard .sp { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .gamecard .score { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gamecard .actions { margin-top: auto; }
  .live { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 900px) { .live { grid-template-columns: minmax(0, 1fr); } }
  .live > div, .boxgrid > div, .matchup > div { min-width: 0; }
  .box { padding: 14px; }
  .box h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .linescore td, .linescore th { padding: 5px 7px; text-align: center; cursor: default; }
  .linescore th.t, .linescore td.t { text-align: left; }
  .linescore .rh { font-weight: 700; }
  .situation { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin: 14px 0 4px; }
  .inningbig { font-size: 20px; font-weight: 700; }
  .diamond { position: relative; width: 74px; height: 74px; }
  .diamond i {
    position: absolute; width: 22px; height: 22px; transform: rotate(45deg);
    border: 2px solid var(--muted); background: var(--panel); border-radius: 3px;
  }
  .diamond i.on { background: var(--accent); border-color: var(--accent); }
  .diamond .b2 { left: 26px; top: 4px; } .diamond .b3 { left: 4px; top: 26px; } .diamond .b1 { left: 48px; top: 26px; }
  .dots { display: flex; gap: 4px; align-items: center; }
  .dots b { font-size: 12px; color: var(--muted); width: 14px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; }
  .dots i.on { background: var(--text); border-color: var(--text); }
  .dots.balls i.on { background: var(--good); border-color: var(--good); }
  .dots.strikes i.on, .dots.outs i.on { background: var(--bad); border-color: var(--bad); }
  .runners { font-size: 12px; color: var(--muted); }
  .matchup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  .matchup .who { font-weight: 650; font-size: 15px; }
  .matchup .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .advance { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow-y: auto; }
  .feed li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .feed li.pitch { color: var(--muted); font-size: 13px; padding: 3px 0 3px 14px; }
  .feed li.inning { font-weight: 650; color: var(--accent); border-bottom: 0; padding-top: 12px; }
  .feed li.big { font-weight: 650; }
  .happened { list-style: none; margin: 0; padding: 0; }
  .happened li { padding: 5px 0; }
  .happened li.pitch { color: var(--muted); }
  .happened li.play { font-weight: 600; font-size: 15px; }
  .final { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .loading { max-width: 420px; margin: 60px auto; text-align: center; }
  .loading .barwrap { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; margin: 14px 0 8px; }
  .loading .barwrap i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .boxscore { margin-top: 14px; }
  .boxscore h4 { margin: 16px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .boxgrid { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .boxgrid { grid-template-columns: minmax(0, 1fr); } }
  /* Phones */
  @media (max-width: 560px) {
    main { padding: 14px 12px 40px; }
    .bar { padding: 12px 12px 0; }
    .box { padding: 12px; }
    .matchup { grid-template-columns: minmax(0, 1fr); }
    .situation { gap: 14px; }
    .simhead h2 { width: 100%; }
    .advance button { padding: 7px 10px; }
    input[type=search] { min-width: 0; width: 100%; }
    .games, .teamgrid, .leaders, .cards { grid-template-columns: minmax(0, 1fr); }
  }
  .boxtable th { cursor: default; position: static; }
  .boxtable td, .boxtable th { padding: 4px 6px; }
  .note { font-size: 13px; margin-top: 5px; line-height: 1.5; }
  .seasonline { margin-top: 10px; }
  .seasonline table td, .seasonline table th { padding: 4px 6px; cursor: default; position: static; }
  .dlg h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">
      <h1>veeOne Season</h1>
      <span class="sub" id="subtitle"></span>
    </div>
    <nav id="nav">
      <a data-view="home" class="hidden" id="nav-home">Home</a>
      <a data-view="simulate" class="hidden" id="nav-sim">Simulate</a>
      <a data-view="standings">Standings</a>
      <a data-view="teams">Teams</a>
      <a data-view="batting">Batting</a>
      <a data-view="pitching">Pitching</a>
      <a data-view="leaders">Leaders</a>
      <a data-view="games">Games</a>
    </nav>
  </div>
</header>
<main id="app"><p class="muted">Loading&hellip;</p></main>
<dialog id="player"><div class="dlg" id="player-body"></div></dialog>
<footer>Ratings use the 20&ndash;80 scouting scale (50 = average). Click any column to sort.</footer>

<script id="season-data" type="application/json">null</script>
<script id="engine-bundle" type="application/json">{"pyodide":"0.26.4","pyodideBase":"https://cdn.jsdelivr.net/npm/pyodide@0.26.4/","files":{"veeone/__init__.py":"\"\"\"veeone package.\"\"\"\n\nfrom __future__ import annotations\n\nimport random\n\nfrom veeone.team import LEAGUES, Team, create_leagues\n\n__version__ = \"0.1.0\"\n\n# The teams created on start: two leagues of 8 (see team.LEAGUES), the Diamond\n# League and the Platinum League. The player's team is always in the Diamond League.\n# Each team is a full 23-man roster: SP1-SP5, RP1-RP8, a closer, 8 fielders and a DH.\nPLAYER_TEAM_NAME = \"Player1's Team\"\nSTARTING_TEAM_COUNT = sum(len(names) for names in LEAGUES.values())\n\n\ndef create_starting_teams(rng: random.Random | None = None) -> list[Team]:\n    \"\"\"Every team in both leagues, with random players. Nobody shares a name.\"\"\"\n    return create_leagues(rng)\n\n\ndef main() -> None:\n    \"\"\"Entry point for the `veeone` command.\"\"\"\n    for team in create_starting_teams():\n        print(team)\n        print(f\"\\nDefense (average fld of fielders): {team.defense:.1f}\\n\")\n        print(team.field_diagram())\n        print(\"\\n\" + \"=\" * 60 + \"\\n\")\n","veeone/app.py":"\"\"\"The season being played from the web page, independent of how the page reaches it.\n\n`SeasonApp.handle(method, path, body)` answers the page's requests. The local\nserver (`veeone.server`) calls it over HTTP; the phone version runs this same\ncode inside the browser (see `BrowserSession` and `veeone.bundle`).\n\nRequests:\n    GET  /api/state              - the season so far, today's games, the live game\n    GET  /api/box   {game}       - the box score of finished game N (its place in the game log)\n    POST /api/start {index}      - start (or resume) today's game `index`: the player's\n                                   own game (the others sim once it ends)\n    POST /api/advance {step}     - advance the live game: pitch | ab | half | inning | game\n    POST /api/close              - leave the live game view (a finished game only)\n    POST /api/sim   {days}       - play the rest of today (finishing the live game), or more days\n    POST /api/next-season        - after the last day: archive this season and start the next\n    POST /api/new-game {seed, games} - throw everything away and start a new league\n                                   (random seed if none; games per team, default 162)\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport random\nfrom typing import Any\n\nfrom veeone.awards import season_awards\nfrom veeone.boxscore import box_score\nfrom veeone.league import LeagueRun, TeamGame\nfrom veeone.live import LiveGame, Step\nfrom veeone.season import GAMES_PER_SEASON\nfrom veeone.web import season_data\n\nMIN_GAMES = 10  # shortest season a new game can have\n\n\nclass SeasonApp:\n    \"\"\"The season being played, plus at most one game followed live.\"\"\"\n\n    def __init__(self, run: LeagueRun, *, player_team: str | None = None, seed: int | None = None):\n        self.run = run\n        self.player_team = player_team\n        self.seed = seed\n        self.live: LiveGame | None = None\n        self.live_index: int | None = None\n        self.live_recorded = False\n        # When the player's game ends, the rest of that day's games are simmed.\n        self.auto_simmed: dict[str, int] | None = None  # {\"day\", \"games\"} after an auto-sim\n        self.season_number = 1\n        # Finished seasons, oldest first: standings and every player's line (see archive_season).\n        self.history: list[dict[str, Any]] = []\n        self._awards: tuple[int, dict[str, Any]] | None = None  # (season, awards) cache\n\n    # --- requests ---\n\n    def handle(\n        self, method: str, path: str, body: dict[str, Any] | None = None\n    ) -> tuple[int, dict[str, Any]]:\n        \"\"\"Answer one request from the page: (HTTP-style status, JSON payload).\"\"\"\n        body = body or {}\n        try:\n            if method == \"GET\":\n                match path:\n                    case \"/api/state\":\n                        return 200, self.state()\n                    case \"/api/box\":\n                        return 200, {\"ok\": True, \"box\": self.box(int(body[\"game\"]))}\n                return 404, {\"ok\": False, \"error\": f\"Unknown request {path}\"}\n\n            happened: list[dict[str, Any]] = []\n            changed = True\n            match path:\n                case \"/api/start\":\n                    self.start(int(body[\"index\"]))\n                    changed = False\n                case \"/api/advance\":\n                    happened, changed = self.advance(str(body.get(\"step\", \"pitch\")))\n                case \"/api/close\":\n                    self.close()\n                    changed = False\n                case \"/api/sim\":\n                    self.sim(int(body.get(\"days\", 1)))\n                    changed = not body.get(\n                        \"quiet\"\n                    )  # quiet: skip the season stats (day-by-day sims)\n                case \"/api/next-season\":\n                    self.next_season()\n                case \"/api/new-game\":\n                    seed = body.get(\"seed\")\n                    self.new_game(\n                        int(seed) if seed not in (None, \"\") else None,\n                        int(body.get(\"games\") or GAMES_PER_SEASON),\n                    )\n                case _:\n                    return 404, {\"ok\": False, \"error\": f\"Unknown request {path}\"}\n            return 200, {\"ok\": True, \"happened\": happened} | self.state(include_season=changed)\n        except (ValueError, KeyError) as error:\n            return 400, {\"ok\": False, \"error\": str(error)}\n\n    # --- reading ---\n\n    def new_game(self, seed: int | None = None, games: int = GAMES_PER_SEASON) -> None:\n        \"\"\"Start over: a brand-new league, season 1, nothing played or archived.\"\"\"\n        if not MIN_GAMES <= games <= GAMES_PER_SEASON:\n            raise ValueError(f\"A season is {MIN_GAMES} to {GAMES_PER_SEASON} games\")\n        self.__dict__.update(new_app(seed, games).__dict__)\n\n    def state(self, *, include_season: bool = True) -> dict[str, Any]:\n        run = self.run\n        out: dict[str, Any] = {\n            \"day\": run.day,\n            \"days\": len(run.schedule),\n            \"over\": run.over,\n            \"today\": self.today(),\n            \"live\": self.live_state(),\n            \"seed\": self.seed,\n        }\n        if include_season:\n            data = season_data(run.season, seed=self.seed)\n            data[\"scheduledGames\"] = len(run.schedule)\n            data[\"playerTeam\"] = self.player_team\n            data[\"seasonNumber\"] = self.season_number\n            data[\"history\"] = self.history\n            data[\"awards\"] = self.awards(data) if run.over else None\n            out[\"season\"] = data\n        return out\n\n    def today(self) -> list[dict[str, Any]]:\n        run = self.run\n        games = []\n        series = run.series[run.day - 1] if run.today else []\n        for index, (home, away) in enumerate(run.today):\n            entry: dict[str, Any] = {\n                \"index\": index,\n                \"home\": home.name,\n                \"away\": away.name,\n                \"league\": home.league,\n                \"mine\": self.player_team in (home.name, away.name),\n            }\n            if index < len(series):\n                info = series[index]\n                entry |= {\n                    \"seriesGame\": info.game,\n                    \"seriesLength\": info.length,\n                    \"interleague\": info.interleague,\n                }\n            done = run.results.get(index)\n            is_live = self.live is not None and self.live_index == index and not self.live_recorded\n            if done is not None:\n                entry |= {\"status\": \"final\", \"hr\": done.home_runs, \"ar\": done.away_runs}\n                entry[\"gameId\"] = self.game_id(done)\n                entry[\"innings\"] = done.innings\n            elif is_live:\n                assert self.live is not None\n                g = self.live.game\n                entry |= {\"status\": \"live\", \"hr\": g.home_runs, \"ar\": g.away_runs}\n                entry[\"inning\"] = self.live.status()\n            else:\n                entry[\"status\"] = \"pending\"\n                for side, team in ((\"homeSP\", home), (\"awaySP\", away)):\n                    games_played = run.season.record_for(team).games\n                    starter = team.starter_for_game(games_played + 1)\n                    entry[side] = f\"{starter.full_name} ({team.role(starter)})\"\n            games.append(entry)\n        return games\n\n    def live_state(self) -> dict[str, Any] | None:\n        if self.live is None:\n            return None\n        return self.live.snapshot() | {\n            \"index\": self.live_index,\n            \"box\": box_score(self.live.game),\n            # True once the game is counted in the season stats.\n            \"recorded\": self.live_recorded,\n            # Set when the rest of this game's day was simmed after it ended.\n            \"autoSimmed\": self.auto_simmed,\n        }\n\n    def game_id(self, game: TeamGame) -> int | None:\n        \"\"\"A finished game's place in the season's game log.\"\"\"\n        for i, g in enumerate(self.run.season.games):\n            if g is game:\n                return i\n        return None\n\n    def box(self, game_id: int) -> dict[str, Any]:\n        games = self.run.season.games\n        if not 0 <= game_id < len(games):\n            raise ValueError(f\"No finished game {game_id}.\")\n        return box_score(games[game_id]) | {\"recorded\": True, \"gameId\": game_id}\n\n    # --- actions ---\n\n    def start(self, index: int) -> None:\n        if self.live is not None and not self.live.finished:\n            if self.live_index == index:\n                return  # resume\n            raise ValueError(\"Finish (or sim) the game in progress first.\")\n        if self.player_team is not None:\n            home, away = self.run.today[index] if 0 <= index < len(self.run.today) else (None, None)\n            if home is None:\n                raise ValueError(f\"There's no game {index} today.\")\n            if self.player_team not in (home.name, away.name):\n                raise ValueError(\n                    \"You can only play your own team's game; the others sim when it ends.\"\n                )\n        game, steps = self.run.start_game(index)\n        self.live = LiveGame(game, steps, seed=self.run.rng.randrange(1 << 30))\n        self.live_index = index\n        self.live_recorded = False\n        self.auto_simmed = None\n\n    def advance(self, step: str) -> tuple[list[dict[str, Any]], bool]:\n        \"\"\"Returns what happened and whether the season changed (a game finished).\"\"\"\n        if self.live is None:\n            raise ValueError(\"No game in progress.\")\n        happened = self.live.advance(Step(step))\n        return happened, self._record_if_done()\n\n    def _record_if_done(self) -> bool:\n        if self.live is not None and self.live.finished and not self.live_recorded:\n            assert self.live_index is not None\n            game = self.live.game\n            day = self.run.day\n            self.run.finish_game(self.live_index, game)\n            self.live_recorded = True\n            mine = self.player_team in (game.home.name, game.away.name)\n            if mine and self.run.day == day:\n                others = len(self.run.pending())\n                self.run.sim_day()\n                self.auto_simmed = {\"day\": day, \"games\": others}\n            return True\n        return False\n\n    def close(self) -> None:\n        if self.live is not None and not self.live.finished:\n            raise ValueError(\"The game is still going. Advance or sim it first.\")\n        self.live = None\n        self.live_index = None\n\n    def awards(self, data: dict[str, Any] | None = None) -> dict[str, Any]:\n        \"\"\"This (finished) season's awards. Worked out once, then remembered.\"\"\"\n        if self._awards is not None and self._awards[0] == self.season_number:\n            return self._awards[1]\n        data = data or season_data(self.run.season)\n        result = season_awards(data, f\"{self.seed}-{self.season_number}\")\n        self._awards = (self.season_number, result)\n        return result\n\n    def next_season(self) -> None:\n        \"\"\"Archive the finished season, age everyone a year, and start a new one\n        with the same teams (same rosters, a fresh schedule, stats back at zero).\"\"\"\n        if not self.run.over:\n            raise ValueError(\"The season isn't over yet.\")\n        self.history.append(archive_season(self.run, self.season_number, self.awards()))\n        for team in self.run.teams:\n            for player in team.members:\n                player.age += 1\n        games = len(self.run.schedule)\n        self.run = LeagueRun(self.run.teams, games, self.run.rng)\n        self.season_number += 1\n        self.live = None\n        self.live_index = None\n        self.live_recorded = False\n        self.auto_simmed = None\n\n    def sim(self, days: int = 1) -> None:\n        \"\"\"Finish the live game (if any), then play the rest of today and `days - 1` more.\"\"\"\n        last_day = self.run.day + max(1, days) - 1\n        if self.live is not None and not self.live.finished:\n            self.live.advance(Step.GAME)\n            self._record_if_done()\n        while not self.run.over and self.run.day <= last_day:\n            self.run.sim_day()\n\n\n# Fields kept for each player in a finished season (stats only; ratings stay current).\n_ARCHIVED_BATTER = (\n    \"name\", \"team\", \"league\", \"pos\", \"age\", \"g\", \"pa\", \"ab\", \"r\", \"h\", \"d\", \"t\", \"hr\",\n    \"rbi\", \"bb\", \"ibb\", \"hbp\", \"so\", \"sb\", \"cs\", \"tb\", \"war\",\n)  # fmt: skip\n_ARCHIVED_PITCHER = (\n    \"name\", \"team\", \"league\", \"role\", \"age\", \"g\", \"gs\", \"w\", \"l\", \"sv\", \"outs\", \"bf\",\n    \"h\", \"r\", \"hr\", \"bb\", \"ibb\", \"hbp\", \"so\", \"cg\", \"sho\", \"war\",\n)  # fmt: skip\n\n\ndef archive_season(\n    run: LeagueRun, number: int, awards: dict[str, Any] | None = None\n) -> dict[str, Any]:\n    \"\"\"A finished season's record: standings, awards, and every player's season line.\"\"\"\n    data = season_data(run.season)\n    leagues = data[\"leagues\"]\n    standings = sorted(\n        data[\"teams\"],\n        key=lambda t: (\n            leagues.index(t[\"league\"]),\n            -t[\"w\"] / max(1, t[\"w\"] + t[\"l\"]),\n            -(t[\"rs\"] - t[\"ra\"]),\n        ),\n    )\n    champions: dict[str, str] = {}\n    for t in standings:  # each league's first team won it\n        champions.setdefault(t[\"league\"], t[\"name\"])\n    return {\n        \"season\": number,\n        \"gamesPerTeam\": data[\"gamesPerTeam\"],\n        \"leagues\": leagues,\n        \"champions\": champions,\n        \"awards\": awards or {},\n        \"standings\": [\n            {k: t[k] for k in (\"name\", \"league\", \"w\", \"l\", \"rs\", \"ra\")} for t in standings\n        ],\n        \"batters\": [{k: b[k] for k in _ARCHIVED_BATTER} for b in data[\"batters\"]],\n        \"pitchers\": [{k: p[k] for k in _ARCHIVED_PITCHER} for p in data[\"pitchers\"]],\n    }\n\n\ndef new_app(seed: int | None = None, games: int = GAMES_PER_SEASON) -> SeasonApp:\n    \"\"\"A fresh league (Diamond and Platinum, 8 teams each) with nothing played.\"\"\"\n    from veeone import PLAYER_TEAM_NAME, create_starting_teams\n\n    seed = seed if seed is not None else random.randrange(1_000_000)\n    rng = random.Random(seed)\n    run = LeagueRun(create_starting_teams(rng), games, rng)\n    return SeasonApp(run, player_team=PLAYER_TEAM_NAME, seed=seed)\n\n\nclass BrowserSession:\n    \"\"\"The season when the page runs the engine itself (the phone version).\n\n    The whole season follows from its seed and the actions taken, so saving is\n    just {seed, actions}; loading rebuilds the league from the seed and replays\n    the actions (`load` then `replay` in chunks, so the page can show progress).\n    \"\"\"\n\n    def __init__(self, seed: int | None = None, games: int = GAMES_PER_SEASON):\n        self.games = games\n        self.app = new_app(seed, games)\n        self.actions: list[list[Any]] = []  # [path, body] for each successful change\n        self._to_replay: list[list[Any]] = []\n\n    def request(self, method: str, path: str, body_json: str = \"{}\") -> str:\n        \"\"\"Answer the page (JSON in, JSON out) and remember actions for saving.\"\"\"\n        body = json.loads(body_json or \"{}\")\n        status, payload = self.app.handle(method, path, body)\n        if method == \"POST\" and status == 200:\n            if path == \"/api/new-game\":\n                self.actions = []  # the new league follows from its seed alone\n                self.games = len(self.app.run.schedule)\n            else:\n                self.actions.append([path, body])\n        return json.dumps({\"status\": status, \"payload\": payload}, ensure_ascii=False)\n\n    def save(self) -> str:\n        return json.dumps(\n            {\"version\": 1, \"seed\": self.app.seed, \"games\": self.games, \"actions\": self.actions}\n        )\n\n    def load(self, saved_json: str) -> int:\n        \"\"\"Start rebuilding a saved season. Returns how many actions need replaying.\"\"\"\n        saved = json.loads(saved_json)\n        self.games = int(saved.get(\"games\") or self.games)\n        self.app = new_app(int(saved[\"seed\"]), self.games)\n        self.actions = []\n        self._to_replay = list(saved.get(\"actions\", []))\n        return len(self._to_replay)\n\n    def replay(self, count: int = 25) -> int:\n        \"\"\"Replay up to `count` saved actions. Returns how many are left.\"\"\"\n        for _ in range(min(count, len(self._to_replay))):\n            path, body = self._to_replay.pop(0)\n            status, _ = self.app.handle(\"POST\", path, body)\n            if status == 200:\n                self.actions.append([path, body])\n        return len(self._to_replay)\n\n    def day(self) -> int:\n        return self.app.run.day\n","veeone/atbat.py":"\"\"\"The hitting/pitching logic: one plate appearance, pitch by pitch.\n\nEach pitch is three steps:\n    1. Location   - in the zone, out of the zone, wild, or hits the batter.\n                    acc -> more pitches in the zone, fewer wild pitches and HBPs.\n    2. Swing      - in the zone: vel freezes hitters, so more called strikes.\n                    out of the zone: eye -> fewer chases.\n    3. Result     - on a swing: con (attack) vs vel (defense) -> contact or whiff.\n                    Contact is a foul or in play, so con lets hitters foul off\n                    tough pitches instead of whiffing (and striking out).\n                    In play: see `veeone.battedball` for type, direction,\n                    fielder, and hit or out.\n    sta -> not used yet.\n\n\"con\" is the hitter's con_r or con_l, depending on the pitcher's throwing hand.\nSwitch hitters bat from the side opposite the pitcher's throwing hand.\n\nRating effects use the log-odds method in `veeone.odds`.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom collections.abc import Generator, Sequence\nfrom dataclasses import dataclass, field\nfrom enum import StrEnum\n\nfrom veeone.battedball import BattedBall, Defense, put_in_play\nfrom veeone.odds import adjust, chance, pick, rating_gap\nfrom veeone.outcomes import HITS, Outcome\nfrom veeone.person import (\n    RATING_MEAN,\n    Handedness,\n    Person,\n    PitcherRatings,\n    PlayerClass,\n    PositionRatings,\n)\n\n# Re-exported so existing imports from veeone.atbat keep working.\n__all__ = [\n    \"HITS\",\n    \"Outcome\",\n    \"adjust\",\n    \"chance\",\n    \"rating_gap\",\n]\n\n\nclass Location(StrEnum):\n    ZONE = \"zone\"\n    OUT_OF_ZONE = \"out of zone\"\n    WILD = \"wild\"  # a ball that gets away; counts as a ball\n    HIT_BATTER = \"hit batter\"\n\n\nclass Pitch(StrEnum):\n    \"\"\"What happened on one pitch.\"\"\"\n\n    BALL = \"ball\"\n    WILD_PITCH = \"wild pitch\"  # counts as a ball\n    CALLED_STRIKE = \"called strike\"\n    WHIFF = \"whiff\"\n    FOUL = \"foul\"\n    IN_PLAY = \"in play\"\n    HIT_BY_PITCH = \"hit by pitch\"\n\n\nBALLS = (Pitch.BALL, Pitch.WILD_PITCH)\nSTRIKES = (Pitch.CALLED_STRIKE, Pitch.WHIFF)\n\n# ---------------------------------------------------------------------------\n# Tuning knobs. Base rates are for average (50) ratings / matchups.\n# Effects are log-odds shifts per 10 rating points (1 SD). Negative = lowers it.\n# ---------------------------------------------------------------------------\n\n# 1. Location. acc pushes toward the zone and away from wild pitches and HBPs.\nLOCATION_BASE: dict[Location, float] = {\n    Location.ZONE: 0.51,\n    Location.OUT_OF_ZONE: 0.484,\n    Location.WILD: 0.003,\n    Location.HIT_BATTER: 0.003,\n}\nLOCATION_ACC_EFFECT: dict[Location, float] = {\n    Location.ZONE: 0.15,\n    Location.WILD: -0.40,\n    Location.HIT_BATTER: -0.30,\n}\n\n# 2. Swing decision.\nZONE_SWING_BASE = 0.69\nZONE_SWING_VEL_EFFECT = -0.10  # vel freezes hitters -> more called strikes\nCHASE_BASE = 0.29\nCHASE_EYE_EFFECT = -0.35  # eye -> fewer chases\n\n# 3. Swing result. con vs vel decides contact or whiff.\nZONE_CONTACT_BASE = 0.87\nCHASE_CONTACT_BASE = 0.62\nCONTACT_CON_VS_VEL_EFFECT = 0.20\n# Elite stuff: above ELITE_VEL_START, vel adds extra whiffs that grow with the\n# square of the excess, so 80s are much nastier than 70s (aiming ~220 K at 70,\n# ~290 K at 80 over a full season).\nELITE_VEL_START = 65\nELITE_VEL_WHIFF_EFFECT = 0.11\n# Share of contact that is put in play (the rest are fouls).\nZONE_IN_PLAY_BASE = 0.47\nCHASE_IN_PLAY_BASE = 0.38\n\n# Count effects (log-odds shifts, not per rating point).\nTHREE_BALL_ZONE_SHIFT = 0.25  # pitcher behind 3 balls aims for the zone\nTWO_STRIKE_ZONE_SWING_SHIFT = 1.20  # hitter with 2 strikes protects the plate...\nTWO_STRIKE_CHASE_SHIFT = 0.30  # ...and chases a little more\nTWO_STRIKE_IN_PLAY_SHIFT = -0.30  # ...and fights pitches off: more fouls\n\nBALLS_FOR_WALK = 4\nSTRIKES_FOR_STRIKEOUT = 3\n\n\n# ---------------------------------------------------------------------------\n# Handedness\n# ---------------------------------------------------------------------------\n\n\ndef throwing_hand(pitcher: Person, batter: Person) -> Handedness:\n    \"\"\"The hand the pitcher throws with in this matchup.\n\n    A switch pitcher picks the same side the batter hits from (R if the batter\n    is a switch hitter too, since the pitcher has to choose first).\n    \"\"\"\n    if pitcher.handedness is not Handedness.S:\n        return pitcher.handedness\n    return Handedness.L if batter.handedness is Handedness.L else Handedness.R\n\n\ndef batting_side(batter: Person, pitcher_hand: Handedness) -> Handedness:\n    \"\"\"The side the batter hits from. Switch hitters take the opposite side.\"\"\"\n    if batter.handedness is not Handedness.S:\n        return batter.handedness\n    return Handedness.L if pitcher_hand is Handedness.R else Handedness.R\n\n\n# ---------------------------------------------------------------------------\n# Probabilities for a matchup\n# ---------------------------------------------------------------------------\n\n\ndef location_probabilities(pitcher: PitcherRatings, balls: int = 0) -> dict[Location, float]:\n    probs = adjust(LOCATION_BASE, LOCATION_ACC_EFFECT, rating_gap(pitcher.acc))\n    if balls == BALLS_FOR_WALK - 1:\n        probs = adjust(probs, {Location.ZONE: THREE_BALL_ZONE_SHIFT}, 1)\n    return probs\n\n\ndef swing_probability(\n    location: Location, hitter: PositionRatings, pitcher: PitcherRatings, strikes: int = 0\n) -> float:\n    \"\"\"Chance the hitter swings at a pitch in this location.\"\"\"\n    two_strikes = strikes == STRIKES_FOR_STRIKEOUT - 1\n    match location:\n        case Location.ZONE:\n            shift = TWO_STRIKE_ZONE_SWING_SHIFT if two_strikes else 0.0\n            return chance(ZONE_SWING_BASE, ZONE_SWING_VEL_EFFECT, rating_gap(pitcher.vel), shift)\n        case Location.OUT_OF_ZONE:\n            shift = TWO_STRIKE_CHASE_SHIFT if two_strikes else 0.0\n            return chance(CHASE_BASE, CHASE_EYE_EFFECT, rating_gap(hitter.eye), shift)\n        case _:\n            return 0.0  # nobody swings at a wild pitch or one that hits them\n\n\ndef contact_probability(location: Location, con: int, pitcher: PitcherRatings) -> float:\n    \"\"\"Chance a swing makes contact (the rest are whiffs).\n\n    Hitter's con for this matchup (attack) vs pitcher's vel (defense).\n    \"\"\"\n    base = ZONE_CONTACT_BASE if location is Location.ZONE else CHASE_CONTACT_BASE\n    elite = max(0.0, rating_gap(pitcher.vel, ELITE_VEL_START))\n    shift = -ELITE_VEL_WHIFF_EFFECT * elite**2\n    return chance(base, CONTACT_CON_VS_VEL_EFFECT, rating_gap(con, pitcher.vel), shift)\n\n\ndef in_play_probability(location: Location, strikes: int = 0) -> float:\n    \"\"\"Chance contact is put in play (the rest are fouls).\"\"\"\n    base = ZONE_IN_PLAY_BASE if location is Location.ZONE else CHASE_IN_PLAY_BASE\n    shift = TWO_STRIKE_IN_PLAY_SHIFT if strikes == STRIKES_FOR_STRIKEOUT - 1 else 0.0\n    return chance(base, 0.0, 0.0, shift)\n\n\ndef team_defense(fielders: Sequence[Person]) -> float:\n    \"\"\"A defense rating: the average fld of the position players in the field.\"\"\"\n    ratings = [p.ratings for p in fielders]\n    flds = [r.fld for r in ratings if isinstance(r, PositionRatings)]\n    if len(flds) != len(ratings):\n        raise ValueError(\"Fielders must be position players.\")\n    return sum(flds) / len(flds)\n\n\n# ---------------------------------------------------------------------------\n# Plate appearance\n# ---------------------------------------------------------------------------\n\n\n@dataclass\nclass PitchEvent:\n    location: Location\n    swung: bool\n    result: Pitch\n\n\n@dataclass\nclass PlateAppearance:\n    hitter: Person\n    pitcher: Person\n    outcome: Outcome\n    pitcher_hand: Handedness = Handedness.R\n    bat_side: Handedness = Handedness.R\n    pitches: list[PitchEvent] = field(default_factory=list)\n    batted_ball: BattedBall | None = None  # set when the ball is put in play\n    finished: bool = False  # the plate appearance is over\n    balls: int = 0\n    strikes: int = 0\n    intentional: bool = False  # an intentional walk (no pitches thrown)\n\n    @property\n    def wild_pitches(self) -> int:\n        return sum(p.result is Pitch.WILD_PITCH for p in self.pitches)\n\n    def __str__(self) -> str:\n        play = f\", {self.batted_ball}\" if self.batted_ball else \"\"\n        return (\n            f\"{self.hitter.full_name} ({self.bat_side}) vs {self.pitcher.full_name} \"\n            f\"({self.pitcher_hand}): {self.outcome}{play} \"\n            f\"({self.balls}-{self.strikes}, {len(self.pitches)} pitches)\"\n        )\n\n\ndef throw_pitch(\n    hitter: PositionRatings,\n    pitcher: PitcherRatings,\n    rng: random.Random,\n    balls: int = 0,\n    strikes: int = 0,\n    con: int | None = None,\n) -> PitchEvent:\n    \"\"\"One pitch at the given count: location, then swing decision, then result.\n\n    con: the hitter's con for this matchup (defaults to con_r).\n    \"\"\"\n    con = hitter.con_r if con is None else con\n    location = pick(location_probabilities(pitcher, balls), rng)\n    if location is Location.WILD:\n        return PitchEvent(location, False, Pitch.WILD_PITCH)\n    if location is Location.HIT_BATTER:\n        return PitchEvent(location, False, Pitch.HIT_BY_PITCH)\n\n    if rng.random() >= swing_probability(location, hitter, pitcher, strikes):\n        taken = Pitch.CALLED_STRIKE if location is Location.ZONE else Pitch.BALL\n        return PitchEvent(location, False, taken)\n\n    if rng.random() >= contact_probability(location, con, pitcher):\n        return PitchEvent(location, True, Pitch.WHIFF)\n    if rng.random() >= in_play_probability(location, strikes):\n        return PitchEvent(location, True, Pitch.FOUL)\n    return PitchEvent(location, True, Pitch.IN_PLAY)\n\n\ndef plate_appearance_steps(\n    hitter: Person,\n    pitcher: Person,\n    rng: random.Random | None = None,\n    defense: Defense = RATING_MEAN,\n) -> Generator[PlateAppearance, None, PlateAppearance]:\n    \"\"\"Pitch by pitch: yields the plate appearance after every pitch.\n\n    The last yield has `finished` set (walk, strikeout, HBP or ball in play,\n    with the batted ball already resolved). Returns the finished plate appearance.\n    \"\"\"\n    if hitter.player_class is not PlayerClass.POSITION:\n        raise ValueError(f\"{hitter.full_name} is not a position player.\")\n    if pitcher.player_class is not PlayerClass.PITCHER:\n        raise ValueError(f\"{pitcher.full_name} is not a pitcher.\")\n    rng = rng or random.Random()\n    hit_r, pit_r = hitter.ratings, pitcher.ratings\n    assert isinstance(hit_r, PositionRatings) and isinstance(pit_r, PitcherRatings)\n\n    hand = throwing_hand(pitcher, hitter)\n    side = batting_side(hitter, hand)\n    con = hit_r.con_vs(hand)\n\n    pa = PlateAppearance(hitter, pitcher, Outcome.OUT, pitcher_hand=hand, bat_side=side)\n    while not pa.finished:\n        event = throw_pitch(hit_r, pit_r, rng, pa.balls, pa.strikes, con)\n        pa.pitches.append(event)\n        match event.result:\n            case Pitch.BALL | Pitch.WILD_PITCH:\n                pa.balls += 1\n                if pa.balls == BALLS_FOR_WALK:\n                    pa.outcome, pa.finished = Outcome.WALK, True\n            case Pitch.CALLED_STRIKE | Pitch.WHIFF:\n                pa.strikes += 1\n                if pa.strikes == STRIKES_FOR_STRIKEOUT:\n                    pa.outcome, pa.finished = Outcome.STRIKEOUT, True\n            case Pitch.FOUL:\n                if pa.strikes < STRIKES_FOR_STRIKEOUT - 1:\n                    pa.strikes += 1\n            case Pitch.HIT_BY_PITCH:\n                pa.outcome, pa.finished = Outcome.HIT_BY_PITCH, True\n            case Pitch.IN_PLAY:\n                pa.batted_ball = put_in_play(hit_r, pit_r, con, side, defense, rng)\n                pa.outcome, pa.finished = pa.batted_ball.outcome, True\n        yield pa\n    return pa\n\n\ndef simulate_plate_appearance(\n    hitter: Person,\n    pitcher: Person,\n    rng: random.Random | None = None,\n    defense: Defense = RATING_MEAN,\n) -> PlateAppearance:\n    \"\"\"Throw pitches until a walk, strikeout, HBP or ball in play.\n\n    defense: the fielders by position (e.g. a team's alignment), or a single\n        fld rating used for every fielder; 50 is average.\n    \"\"\"\n    return run_steps(plate_appearance_steps(hitter, pitcher, rng, defense))\n\n\ndef run_steps[T](steps: Generator[object, None, T]) -> T:\n    \"\"\"Run a step-by-step generator to the end and return its result.\"\"\"\n    while True:\n        try:\n            next(steps)\n        except StopIteration as done:\n            return done.value\n","veeone/awards.py":"\"\"\"Player value (WAR) and season awards (MVP).\n\nWAR (wins above replacement) adds up the runs a player was worth compared with\na replacement-level player, then divides by RUNS_PER_WIN.\n\nHitters:\n    batting      - weighted on-base average (wOBA) above the league's, times PA\n    baserunning  - steals and caught stealing\n    fielding     - outs made on balls hit to them vs. an average fielder\n    position     - harder positions get credit (full amount for a full season)\n    replacement  - a replacement player is this many runs worse per 600 PA\nPitchers:\n    runs saved vs. a replacement pitcher (who allows REPLACEMENT_RA9_FACTOR x the\n    league's runs per 9), over their innings.\n\nMVP: 30 simulated writers each rank their top 10 (14-9-8-...-1 points). Each\nwriter starts from WAR, adds a lean toward headline stats and contending teams,\nand their own random take. Pitchers are eligible.\n\nCy Young: pitchers only. 30 writers each rank their top 5 (7-4-3-2-1 points),\nstarting from WAR with a lean toward wins, ERA, strikeouts and saves.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom typing import Any\n\nfrom veeone.league import LeagueSeason\n\nRUNS_PER_WIN = 10\n\n# Linear weights for wOBA (runs each event is worth, roughly).\nWOBA_WEIGHTS = {\"bb\": 0.69, \"hbp\": 0.72, \"single\": 0.89, \"d\": 1.27, \"t\": 1.62, \"hr\": 2.10}\nWOBA_SCALE = 1.2\nSB_RUNS, CS_RUNS = 0.2, -0.4\nFIELDING_RUNS_PER_PLAY = 0.8  # a hit turned into an out (or the reverse)\nREPLACEMENT_RUNS_PER_600_PA = 20\nPOSITION_RUNS = {  # per full season\n    \"C\": 12.5, \"SS\": 7.5, \"2B\": 2.5, \"3B\": 2.5, \"CF\": 2.5,\n    \"LF\": -7.5, \"RF\": -7.5, \"1B\": -12.5, \"DH\": -17.5,\n}  # fmt: skip\nREPLACEMENT_RA9_FACTOR = 1.25\n\n# MVP vote\nVOTERS = 30\nBALLOT_POINTS = (14, 9, 8, 7, 6, 5, 4, 3, 2, 1)\nVOTER_NOISE = 0.9  # each writer's own take, in WAR\nPITCHER_BIAS = -0.8  # writers lean toward everyday players\nCONTENDER_BONUS = 6.0  # x (team win% - .500)\n\n\ndef _woba(b: dict[str, Any]) -> tuple[float, int]:\n    singles = b[\"h\"] - b[\"d\"] - b[\"t\"] - b[\"hr\"]\n    value = (\n        WOBA_WEIGHTS[\"bb\"] * (b[\"bb\"] - b.get(\"ibb\", 0))\n        + WOBA_WEIGHTS[\"hbp\"] * b[\"hbp\"]\n        + WOBA_WEIGHTS[\"single\"] * singles\n        + WOBA_WEIGHTS[\"d\"] * b[\"d\"]\n        + WOBA_WEIGHTS[\"t\"] * b[\"t\"]\n        + WOBA_WEIGHTS[\"hr\"] * b[\"hr\"]\n    )\n    return value, b[\"pa\"]\n\n\ndef add_war(data: dict[str, Any], season: LeagueSeason) -> None:\n    \"\"\"Add \"war\" (and its parts) to every batter and pitcher in season data.\"\"\"\n    batters, pitchers = data[\"batters\"], data[\"pitchers\"]\n    games = max(1, data[\"gamesPerTeam\"])\n\n    total_woba = sum(_woba(b)[0] for b in batters)\n    total_pa = sum(b[\"pa\"] for b in batters)\n    lg_woba = total_woba / total_pa if total_pa else 0.0\n\n    # League out rate by ball type, for fielding.\n    league_rate: dict[str, float] = {}\n    for kind in {k for f in season.fielding.values() for k in f}:\n        chances = sum(f.get(kind, [0, 0])[0] for f in season.fielding.values())\n        outs = sum(f.get(kind, [0, 0])[1] for f in season.fielding.values())\n        league_rate[kind] = outs / chances if chances else 0.0\n\n    for b in batters:\n        value, pa = _woba(b)\n        batting = ((value / pa - lg_woba) / WOBA_SCALE * pa) if pa else 0.0\n        baserunning = SB_RUNS * b[\"sb\"] + CS_RUNS * b[\"cs\"]\n        fielding = sum(\n            (outs - chances * league_rate.get(kind, 0.0)) * FIELDING_RUNS_PER_PLAY\n            for kind, (chances, outs) in season.fielding.get(b[\"name\"], {}).items()\n        )\n        position = POSITION_RUNS.get(b[\"pos\"], 0.0) * b[\"g\"] / games\n        replacement = REPLACEMENT_RUNS_PER_600_PA * pa / 600\n        runs = batting + baserunning + fielding + position + replacement\n        b[\"war\"] = round(runs / RUNS_PER_WIN, 1)\n        b[\"warParts\"] = {\n            \"bat\": round(batting, 1),\n            \"run\": round(baserunning, 1),\n            \"fld\": round(fielding, 1),\n            \"pos\": round(position, 1),\n            \"rep\": round(replacement, 1),\n        }\n\n    total_outs = sum(p[\"outs\"] for p in pitchers)\n    lg_ra9 = sum(p[\"r\"] for p in pitchers) * 27 / total_outs if total_outs else 0.0\n    rep_ra9 = lg_ra9 * REPLACEMENT_RA9_FACTOR\n    for p in pitchers:\n        ip = p[\"outs\"] / 3\n        ra9 = p[\"r\"] * 27 / p[\"outs\"] if p[\"outs\"] else 0.0\n        runs = (rep_ra9 - ra9) * ip / 9 if p[\"outs\"] else 0.0\n        p[\"war\"] = round(runs / RUNS_PER_WIN, 1)\n\n\ndef mvp_vote(data: dict[str, Any], seed: str) -> list[dict[str, Any]]:\n    \"\"\"Simulated MVP voting for a finished season (data must have WAR).\n\n    Returns everyone who got a vote, best first:\n    {name, team, kind, war, points, first}.\n    \"\"\"\n    rng = random.Random(seed)  # its own generator: voting never changes the games\n    win_pct = {t[\"name\"]: t[\"w\"] / max(1, t[\"w\"] + t[\"l\"]) for t in data[\"teams\"]}\n    candidates = []\n    for b in data[\"batters\"]:\n        avg = b[\"h\"] / b[\"ab\"] if b[\"ab\"] else 0.0\n        headline = 0.03 * b[\"hr\"] + 0.01 * b[\"rbi\"] + 8 * (avg - 0.250)\n        candidates.append((b, \"batter\", headline))\n    for p in data[\"pitchers\"]:\n        era = p[\"r\"] * 27 / p[\"outs\"] if p[\"outs\"] else 99.0\n        headline = 0.1 * p[\"w\"] + 0.05 * p[\"sv\"] - 0.3 * (era - 3.5) + PITCHER_BIAS\n        candidates.append((p, \"pitcher\", headline))\n    # Only realistic candidates get considered.\n    candidates.sort(key=lambda c: c[0][\"war\"], reverse=True)\n    candidates = candidates[:30]\n\n    tally: dict[str, dict[str, Any]] = {}\n    for _ in range(VOTERS):\n        scored = []\n        for player, kind, headline in candidates:\n            contender = CONTENDER_BONUS * (win_pct.get(player[\"team\"], 0.5) - 0.5)\n            score = player[\"war\"] + 0.5 * headline + contender + rng.gauss(0, VOTER_NOISE)\n            scored.append((score, player, kind))\n        scored.sort(key=lambda s: s[0], reverse=True)\n        for place, (_, player, kind) in enumerate(scored[: len(BALLOT_POINTS)]):\n            entry = tally.setdefault(\n                player[\"name\"],\n                {\n                    \"name\": player[\"name\"],\n                    \"team\": player[\"team\"],\n                    \"kind\": kind,\n                    \"war\": player[\"war\"],\n                    \"points\": 0,\n                    \"first\": 0,\n                },\n            )\n            entry[\"points\"] += BALLOT_POINTS[place]\n            entry[\"first\"] += place == 0\n    return sorted(tally.values(), key=lambda e: (e[\"points\"], e[\"first\"]), reverse=True)\n\n\nCY_BALLOT_POINTS = (7, 4, 3, 2, 1)\nCY_VOTER_NOISE = 0.7\n\n\ndef cy_young_vote(data: dict[str, Any], seed: str) -> list[dict[str, Any]]:\n    \"\"\"Simulated Cy Young voting (pitchers only). Same shape as `mvp_vote`.\"\"\"\n    rng = random.Random(seed)\n    candidates = []\n    for p in data[\"pitchers\"]:\n        if not p[\"outs\"]:\n            continue\n        era = p[\"r\"] * 27 / p[\"outs\"]\n        # Writers like wins, a low ERA, strikeouts, and (for closers) saves.\n        headline = 0.12 * p[\"w\"] - 0.6 * (era - 3.5) + 0.006 * p[\"so\"] + 0.04 * p[\"sv\"]\n        candidates.append((p, headline))\n    candidates.sort(key=lambda c: c[0][\"war\"], reverse=True)\n    candidates = candidates[:20]\n\n    tally: dict[str, dict[str, Any]] = {}\n    for _ in range(VOTERS):\n        scored = sorted(\n            (\n                (p[\"war\"] + 0.5 * headline + rng.gauss(0, CY_VOTER_NOISE), p)\n                for p, headline in candidates\n            ),\n            key=lambda s: s[0],\n            reverse=True,\n        )\n        for place, (_, p) in enumerate(scored[: len(CY_BALLOT_POINTS)]):\n            entry = tally.setdefault(\n                p[\"name\"],\n                {\"name\": p[\"name\"], \"team\": p[\"team\"], \"kind\": \"pitcher\", \"war\": p[\"war\"],\n                 \"points\": 0, \"first\": 0},\n            )  # fmt: skip\n            entry[\"points\"] += CY_BALLOT_POINTS[place]\n            entry[\"first\"] += place == 0\n    return sorted(tally.values(), key=lambda e: (e[\"points\"], e[\"first\"]), reverse=True)\n\n\ndef league_awards(data: dict[str, Any], seed: str) -> dict[str, Any]:\n    \"\"\"MVP and Cy Young among the teams and players in `data`.\"\"\"\n    mvp = mvp_vote(data, seed + \"-mvp\")\n    cy = cy_young_vote(data, seed + \"-cy\")\n    return {\n        \"mvp\": mvp[0][\"name\"] if mvp else None,\n        \"mvpVotes\": mvp[:10],\n        \"cy\": cy[0][\"name\"] if cy else None,\n        \"cyVotes\": cy[:5],\n    }\n\n\ndef season_awards(data: dict[str, Any], seed: str) -> dict[str, Any]:\n    \"\"\"All awards for a finished season: {\"leagues\": {league name: awards}}.\n\n    Each league votes on its own players (like the American and National Leagues).\n    \"\"\"\n    out = {}\n    for league in data.get(\"leagues\") or [\"\"]:\n        part = {\n            **data,\n            \"teams\": [t for t in data[\"teams\"] if t.get(\"league\", \"\") == league],\n            \"batters\": [b for b in data[\"batters\"] if b.get(\"league\", \"\") == league],\n            \"pitchers\": [p for p in data[\"pitchers\"] if p.get(\"league\", \"\") == league],\n        }\n        out[league] = league_awards(part, f\"{seed}-{league}\")\n    return {\"leagues\": out}\n","veeone/bases.py":"\"\"\"Baserunning: runner advancement on plate appearances, and stolen bases.\n\nStill simple stand-ins until fuller baserunning (fielders, outs on the bases,\nsac flies, double plays) is designed:\n    walk / HBP  -> batter to 1st; only forced runners move\n    single      -> runner on 3rd scores; runner on 2nd may score (else 3rd);\n                   runner on 1st to 2nd, may go to 3rd\n    double      -> runners on 2nd and 3rd score; runner on 1st may score (else 3rd)\n    triple      -> everyone scores; batter to 3rd\n    home run    -> everyone scores, batter too\n    out / K     -> nobody moves\n\nRatings (20-80 scale, same log-odds method as `veeone.atbat`):\n    spd -> runner takes the extra base more often; runs (attempts steals) more often\n    stl -> attempted steals succeed more often; good base stealers also run more\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom dataclasses import dataclass\n\nfrom veeone.atbat import Outcome, chance, rating_gap\nfrom veeone.person import Person, PositionRatings\n\n# The three bases: index 0 = first, 1 = second, 2 = third. None = empty.\ntype Bases = tuple[Person | None, Person | None, Person | None]\nEMPTY: Bases = (None, None, None)\n\n# ---------------------------------------------------------------------------\n# Tuning knobs. Base rates are for an average (50) runner.\n# ---------------------------------------------------------------------------\n\n# Taking the extra base on a hit. spd helps.\nSCORE_FROM_SECOND_ON_SINGLE = 0.60\nFIRST_TO_THIRD_ON_SINGLE = 0.28\nSCORE_FROM_FIRST_ON_DOUBLE = 0.40\nEXTRA_BASE_SPD_EFFECT = 0.45\n\n# Steal attempts, checked once before each plate appearance.\nSTEAL_SECOND_ATTEMPT_BASE = 0.065  # runner on 1st, 2nd open\nSTEAL_THIRD_ATTEMPT_BASE = 0.012  # runner on 2nd, 3rd open\nSTEAL_ATTEMPT_SPD_EFFECT = 0.50\nSTEAL_ATTEMPT_STL_EFFECT = 0.40\n# Steal success. stl decides it.\nSTEAL_SUCCESS_BASE = 0.78\nSTEAL_SUCCESS_STL_EFFECT = 0.45\n\n\ndef _ratings(runner: Person) -> PositionRatings:\n    ratings = runner.ratings\n    assert isinstance(ratings, PositionRatings)\n    return ratings\n\n\ndef extra_base_chance(base: float, runner: Person) -> float:\n    return chance(base, EXTRA_BASE_SPD_EFFECT, rating_gap(_ratings(runner).spd))\n\n\ndef steal_attempt_chance(base: float, runner: Person) -> float:\n    r = _ratings(runner)\n    with_spd = chance(base, STEAL_ATTEMPT_SPD_EFFECT, rating_gap(r.spd))\n    return chance(with_spd, STEAL_ATTEMPT_STL_EFFECT, rating_gap(r.stl))\n\n\ndef steal_success_chance(runner: Person) -> float:\n    return chance(STEAL_SUCCESS_BASE, STEAL_SUCCESS_STL_EFFECT, rating_gap(_ratings(runner).stl))\n\n\n# ---------------------------------------------------------------------------\n# Advancing on a plate appearance\n# ---------------------------------------------------------------------------\n\n\ndef advance(\n    bases: Bases, outcome: Outcome, batter: Person, rng: random.Random\n) -> tuple[Bases, list[Person]]:\n    \"\"\"Where everyone ends up after a plate appearance, and who scored.\"\"\"\n    first, second, third = bases\n    scored: list[Person] = []\n\n    match outcome:\n        case Outcome.WALK | Outcome.HIT_BY_PITCH:\n            if first is not None:\n                if second is not None:\n                    if third is not None:\n                        scored.append(third)\n                    third = second\n                second = first\n            first = batter\n\n        case Outcome.SINGLE:\n            if third is not None:\n                scored.append(third)\n                third = None\n            if second is not None:\n                if rng.random() < extra_base_chance(SCORE_FROM_SECOND_ON_SINGLE, second):\n                    scored.append(second)\n                else:\n                    third = second\n                second = None\n            if first is not None:\n                if third is None and rng.random() < extra_base_chance(\n                    FIRST_TO_THIRD_ON_SINGLE, first\n                ):\n                    third = first\n                else:\n                    second = first\n            first = batter\n\n        case Outcome.DOUBLE:\n            scored += [r for r in (third, second) if r is not None]\n            third = None\n            if first is not None:\n                if rng.random() < extra_base_chance(SCORE_FROM_FIRST_ON_DOUBLE, first):\n                    scored.append(first)\n                else:\n                    third = first\n            first, second = None, batter\n\n        case Outcome.TRIPLE:\n            scored += [r for r in (third, second, first) if r is not None]\n            first, second, third = None, None, batter\n\n        case Outcome.HOME_RUN:\n            scored += [r for r in (third, second, first) if r is not None]\n            scored.append(batter)\n            first, second, third = None, None, None\n\n        case Outcome.OUT | Outcome.STRIKEOUT:\n            pass\n\n    return (first, second, third), scored\n\n\n# ---------------------------------------------------------------------------\n# Stolen bases\n# ---------------------------------------------------------------------------\n\n\n@dataclass\nclass StealAttempt:\n    runner: Person\n    to_base: int  # 2 = second, 3 = third\n    success: bool\n\n\ndef maybe_steal(bases: Bases, rng: random.Random) -> tuple[Bases, StealAttempt | None]:\n    \"\"\"Before a plate appearance, the lead runner with an open base ahead may run.\n\n    Returns the new bases and the attempt (None if nobody ran). A runner who is\n    caught is removed from the bases; the caller adds the out.\n    \"\"\"\n    first, second, third = bases\n    if second is not None and third is None:\n        runner, base_rate, to_base = second, STEAL_THIRD_ATTEMPT_BASE, 3\n    elif first is not None and second is None:\n        runner, base_rate, to_base = first, STEAL_SECOND_ATTEMPT_BASE, 2\n    else:\n        return bases, None\n\n    if rng.random() >= steal_attempt_chance(base_rate, runner):\n        return bases, None\n\n    success = rng.random() < steal_success_chance(runner)\n    if to_base == 3:\n        new_bases: Bases = (first, None, runner if success else None)\n    else:\n        new_bases = (None, runner if success else None, third)\n    return new_bases, StealAttempt(runner, to_base, success)\n","veeone/battedball.py":"\"\"\"Where a ball in play goes, who fields it, and whether it falls for a hit.\n\nA ball in play is resolved in four steps:\n    1. Type       - ground ball, line drive, fly ball or pop-up.\n                    pow -> more fly balls. con (attack) vs mov (defense) ->\n                    more line drives, fewer pop-ups.\n    2. Direction  - pull, center or opposite field. pow -> pulls more.\n                    The batting side turns that into left/center/right field:\n                    a righty pulls to left, a lefty pulls to right.\n    3. Fielder    - the type and side pick the position that makes the play.\n    4. Result     - fly balls and line drives may leave the park: pow pushes\n                    them out, the pitcher's mov keeps them in (weaker contact).\n                    Otherwise: base hit rate for the type, shifted by\n                    con vs mov, the fielder's fld and spd (range), and on\n                    ground balls the batter's spd (beating out infield hits).\n                    The type decides what kind of hit it is (pow -> doubles,\n                    batter's spd -> triples).\n\nAll effects use the log-odds method in `veeone.odds`.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom collections.abc import Mapping\nfrom dataclasses import dataclass\nfrom enum import StrEnum\n\nfrom veeone.field import Position\nfrom veeone.odds import adjust, chance, pick, rating_gap\nfrom veeone.outcomes import Outcome\nfrom veeone.person import RATING_MEAN, Handedness, Person, PitcherRatings, PositionRatings\n\n\nclass BallType(StrEnum):\n    GROUND_BALL = \"ground ball\"\n    LINE_DRIVE = \"line drive\"\n    FLY_BALL = \"fly ball\"\n    POP_UP = \"pop-up\"\n\n\nclass Direction(StrEnum):\n    PULL = \"pull\"\n    CENTER = \"center\"\n    OPPOSITE = \"opposite\"\n\n\nclass FieldSide(StrEnum):\n    LEFT = \"left\"\n    CENTER = \"center\"\n    RIGHT = \"right\"\n\n\n# Who is in the field. Either the actual players by position, or one rating\n# (average fld) used for every fielder when there are no real fielders.\ntype Defense = Mapping[Position, Person] | float\n\n# ---------------------------------------------------------------------------\n# Tuning knobs. Base rates are for average (50) ratings / matchups.\n# Effects are log-odds shifts per 10 rating points (1 SD).\n# ---------------------------------------------------------------------------\n\n# 1. Type. Ground balls are the reference.\nTYPE_BASE: dict[BallType, float] = {\n    BallType.GROUND_BALL: 0.43,\n    BallType.LINE_DRIVE: 0.21,\n    BallType.FLY_BALL: 0.29,\n    BallType.POP_UP: 0.07,\n}\nTYPE_POW_EFFECT: dict[BallType, float] = {BallType.FLY_BALL: 0.20, BallType.POP_UP: 0.05}\nTYPE_CON_VS_MOV_EFFECT: dict[BallType, float] = {\n    BallType.LINE_DRIVE: 0.14,\n    BallType.POP_UP: -0.15,\n}\n\n# 2. Direction.\nDIRECTION_BASE: dict[Direction, float] = {\n    Direction.PULL: 0.40,\n    Direction.CENTER: 0.34,\n    Direction.OPPOSITE: 0.26,\n}\nDIRECTION_POW_EFFECT: dict[Direction, float] = {Direction.PULL: 0.15}\n\n# 3. Who fields it: (type, side of the field) -> chance each position makes the play.\nP, C, B1, B2, B3, SS, LF, CF, RF = (Position.from_number(n) for n in range(1, 10))\nFIELDER_ODDS: dict[tuple[BallType, FieldSide], dict[Position, float]] = {\n    (BallType.GROUND_BALL, FieldSide.LEFT): {B3: 0.50, SS: 0.50},\n    (BallType.GROUND_BALL, FieldSide.CENTER): {SS: 0.35, B2: 0.35, P: 0.30},\n    (BallType.GROUND_BALL, FieldSide.RIGHT): {B2: 0.50, B1: 0.50},\n    (BallType.LINE_DRIVE, FieldSide.LEFT): {LF: 0.60, SS: 0.25, B3: 0.15},\n    (BallType.LINE_DRIVE, FieldSide.CENTER): {CF: 0.70, SS: 0.15, B2: 0.15},\n    (BallType.LINE_DRIVE, FieldSide.RIGHT): {RF: 0.60, B2: 0.25, B1: 0.15},\n    (BallType.FLY_BALL, FieldSide.LEFT): {LF: 1.0},\n    (BallType.FLY_BALL, FieldSide.CENTER): {CF: 1.0},\n    (BallType.FLY_BALL, FieldSide.RIGHT): {RF: 1.0},\n    (BallType.POP_UP, FieldSide.LEFT): {B3: 0.50, SS: 0.30, C: 0.20},\n    (BallType.POP_UP, FieldSide.CENTER): {SS: 0.40, B2: 0.40, P: 0.20},\n    (BallType.POP_UP, FieldSide.RIGHT): {B1: 0.50, B2: 0.30, C: 0.20},\n}\n\n# 4a. Home runs: chance a ball of this type leaves the park.\n# pow drives it; the pitcher's mov suppresses it.\nHOME_RUN_BASE: dict[BallType, float] = {BallType.FLY_BALL: 0.145, BallType.LINE_DRIVE: 0.026}\nHOME_RUN_POW_EFFECT = 0.38\nHOME_RUN_MOV_EFFECT = -0.13\n\n# 4b. Chance a ball in the park is a hit, by type.\nHIT_BASE: dict[BallType, float] = {\n    BallType.GROUND_BALL: 0.245,\n    BallType.LINE_DRIVE: 0.68,\n    BallType.FLY_BALL: 0.13,\n    BallType.POP_UP: 0.02,\n}\nHIT_CON_VS_MOV_EFFECT = 0.12\nHIT_FIELDER_FLD_EFFECT = -0.12\nHIT_FIELDER_SPD_EFFECT = -0.06  # range\nHIT_BATTER_SPD_GROUND_BALL_EFFECT = 0.15  # infield hits\n\n# 4c. What kind of hit, by type. pow -> doubles; batter's spd -> triples.\nHIT_KIND_BASE: dict[BallType, dict[Outcome, float]] = {\n    BallType.GROUND_BALL: {Outcome.SINGLE: 0.92, Outcome.DOUBLE: 0.08},\n    BallType.LINE_DRIVE: {Outcome.SINGLE: 0.66, Outcome.DOUBLE: 0.32, Outcome.TRIPLE: 0.02},\n    BallType.FLY_BALL: {Outcome.SINGLE: 0.35, Outcome.DOUBLE: 0.58, Outcome.TRIPLE: 0.07},\n    BallType.POP_UP: {Outcome.SINGLE: 1.0},\n}\nHIT_KIND_POW_EFFECT: dict[Outcome, float] = {Outcome.DOUBLE: 0.20}\nHIT_KIND_SPD_EFFECT: dict[Outcome, float] = {Outcome.TRIPLE: 0.35, Outcome.DOUBLE: 0.05}\n\n\n# ---------------------------------------------------------------------------\n# Batted ball record\n# ---------------------------------------------------------------------------\n\n_TYPE_CODE = {\n    BallType.GROUND_BALL: \"G\",\n    BallType.LINE_DRIVE: \"L\",\n    BallType.FLY_BALL: \"F\",\n    BallType.POP_UP: \"P\",\n}\n_HIT_CODE = {Outcome.SINGLE: \"1B\", Outcome.DOUBLE: \"2B\", Outcome.TRIPLE: \"3B\"}\n\n\n@dataclass\nclass BattedBall:\n    type: BallType\n    direction: Direction\n    side: FieldSide\n    fielder: Position  # who made (or tried to make) the play\n    outcome: Outcome  # OUT, SINGLE, DOUBLE, TRIPLE or HOME_RUN\n\n    @property\n    def notation(self) -> str:\n        \"\"\"Scorekeeping shorthand, e.g. 6-3, F8, L7, P2, 1B-9, HR-7.\"\"\"\n        n = self.fielder.number\n        if self.outcome is Outcome.HOME_RUN:\n            return f\"HR-{n}\"\n        if self.outcome is not Outcome.OUT:\n            return f\"{_HIT_CODE[self.outcome]}-{n}\"\n        if self.type is BallType.GROUND_BALL:\n            return \"3U\" if self.fielder is Position.FIRST_BASE else f\"{n}-3\"\n        return f\"{_TYPE_CODE[self.type]}{n}\"\n\n    def __str__(self) -> str:\n        return f\"{self.type} to {self.fielder} ({self.notation})\"\n\n\n# ---------------------------------------------------------------------------\n# Probabilities\n# ---------------------------------------------------------------------------\n\n\ndef type_probabilities(\n    hitter: PositionRatings, pitcher: PitcherRatings, con: int\n) -> dict[BallType, float]:\n    probs = adjust(TYPE_BASE, TYPE_POW_EFFECT, rating_gap(hitter.pow))\n    return adjust(probs, TYPE_CON_VS_MOV_EFFECT, rating_gap(con, pitcher.mov))\n\n\ndef direction_probabilities(hitter: PositionRatings) -> dict[Direction, float]:\n    return adjust(DIRECTION_BASE, DIRECTION_POW_EFFECT, rating_gap(hitter.pow))\n\n\ndef field_side(direction: Direction, bat_side: Handedness) -> FieldSide:\n    \"\"\"Righties pull to left field, lefties to right field.\"\"\"\n    if direction is Direction.CENTER:\n        return FieldSide.CENTER\n    pulls_left = bat_side is not Handedness.L\n    if (direction is Direction.PULL) == pulls_left:\n        return FieldSide.LEFT\n    return FieldSide.RIGHT\n\n\ndef fielder_ratings(defense: Defense, position: Position) -> tuple[float, float]:\n    \"\"\"(fld, spd) of whoever plays this position. Pitchers count as average.\"\"\"\n    if isinstance(defense, int | float):\n        return float(defense), RATING_MEAN\n    player = defense.get(position)\n    if player is None or not isinstance(player.ratings, PositionRatings):\n        return RATING_MEAN, RATING_MEAN\n    return player.ratings.fld, player.ratings.spd\n\n\ndef home_run_probability(\n    ball_type: BallType, hitter: PositionRatings, pitcher: PitcherRatings | None = None\n) -> float:\n    \"\"\"Chance a ball of this type leaves the park. No pitcher = average (mov 50).\"\"\"\n    base = HOME_RUN_BASE.get(ball_type)\n    if base is None:\n        return 0.0\n    mov = pitcher.mov if pitcher is not None else RATING_MEAN\n    shift = HOME_RUN_MOV_EFFECT * rating_gap(mov)\n    return chance(base, HOME_RUN_POW_EFFECT, rating_gap(hitter.pow), shift)\n\n\ndef hit_probability(\n    ball_type: BallType,\n    hitter: PositionRatings,\n    pitcher: PitcherRatings,\n    con: int,\n    fielder: tuple[float, float] = (RATING_MEAN, RATING_MEAN),\n) -> float:\n    \"\"\"Chance a ball that stays in the park falls for a hit.\"\"\"\n    fld, spd = fielder\n    shift = HIT_FIELDER_FLD_EFFECT * rating_gap(fld) + HIT_FIELDER_SPD_EFFECT * rating_gap(spd)\n    if ball_type is BallType.GROUND_BALL:\n        shift += HIT_BATTER_SPD_GROUND_BALL_EFFECT * rating_gap(hitter.spd)\n    gap = rating_gap(con, pitcher.mov)\n    return chance(HIT_BASE[ball_type], HIT_CON_VS_MOV_EFFECT, gap, shift)\n\n\ndef hit_kind_probabilities(ball_type: BallType, hitter: PositionRatings) -> dict[Outcome, float]:\n    probs = adjust(HIT_KIND_BASE[ball_type], HIT_KIND_POW_EFFECT, rating_gap(hitter.pow))\n    return adjust(probs, HIT_KIND_SPD_EFFECT, rating_gap(hitter.spd))\n\n\n# ---------------------------------------------------------------------------\n# Resolving a ball in play\n# ---------------------------------------------------------------------------\n\n\ndef put_in_play(\n    hitter: PositionRatings,\n    pitcher: PitcherRatings,\n    con: int,\n    bat_side: Handedness,\n    defense: Defense,\n    rng: random.Random,\n) -> BattedBall:\n    \"\"\"Type, direction, fielder, then hit or out.\"\"\"\n    ball_type = pick(type_probabilities(hitter, pitcher, con), rng)\n    direction = pick(direction_probabilities(hitter), rng)\n    side = field_side(direction, bat_side)\n    fielder = pick(FIELDER_ODDS[(ball_type, side)], rng)\n\n    if rng.random() < home_run_probability(ball_type, hitter, pitcher):\n        outfielder = {FieldSide.LEFT: LF, FieldSide.CENTER: CF, FieldSide.RIGHT: RF}[side]\n        return BattedBall(ball_type, direction, side, outfielder, Outcome.HOME_RUN)\n\n    p_hit = hit_probability(ball_type, hitter, pitcher, con, fielder_ratings(defense, fielder))\n    if rng.random() >= p_hit:\n        return BattedBall(ball_type, direction, side, fielder, Outcome.OUT)\n    kind = pick(hit_kind_probabilities(ball_type, hitter), rng)\n    return BattedBall(ball_type, direction, side, fielder, kind)\n","veeone/boxscore.py":"\"\"\"A game's box score as plain data: every batter's and pitcher's line for that\ngame, plus the usual notes (2B, 3B, HR, SB, CS, HBP, WP, LOB, pitches-strikes).\n\nSeason totals (the numbers in parentheses, AVG, ERA, W-L records) are filled in\nby the page from the season stats, so this only describes the one game.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Any\n\nfrom veeone.atbat import Pitch\nfrom veeone.league import TeamGame\nfrom veeone.outcomes import Outcome\nfrom veeone.person import Person\nfrom veeone.season import GameResult\nfrom veeone.team import Team\n\n# Pitches that count as strikes in \"pitches-strikes\".\nSTRIKE_PITCHES = (Pitch.CALLED_STRIKE, Pitch.WHIFF, Pitch.FOUL, Pitch.IN_PLAY)\n\n\ndef _batting(team: Team, batting: GameResult) -> list[dict[str, Any]]:\n    lines = []\n    for player in team.lineup:\n        mine = [p for p in batting.plays if p.pa.hitter is player]\n        outcomes = [p.pa.outcome for p in mine]\n        steals = [a for _, a in batting.steals if a.runner is player]\n        lines.append(\n            {\n                \"name\": player.full_name,\n                \"pos\": str(player.position),\n                \"pa\": len(mine),\n                \"ab\": sum(o not in (Outcome.WALK, Outcome.HIT_BY_PITCH) for o in outcomes),\n                \"r\": sum(player is r for p in batting.plays for r in p.scored),\n                \"h\": sum(o.is_hit for o in outcomes),\n                \"d\": outcomes.count(Outcome.DOUBLE),\n                \"t\": outcomes.count(Outcome.TRIPLE),\n                \"hr\": outcomes.count(Outcome.HOME_RUN),\n                \"rbi\": sum(p.rbi for p in mine),\n                \"bb\": outcomes.count(Outcome.WALK),\n                \"ibb\": sum(p.pa.intentional for p in mine),\n                \"hbp\": outcomes.count(Outcome.HIT_BY_PITCH),\n                \"so\": outcomes.count(Outcome.STRIKEOUT),\n                \"sb\": sum(a.success for a in steals),\n                \"cs\": sum(not a.success for a in steals),\n            }\n        )\n    return lines\n\n\ndef _pitching(\n    team: Team, used: list[Person], against: GameResult, game: TeamGame\n) -> list[dict[str, Any]]:\n    lines = []\n    for pitcher in used:\n        faced = [p for p in against.plays if p.pa.pitcher is pitcher]\n        outcomes = [p.pa.outcome for p in faced]\n        pitches = [e for p in faced for e in p.pa.pitches]\n        decision = None\n        if pitcher is game.winning_pitcher:\n            decision = \"W\"\n        elif pitcher is game.losing_pitcher:\n            decision = \"L\"\n        elif pitcher is game.save:\n            decision = \"S\"\n        lines.append(\n            {\n                \"name\": pitcher.full_name,\n                \"role\": team.role(pitcher),\n                \"started\": pitcher is used[0],\n                \"outs\": against.outs_by(pitcher),\n                \"bf\": len(faced),\n                \"h\": sum(o.is_hit for o in outcomes),\n                \"r\": against.runs_charged_to(pitcher),\n                \"bb\": outcomes.count(Outcome.WALK),\n                \"ibb\": sum(p.pa.intentional for p in faced),\n                \"so\": outcomes.count(Outcome.STRIKEOUT),\n                \"hr\": outcomes.count(Outcome.HOME_RUN),\n                \"pitches\": len(pitches),\n                \"strikes\": sum(e.result in STRIKE_PITCHES for e in pitches),\n                \"wp\": sum(e.result is Pitch.WILD_PITCH for e in pitches),\n                \"hbp\": [\n                    p.pa.hitter.full_name for p in faced if p.pa.outcome is Outcome.HIT_BY_PITCH\n                ],\n                \"decision\": decision,\n            }\n        )\n    return lines\n\n\ndef box_score(game: TeamGame) -> dict[str, Any]:\n    \"\"\"The box score so far (complete once the game is finished).\"\"\"\n    sides = {}\n    for key, team, batting, against, staff in (\n
